<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Foundations QBank</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{
  --paper:#F2F3EF; --ink:#1B2431; --mute:#6B7480; --line:#D5D8D2;
  --card:#FBFBF9; --blue:#2B4C7E; --blue-soft:#E3E9F3;
  --ok:#2C7A5A; --ok-soft:#DFF0E7; --bad:#B3382F; --bad-soft:#F6E1DE;
  --flag:#B8862B;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#161B22;--ink:#E8EAE6;--mute:#8B93A0;--line:#2C333D;--card:#1E242D;
        --blue:#8FB0E0;--blue-soft:#243347;--ok:#5FC08F;--ok-soft:#1F3A2E;--bad:#E07A70;--bad-soft:#42262A;--flag:#D9A94A}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:18px 18px 60px}
h1{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.1;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 26px}
.group{margin:0 0 30px}
.group h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.group h2 small{font-family:var(--sans);font-size:14px;color:var(--mute);font-weight:400}
.lec{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:13px 4px;border-top:1px solid var(--line)}
.lec:last-of-type{border-bottom:1px solid var(--line)}
.lec .n{font-family:var(--serif);color:var(--mute);min-width:26px;padding-top:2px;font-size:16px}
.lec .t{font-family:var(--serif);font-size:19px;line-height:1.25;flex:1}
.lec .m{font-size:13px;color:var(--mute);margin-top:3px;font-family:var(--sans)}
.lec .s{font-size:13px;color:var(--mute);white-space:nowrap;padding-top:4px}
.lec .s b{color:var(--ink);font-weight:600}
.lec .s b.w{color:var(--bad)}.lec .s b.g{color:var(--ok)}
.lec.all .t{font-style:italic}
.lec:active{background:var(--blue-soft)}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:10}
.sheet.on{display:flex}
.panel{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;padding:20px 20px 30px;max-height:88vh;overflow:auto}
.panel h3{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 2px;line-height:1.2}
.panel .sub{margin-bottom:18px}
.row{display:flex;gap:8px;margin:8px 0 16px;flex-wrap:wrap}
.row .lab{width:100%;font-size:13px;color:var(--mute);margin-bottom:-4px}
.chip{flex:1;min-width:80px;padding:11px 10px;border:1px solid var(--line);border-radius:10px;text-align:center;font-size:15px;background:var(--paper)}
.chip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:600}
.chip:disabled{opacity:.4}
.go{width:100%;padding:15px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;font-size:17px;margin-top:6px}
@media (prefers-color-scheme:dark){.go{color:#0F1520}}
.ghost{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);margin-top:8px;font-size:15px}
/* question */
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin-bottom:8px}
.top button{color:var(--blue);padding:6px 0}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.kind{font-size:13px;color:var(--mute);margin-bottom:8px}
.stem{font-size:19px;line-height:1.45;margin:0 0 20px}
.stem.step{font-family:var(--serif);font-size:20px;line-height:1.5}
.opt{display:flex;gap:12px;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:var(--card);align-items:flex-start;line-height:1.35}
.opt .k{font-family:var(--serif);color:var(--mute);min-width:18px}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.exp{margin-top:18px;padding:16px;border-left:3px solid var(--line);background:var(--card);border-radius:0 12px 12px 0;font-size:16px;line-height:1.5}
.exp.ok{border-left-color:var(--ok)}.exp.bad{border-left-color:var(--bad)}
.exp .v{font-weight:600;margin-bottom:6px}
.exp .v.ok{color:var(--ok)}.exp .v.bad{color:var(--bad)}
.exp .note{margin-top:10px;padding:10px 12px;background:var(--bad-soft);border-radius:8px;font-size:15px}
.exp .src{margin-top:10px;font-size:13px;color:var(--mute)}
.acts{display:flex;gap:8px;margin-top:18px}
.acts .next{flex:1;padding:14px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.acts .next{color:#0F1520}}
.acts .flag{padding:14px 16px;border-radius:12px;border:1px solid var(--line)}
.acts .flag.on{border-color:var(--flag);color:var(--flag)}
/* results */
.big{font-family:var(--serif);font-size:64px;line-height:1;margin:14px 0 2px;font-weight:500}
.big small{font-size:22px;color:var(--mute)}
.tbl{width:100%;border-collapse:collapse;margin:22px 0;font-size:15px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:last-child{text-align:right;white-space:nowrap}
.tbl .w{color:var(--bad);font-weight:600}.tbl .g{color:var(--ok);font-weight:600}
.miss{padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.miss .q{margin-bottom:4px}
.miss .a{color:var(--mute);font-size:14px}
.hist{font-size:14px;color:var(--mute);margin:26px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.hist button{color:var(--blue)}
.hide{display:none}
</style>
</head>

: "F-ANA-L01-0004", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L01", "system": "General", "type": "recall", "stem": "Moving the sole of the foot to face laterally is called", "options": ["Eversion", "Inversion", "Pronation", "Dorsiflexion", "Abduction"], "answer": 0, "explanation": "Eversion turns the sole outward, inversion turns it inward. Pronation and supination describe the forearm. Dorsiflexion and plantarflexion describe the ankle.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L01-0005", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L01", "system": "General", "type": "recall", "stem": "Rotating the forearm so the palm faces posteriorly is", "options": ["Pronation", "Supination", "Medial rotation of the shoulder", "Circumduction", "Adduction"], "answer": 0, "explanation": "Pronation crosses the radius over the ulna, turning the palm backward from the anatomical position. Supination returns it to palm-forward. Holding a bowl of soup is supination.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L01-0006", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L01", "system": "General", "type": "recall", "stem": "The term ipsilateral means", "options": ["On the same side of the body", "On the opposite side of the body", "Toward the midline", "Away from the trunk", "On the surface"], "answer": 0, "explanation": "Ipsilateral is same side; contralateral is opposite side. These become essential in neurology when a lesion on one side of the brainstem produces signs on the opposite side of the body.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L01-0007", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L01", "system": "General", "type": "recall", "stem": "In the Trendelenburg position the patient lies", "options": ["Supine with the head lower than the feet", "Prone with the head raised", "Supine with the head raised", "On the left side with the right leg flexed", "Sitting upright"], "answer": 0, "explanation": "Trendelenburg tilts the supine patient head-down, used to improve venous return in hypotension and to displace abdominal contents cranially during pelvic surgery. Reverse Trendelenburg is head-up.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L01-0008", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L01", "system": "General", "type": "recall", "stem": "Deep fascia in the limbs", "options": ["Forms dense sleeves that separate muscles into compartments", "Contains most of the subcutaneous fat", "Is loose and mobile over the muscles", "Is absent in the lower limb", "Lies superficial to the subcutaneous tissue"], "answer": 0, "explanation": "Deep fascia is a tough investing layer that sends intermuscular septa to bone, creating osteofascial compartments. Because it does not stretch, swelling inside a compartment raises pressure and causes compartment syndrome.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L01-0009", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L01", "system": "General", "type": "recall", "stem": "The superficial fascia", "options": ["Lies between the dermis and the deep fascia and contains fat and cutaneous nerves", "Is a dense sheet that separates muscle groups", "Lines the body cavities", "Surrounds individual muscle fibres", "Is synonymous with the periosteum"], "answer": 0, "explanation": "Superficial fascia is the subcutaneous tissue: loose connective tissue, fat, cutaneous vessels and nerves, and sweat glands. It lets skin slide over the deep fascia.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L01-0010", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L01", "system": "General", "type": "recall", "stem": "A vein carrying deoxygenated blood is distinguished from an artery by", "options": ["The direction of flow toward the heart", "The oxygen content of the blood", "Wall thickness only", "The presence of an endothelium", "The colour of the blood"], "answer": 0, "explanation": "Arteries carry blood away from the heart, veins toward it. The pulmonary arteries carry deoxygenated blood and the pulmonary veins oxygenated blood, so oxygen content does not define the vessel.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L01-0011", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L01", "system": "General", "type": "recall", "stem": "An anastomosis between arteries is important because it", "options": ["Provides a collateral route if the main channel is occluded", "Increases the blood pressure in the tissue", "Prevents venous return", "Marks the boundary between two organs", "Eliminates the need for capillaries"], "answer": 0, "explanation": "Arterial anastomoses provide alternative pathways. Their absence defines end arteries (retina, spleen, kidney, appendicular artery) where occlusion produces infarction.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L01-0012", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L01", "system": "General", "type": "recall", "stem": "Venae comitantes are", "options": ["Paired veins accompanying an artery, usually in the limbs", "Valveless veins of the vertebral column", "Veins draining the heart wall", "Superficial veins of the upper limb", "Portal veins linking two capillary beds"], "answer": 0, "explanation": "Deep arteries of the limbs are flanked by two veins that share the arterial sheath; arterial pulsation compresses them and aids venous return.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L01-0013", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L01", "system": "General", "type": "recall", "stem": "A portal venous system is one that", "options": ["Connects two capillary beds without passing through the heart", "Drains directly into the right atrium", "Carries oxygenated blood to the liver", "Runs parallel to a lymphatic trunk", "Is confined to the limbs"], "answer": 0, "explanation": "The hepatic portal system carries gut capillary blood to the liver sinusoids before it returns to the heart. The hypophyseal portal system is the other example.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L01-0014", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L01", "system": "General", "type": "recall", "stem": "Lymph from the right upper limb, right side of the head, and right thorax drains to the", "options": ["Right lymphatic duct", "Thoracic duct", "Cisterna chyli", "Right internal jugular vein directly", "Azygos vein"], "answer": 0, "explanation": "The right lymphatic duct drains the right upper quadrant of the body into the right venous angle. Everything else, including both lower limbs and the abdomen, goes to the thoracic duct on the left.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L01-0015", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L01", "system": "General", "type": "recall", "stem": "Peripheral nerve axons are myelinated by", "options": ["Schwann cells", "Oligodendrocytes", "Astrocytes", "Microglia", "Ependymal cells"], "answer": 0, "explanation": "Schwann cells myelinate one internode of one axon in the PNS; oligodendrocytes myelinate several axons in the CNS. This difference underlies why peripheral nerves regenerate and central axons largely do not.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L01-0016", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L01", "system": "General", "type": "step", "stem": "A patient is described as having a lesion in the left cerebral hemisphere that produces weakness of the right arm. Which term correctly describes the relationship between the lesion and the weakness?", "options": ["Contralateral", "Ipsilateral", "Bilateral", "Proximal", "Superficial"], "answer": 0, "explanation": "The corticospinal tract crosses in the medulla, so a hemispheric lesion produces contralateral weakness. Ipsilateral signs from a cortical lesion would suggest a different pathway.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L01-0017", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L01", "system": "General", "type": "step", "stem": "A runner develops severe pain in the anterior leg after a long race. The compartment is tense and passive stretching of the toes worsens the pain. Which anatomical structure is most responsible for the rise in pressure?", "options": ["The deep fascia enclosing the compartment", "The superficial fascia over the compartment", "The periosteum covering the tibia", "The skin over the anterior leg", "The interosseous membrane between the bones"], "answer": 0, "explanation": "Deep fascia does not yield, so swelling of exercised muscle within an osteofascial compartment raises pressure until perfusion stops. Fasciotomy is the treatment.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L01-0018", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L01", "system": "General", "type": "step", "stem": "A man has an occluded central retinal artery and loses vision in that eye permanently within an hour. Which of the following anatomical features of this vessel explains the outcome?", "options": ["It is an end artery with no anastomotic supply to the inner retina", "It is a portal vessel", "It lacks an endothelium", "It carries deoxygenated blood", "It is a vena comitans of the ophthalmic vein"], "answer": 0, "explanation": "End arteries have no collaterals. Occlusion of the central retinal artery, like the splenic and renal segmental arteries and the appendicular artery, produces infarction of the whole territory.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0001", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "recall", "stem": "In the adult the spinal cord ends at the level of", "options": ["L1/L2 intervertebral disc", "L3/L4 intervertebral disc", "S2 vertebra", "T12 vertebra", "L5 vertebra"], "answer": 0, "explanation": "The conus medullaris lies at the L1/L2 disc in adults (L3 in newborns). The dural sac continues to S2, so lumbar puncture below L2 enters the subarachnoid space without touching the cord.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0002", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "recall", "stem": "Lumbar puncture is safely performed at the", "options": ["L3/L4 or L4/L5 interspace", "L1/L2 interspace", "T12/L1 interspace", "S1/S2 interspace", "L5/S1 interspace only"], "answer": 0, "explanation": "Below the conus the only structures in the subarachnoid space are the cauda equina, which floats away from the needle. The iliac crests mark the L4 spine (supracristal plane).", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0003", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "recall", "stem": "The layers crossed by a lumbar puncture needle, in order, are", "options": ["Skin, supraspinous ligament, interspinous ligament, ligamentum flavum, epidural space, dura, arachnoid", "Skin, ligamentum flavum, interspinous ligament, supraspinous ligament, dura, arachnoid, pia", "Skin, supraspinous ligament, ligamentum flavum, interspinous ligament, dura, arachnoid", "Skin, interspinous ligament, supraspinous ligament, epidural space, dura, pia", "Skin, supraspinous ligament, interspinous ligament, dura, ligamentum flavum, arachnoid"], "answer": 0, "explanation": "The ligamentum flavum gives the characteristic resistance then give; the dura and arachnoid are pierced together as the second pop. The pia is never crossed. The epidural space contains fat and the internal vertebral venous plexus.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0004", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "recall", "stem": "The filum terminale is", "options": ["A strand of pia mater anchoring the conus to the coccyx", "The bundle of nerve roots below the conus", "The terminal part of the dural sac", "A lateral extension of pia that anchors the cord to dura", "The terminal branch of the anterior spinal artery"], "answer": 0, "explanation": "The filum terminale is pial; the cauda equina is the roots; the denticulate ligaments are the lateral pial extensions that suspend the cord in the dural sac between the roots.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0005", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "recall", "stem": "Denticulate ligaments are extensions of the", "options": ["Pia mater", "Dura mater", "Arachnoid mater", "Ligamentum flavum", "Posterior longitudinal ligament"], "answer": 0, "explanation": "The 21 pairs of tooth-like denticulate ligaments are pial, attaching to the dura between the dorsal and ventral roots, and stabilise the cord against movement.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0006", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "recall", "stem": "There are how many pairs of spinal nerves?", "options": ["31", "30", "33", "24", "12"], "answer": 0, "explanation": "8 cervical, 12 thoracic, 5 lumbar, 5 sacral, 1 coccygeal. There are 8 cervical nerves but 7 cervical vertebrae because C1 exits above C1 and C8 exits below C7.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0007", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "recall", "stem": "The C8 spinal nerve exits", "options": ["Between the C7 and T1 vertebrae", "Above the C7 vertebra", "Between the C6 and C7 vertebrae", "Below the T1 vertebra", "Through the C8 intervertebral foramen"], "answer": 0, "explanation": "Cervical nerves exit above their numbered vertebra; C8 has no vertebra and exits between C7 and T1. From T1 down every nerve exits below its numbered vertebra.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0008", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "recall", "stem": "The dorsal root of a spinal nerve carries", "options": ["Sensory fibres only", "Motor fibres only", "Mixed sensory and motor fibres", "Sympathetic fibres only", "Parasympathetic fibres only"], "answer": 0, "explanation": "Dorsal roots are sensory with cell bodies in the dorsal root ganglion; ventral roots are motor (somatic and, at T1-L2 and S2-S4, autonomic preganglionic). They merge into a mixed spinal nerve at the foramen.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0009", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "recall", "stem": "Cell bodies of primary sensory neurons are located in the", "options": ["Dorsal root ganglion", "Dorsal horn of the spinal cord", "Ventral horn of the spinal cord", "Sympathetic chain ganglion", "Lateral horn"], "answer": 0, "explanation": "Pseudounipolar sensory neurons have their bodies in the dorsal root ganglion outside the cord. Motor neuron bodies are in the ventral horn; preganglionic sympathetic bodies are in the lateral horn.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0010", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "recall", "stem": "The lateral horn of grey matter is present at spinal levels", "options": ["T1-L2", "C1-C8", "L3-S1", "S2-S4 only", "All levels"], "answer": 0, "explanation": "The intermediolateral cell column (lateral horn) holds preganglionic sympathetic neurons from T1 to L2. Parasympathetic preganglionic cells at S2-S4 sit in a similar position but do not form a visible horn.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0011", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "recall", "stem": "After exiting the intervertebral foramen, a spinal nerve divides into", "options": ["A dorsal ramus and a ventral ramus, both mixed", "A dorsal root and a ventral root", "A sensory branch and a motor branch", "A white ramus and a grey ramus", "A cutaneous branch and a muscular branch"], "answer": 0, "explanation": "Rami are mixed. Dorsal rami supply the intrinsic back muscles and skin of the back; ventral rami form the plexuses and intercostal nerves and supply everything else.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0012", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "recall", "stem": "The intrinsic muscles of the back are innervated by", "options": ["Dorsal rami of spinal nerves", "Ventral rami of spinal nerves", "The brachial plexus", "The accessory nerve", "The lumbar plexus"], "answer": 0, "explanation": "Erector spinae and transversospinalis are supplied segmentally by dorsal rami. The extrinsic back muscles (trapezius, latissimus) are limb muscles innervated by ventral rami or the accessory nerve.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0013", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "recall", "stem": "The grey ramus communicans carries", "options": ["Postganglionic sympathetic fibres from the chain ganglion to the spinal nerve", "Preganglionic sympathetic fibres from the spinal nerve to the chain", "Sensory fibres from the viscera", "Parasympathetic fibres to the gut", "Somatic motor fibres"], "answer": 0, "explanation": "White rami (myelinated, T1-L2 only) carry preganglionic fibres into the chain. Grey rami (unmyelinated, at every level) carry postganglionic fibres back to every spinal nerve for sweat glands, vessels and arrector pili.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0014", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "recall", "stem": "A dermatome is defined as", "options": ["The area of skin supplied by a single spinal nerve through both its rami", "The muscle group supplied by a single spinal nerve", "The skin supplied by a single peripheral nerve", "The territory of a single cutaneous artery", "The region drained by one lymph node"], "answer": 0, "explanation": "Dermatomes are segmental (spinal nerve); peripheral nerve fields are not, because plexuses redistribute fibres. Herpes zoster follows a dermatome because it lives in a single dorsal root ganglion.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0015", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "recall", "stem": "The dermatome at the nipple is", "options": ["T4", "T2", "T6", "T10", "C8"], "answer": 0, "explanation": "T4 nipple, T6 xiphoid, T10 umbilicus, L1 inguinal region, C6 thumb, C7 middle finger, C8 little finger, L5 great toe, S1 little toe and heel.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0016", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "recall", "stem": "The dermatome of the thumb is", "options": ["C6", "C5", "C7", "C8", "T1"], "answer": 0, "explanation": "C6 thumb, C7 middle finger, C8 little finger, T1 medial forearm. These help localise cervical disc prolapse.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0017", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "recall", "stem": "Visceral afferent fibres carrying pain from the abdominal organs mostly travel with", "options": ["Sympathetic fibres back to the T5-L2 spinal segments", "Parasympathetic fibres in the vagus", "Somatic fibres in the intercostal nerves", "The phrenic nerve", "Pelvic splanchnic nerves only"], "answer": 0, "explanation": "Most visceral pain from thoracic and abdominal viscera runs with sympathetic fibres to the thoracolumbar cord, which is why it is referred to dermatomes T5-L2. Pelvic viscera below the pain line use pelvic splanchnics to S2-S4.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0018", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "step", "stem": "A 30-year-old woman has a painful vesicular rash in a band around the left side of her trunk at the level of the umbilicus, not crossing the midline. In which structure is the causative virus reactivating?", "options": ["The left T10 dorsal root ganglion", "The left T10 ventral horn", "The left sympathetic chain ganglion at T10", "The left T10 dorsal horn", "The skin of the T10 dermatome"], "answer": 0, "explanation": "Herpes zoster is reactivation of latent varicella virus in a dorsal root ganglion. The rash is confined to the dermatome of that ganglion; the umbilical level is T10.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0019", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "step", "stem": "A 45-year-old has a prolapsed intervertebral disc compressing the nerve root that exits below the L4 vertebra. Which of the following combinations of findings would be expected?", "options": ["Weak dorsiflexion of the great toe and numbness over the dorsum of the foot to the great toe", "Weak plantarflexion and numbness of the lateral foot and heel", "Weak knee extension and numbness of the medial leg", "Weak hip flexion and numbness of the anterior thigh", "Weak hip abduction and numbness of the buttock"], "answer": 0, "explanation": "In the lumbar spine a posterolateral disc prolapse usually spares the root exiting at that level and compresses the root passing to the next level, so an L4/L5 disc affects L5. L5 supplies extensor hallucis longus and the dermatome over the dorsum of the foot to the great toe.", "tags": ["step1-hy", "verify"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0020", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "step", "stem": "An anaesthetist performs a lumbar puncture at L3/L4. After the second give she withdraws the stylet and clear fluid drips. Through which meningeal layers has the needle passed?", "options": ["Dura and arachnoid", "Dura only", "Dura, arachnoid and pia", "Arachnoid only", "Pia only"], "answer": 0, "explanation": "CSF is in the subarachnoid space, so the needle has crossed dura and arachnoid, which are closely applied and give a single pop. The pia is on the cord and roots and is never crossed.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0021", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "step", "stem": "A child is found on MRI to have a spinal cord ending at S1 with a thickened filum terminale. As she grows she develops progressive leg weakness and bladder symptoms. Which of the following best explains the progression?", "options": ["The cord is anchored and stretched as the vertebral column outgrows it", "The cauda equina is compressed by a prolapsed disc", "The conus is ischaemic because the anterior spinal artery is short", "The dura ends too high", "The denticulate ligaments have failed"], "answer": 0, "explanation": "Tethered cord: because the column grows faster than the cord, a cord fixed at the bottom is pulled and stretched with growth, producing gradually worsening lower motor neuron and bladder signs.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L06-0022", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L06", "system": "General", "type": "step", "stem": "A patient with a stab wound has lost all sensation from the back of the head down to the neck on one side but has no limb weakness. Which of the following was most likely severed?", "options": ["Dorsal rami of the upper cervical nerves", "Ventral rami of the upper cervical nerves", "The accessory nerve", "The dorsal root ganglia of C1-C4", "The phrenic nerve"], "answer": 0, "explanation": "Dorsal rami supply the skin of the back and the intrinsic back muscles only. The upper cervical dorsal rami (greater occipital nerve from C2) supply the back of the head. Limb weakness would implicate ventral rami.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.2 (Back) and Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L08-0001", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L08", "system": "General", "type": "recall", "stem": "Sympathetic preganglionic cell bodies are located in the", "options": ["Lateral horn of T1-L2", "Brainstem and S2-S4", "Dorsal root ganglia", "Sympathetic chain ganglia", "Ventral horn of T1-L2"], "answer": 0, "explanation": "Sympathetic outflow is thoracolumbar (T1-L2); parasympathetic outflow is craniosacral (CN III, VII, IX, X and S2-S4). Both are two-neuron pathways with a ganglion between.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction (Nervous System)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L08-0002", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L08", "system": "General", "type": "recall", "stem": "Compared with the parasympathetic system, sympathetic ganglia are", "options": ["Close to the spinal cord, giving short preganglionic and long postganglionic fibres", "In the wall of the target organ, giving long preganglionic and short postganglionic fibres", "In the dorsal root ganglia", "Absent, with a single neuron to the effector", "Located in the brainstem"], "answer": 0, "explanation": "Paravertebral and prevertebral ganglia lie near the column, so sympathetic postganglionic fibres are long and diverge widely, producing diffuse responses. Parasympathetic ganglia sit on or in the organ, so effects are discrete.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction (Nervous System)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L08-0003", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L08", "system": "General", "type": "recall", "stem": "The neurotransmitter released by all preganglionic autonomic fibres is", "options": ["Acetylcholine", "Noradrenaline", "Adrenaline", "Dopamine", "Glutamate"], "answer": 0, "explanation": "All preganglionic fibres, sympathetic and parasympathetic, are cholinergic acting on nicotinic receptors in the ganglion. Postganglionic parasympathetic fibres are cholinergic (muscarinic); most postganglionic sympathetic fibres release noradrenaline.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction (Nervous System)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L08-0004", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L08", "system": "General", "type": "recall", "stem": "Which sympathetic postganglionic fibres release acetylcholine rather than noradrenaline?", "options": ["Those to eccrine sweat glands", "Those to the heart", "Those to arterioles of the skin", "Those to the pupil dilator", "Those to the adrenal cortex"], "answer": 0, "explanation": "Sympathetic fibres to sweat glands are cholinergic acting on muscarinic receptors, which is why antimuscarinic drugs cause dry skin and hyperthermia.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction (Nervous System)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L08-0005", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L08", "system": "General", "type": "recall", "stem": "The adrenal medulla is innervated by", "options": ["Preganglionic sympathetic fibres directly", "Postganglionic sympathetic fibres from the celiac ganglion", "Parasympathetic fibres from the vagus", "Postganglionic fibres from the chain", "Pelvic splanchnic nerves"], "answer": 0, "explanation": "The chromaffin cells are modified postganglionic neurons, so the preganglionic fibres of the greater splanchnic nerve synapse on them directly. This is the one-synapse exception. The medulla is neural crest.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction (Nervous System)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L08-0006", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L08", "system": "General", "type": "recall", "stem": "The greater splanchnic nerve synapses in the", "options": ["Celiac ganglion", "Sympathetic chain ganglia", "Superior mesenteric ganglion", "Inferior mesenteric ganglion", "Dorsal root ganglion"], "answer": 0, "explanation": "Splanchnic nerves pass through the chain without synapsing and synapse in prevertebral ganglia: greater in the celiac, lesser in the aorticorenal/superior mesenteric, lumbar splanchnics in the inferior mesenteric.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction (Nervous System)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L08-0007", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L08", "system": "General", "type": "recall", "stem": "Parasympathetic supply to the gut distal to the splenic flexure comes from", "options": ["Pelvic splanchnic nerves", "Vagus nerve", "Lumbar splanchnic nerves", "Greater splanchnic nerve", "Sacral splanchnic nerves"], "answer": 0, "explanation": "The vagus supplies the foregut and midgut down to about the splenic flexure. The hindgut and pelvic viscera get parasympathetic fibres from S2-S4 via the pelvic splanchnics. Sacral splanchnics are sympathetic.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction (Nervous System)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L08-0008", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L08", "system": "General", "type": "recall", "stem": "Sympathetic stimulation of the eye produces", "options": ["Pupil dilation", "Pupil constriction", "Accommodation for near vision", "Lacrimation", "Ptosis"], "answer": 0, "explanation": "Sympathetic fibres from T1 run via the superior cervical ganglion to the dilator pupillae and to the superior tarsal muscle. Loss gives Horner's syndrome: miosis, ptosis, anhidrosis.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction (Nervous System)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L08-0009", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L08", "system": "General", "type": "recall", "stem": "The vagus nerve carries what proportion of its fibres as afferents?", "options": ["About 80%", "About 20%", "About 50%", "Less than 5%", "Nearly 100%"], "answer": 0, "explanation": "Most vagal fibres are sensory, carrying information about stretch, chemistry and pressure from the viscera to the brainstem for reflexes, not pain. Visceral pain travels mostly with sympathetics.", "tags": ["step1-hy", "verify"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction (Nervous System)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L08-0010", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L08", "system": "General", "type": "recall", "stem": "Referred pain from the heart is felt in the", "options": ["Left arm and chest, T1-T4 dermatomes", "Right shoulder tip, C4", "Umbilicus, T10", "Epigastrium, T5-T9", "Groin, L1"], "answer": 0, "explanation": "Cardiac afferents enter the cord at T1-T4 with the sympathetic cardiac nerves and converge on dorsal horn neurons also receiving somatic input from those dermatomes, so pain is projected to the chest and medial arm.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction (Nervous System)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L08-0011", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L08", "system": "General", "type": "recall", "stem": "Referred pain occurs because", "options": ["Visceral and somatic afferents converge on the same second-order neurons in the dorsal horn", "Visceral pain fibres travel in somatic nerves to the skin", "The brain lacks any representation of the viscera", "Sympathetic efferents release pain-producing substances in the skin", "Autonomic ganglia contain pain receptors"], "answer": 0, "explanation": "Convergence-projection: the brain has learned to attribute activity in a dorsal horn neuron to the skin, its usual source, so visceral input on that neuron is felt in the dermatome.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction (Nervous System)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L08-0012", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L08", "system": "General", "type": "step", "stem": "A 60-year-old man has an apical lung tumour. He has a drooping right eyelid, a small right pupil and a dry right side of the face. Which structure has the tumour invaded?", "options": ["The cervical sympathetic chain or stellate ganglion", "The right vagus nerve", "The right phrenic nerve", "The oculomotor nerve", "The right recurrent laryngeal nerve"], "answer": 0, "explanation": "Horner's syndrome results from interruption of the sympathetic pathway to the head. At the lung apex the stellate ganglion and sympathetic chain are directly in the path of a Pancoast tumour.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction (Nervous System)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L08-0013", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L08", "system": "General", "type": "step", "stem": "A patient is given a drug that blocks nicotinic receptors in autonomic ganglia. Which of the following effects would be expected?", "options": ["Loss of both sympathetic and parasympathetic activity", "Loss of sympathetic activity with parasympathetic preserved", "Loss of parasympathetic activity with sympathetic preserved", "Increased sweating with a rise in blood pressure", "Increased heart rate with preserved gut motility"], "answer": 0, "explanation": "All preganglionic fibres act on nicotinic receptors in ganglia, so a ganglion blocker paralyses both divisions. The net effect on any organ depends on which division dominates at rest.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction (Nervous System)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L08-0014", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L08", "system": "General", "type": "step", "stem": "A woman with acute cholecystitis complains of pain over her right shoulder and also in the epigastrium. Which two nerves account for these two sites?", "options": ["Phrenic nerve for the shoulder; sympathetic afferents to T5-T9 for the epigastrium", "Vagus for the shoulder; phrenic for the epigastrium", "Intercostal nerves for both", "Greater splanchnic nerve for both", "Pelvic splanchnic for the shoulder; vagus for the epigastrium"], "answer": 0, "explanation": "Gallbladder visceral pain goes with sympathetics to T5-T9 and is felt in the epigastrium. Inflammation irritating the diaphragmatic peritoneum is carried by the phrenic nerve (C3-C5) and referred to the shoulder.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction (Nervous System)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L08-0015", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L08", "system": "General", "type": "step", "stem": "During a sympathectomy for hyperhidrosis a surgeon removes part of the thoracic sympathetic chain. Which of the following best explains why the sweating stops?", "options": ["Postganglionic cholinergic sympathetic fibres to the sweat glands originate in the removed ganglia", "The parasympathetic supply to the sweat glands has been interrupted", "Noradrenergic fibres to the sweat glands have been cut", "The dorsal root ganglia have been removed", "The white rami communicantes were the only fibres cut"], "answer": 0, "explanation": "Sweat glands receive sympathetic fibres that are cholinergic. The postganglionic cell bodies are in the chain ganglia, so removing them removes the drive to the glands of the corresponding grey rami.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction (Nervous System)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L08-0016", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L08", "system": "General", "type": "step", "stem": "An 8-year-old boy has constipation since birth. Biopsy of the rectum shows absence of ganglion cells in the submucosal and myenteric plexuses. Which cell population failed to migrate?", "options": ["Neural crest cells forming the enteric nervous system", "Splanchnic mesoderm forming smooth muscle", "Endoderm forming the mucosa", "Preganglionic parasympathetic neurons from S2-S4", "Sympathetic neurons from the inferior mesenteric ganglion"], "answer": 0, "explanation": "Hirschsprung disease is failure of neural crest migration into the distal bowel. The aganglionic segment cannot relax and produces functional obstruction. The enteric nervous system is neural crest.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Introduction (Nervous System)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0001", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The superior mediastinum is separated from the inferior mediastinum by a plane passing through which two landmarks?", "options": ["Sternal angle and the T4/T5 intervertebral disc", "Jugular notch and the T2/T3 intervertebral disc", "Xiphisternal joint and the T9 vertebral body", "Sternal angle and the T2 vertebral body", "Manubriosternal joint and the T6/T7 intervertebral disc"], "answer": 0, "explanation": "The transverse thoracic plane runs from the sternal angle (of Louis) posteriorly to the T4/T5 disc. It marks the arch of the aorta, the tracheal bifurcation, the start and end of the azygos arch, and the second costal cartilage.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0002", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "Which structure lies within the middle mediastinum?", "options": ["Phrenic nerves", "Thoracic duct", "Azygos vein", "Oesophagus", "Descending thoracic aorta"], "answer": 0, "explanation": "The middle mediastinum holds the pericardium, heart, roots of the great vessels, tracheal bifurcation, and the phrenic nerves running on the pericardium. The other four are posterior mediastinal contents.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0003", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The posterior mediastinum contains all of the following EXCEPT", "options": ["Thymus", "Azygos vein", "Thoracic duct", "Oesophagus", "Sympathetic trunks"], "answer": 0, "explanation": "The thymus lies in the anterior part of the superior mediastinum and extends into the anterior mediastinum. It is never posterior.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0004", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "Which vessel forms the upper right border of the mediastinal shadow on a PA chest film?", "options": ["Superior vena cava", "Ascending aorta", "Right atrium", "Azygos vein", "Right brachiocephalic vein"], "answer": 0, "explanation": "The right mediastinal border, from above down, is the right brachiocephalic vein (barely), SVC, and then right atrium. The SVC forms the upper right border; the ascending aorta is not border-forming.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0005", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The apex beat of the heart is normally palpated at", "options": ["Left fifth intercostal space in the midclavicular line", "Left fourth intercostal space in the midclavicular line", "Left fifth intercostal space in the anterior axillary line", "Left sixth intercostal space in the midclavicular line", "Left fourth intercostal space at the sternal border"], "answer": 0, "explanation": "The apex is formed by the left ventricle and is located in the left 5th intercostal space, roughly 9 cm from the midline in the midclavicular line.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0006", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The right border of the heart is formed by the", "options": ["Right atrium", "Right ventricle", "Superior vena cava", "Left atrium", "Right auricle"], "answer": 0, "explanation": "On the anterior surface, the right border is the right atrium, the inferior border is mainly the right ventricle, and the left border is the left ventricle with the left auricle at the top.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0007", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The inferior (diaphragmatic) border of the heart on the anterior view is formed mostly by the", "options": ["Right ventricle", "Left ventricle", "Right atrium", "Left atrium", "Coronary sinus"], "answer": 0, "explanation": "The right ventricle makes up most of the inferior border with a small contribution from the left ventricle at the apex.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0008", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The base of the heart is formed principally by the", "options": ["Left atrium", "Right atrium", "Left ventricle", "Right ventricle", "Both ventricles"], "answer": 0, "explanation": "The base is the posterior surface, formed mainly by the left atrium (with a small part of the right atrium) and faces the vertebral bodies T6-T9. It is not the diaphragmatic surface.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0009", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The oblique pericardial sinus lies", "options": ["Posterior to the left atrium, bounded by the pulmonary veins and the venae cavae", "Anterior to the aorta and pulmonary trunk", "Between the ascending aorta and the superior vena cava", "Between the pulmonary trunk and the left auricle", "Inferior to the heart, on the central tendon of the diaphragm"], "answer": 0, "explanation": "The oblique sinus is the blind cul-de-sac behind the left atrium formed by the reflection of serous pericardium around the four pulmonary veins and the two cavae.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0010", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "A surgeon passes a finger through the transverse pericardial sinus. Which vessels lie anterior to the finger?", "options": ["Ascending aorta and pulmonary trunk", "Superior vena cava and right pulmonary artery", "Pulmonary veins", "Inferior vena cava and coronary sinus", "Left pulmonary artery and left auricle"], "answer": 0, "explanation": "The transverse sinus separates the arterial outflow (aorta and pulmonary trunk in front) from the venous inflow (SVC and pulmonary veins behind). A clamp through it controls both great arteries during cardiac surgery.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0011", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The fibrous pericardium is attached inferiorly to the", "options": ["Central tendon of the diaphragm", "Muscular part of the diaphragm", "Xiphoid process", "Body of the sternum", "Oesophageal hiatus"], "answer": 0, "explanation": "The fibrous pericardium fuses with the central tendon of the diaphragm, which is why the IVC passes through both at the caval opening at T8.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0012", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The pericardiacophrenic artery is a branch of the", "options": ["Internal thoracic artery", "Bronchial artery", "Superior phrenic artery", "Thoracic aorta", "Subclavian artery"], "answer": 0, "explanation": "The pericardiacophrenic artery arises from the internal thoracic and travels with the phrenic nerve between the fibrous pericardium and mediastinal pleura.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0013", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "Somatic sensation from the fibrous and parietal pericardium is carried by the", "options": ["Phrenic nerve", "Vagus nerve", "Intercostal nerves", "Sympathetic trunk", "Recurrent laryngeal nerve"], "answer": 0, "explanation": "Pericardial pain is carried by the phrenic nerves (C3-C5), which explains referred pericarditis pain to the shoulder tip via the supraclavicular nerves.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0014", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The right coronary artery arises from the", "options": ["Right (anterior) aortic sinus", "Left (posterior) aortic sinus", "Non-coronary aortic sinus", "Bulb of the pulmonary trunk", "Ascending aorta above the sinotubular junction"], "answer": 0, "explanation": "The right coronary comes from the right aortic sinus, the left coronary from the left aortic sinus, and the posterior sinus gives no coronary and is called non-coronary.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0015", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The sinoatrial nodal artery most commonly arises from the", "options": ["Right coronary artery", "Left anterior descending artery", "Circumflex artery", "Left marginal artery", "Posterior interventricular artery"], "answer": 0, "explanation": "In roughly 60% of people the SA nodal branch comes from the RCA; in about 40% it comes from the circumflex.", "tags": ["step1-hy", "verify"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0016", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The atrioventricular nodal artery in a right-dominant heart is a branch of the", "options": ["Right coronary artery near the crux", "Circumflex artery", "Left anterior descending artery", "Anterior interventricular artery", "Left marginal artery"], "answer": 0, "explanation": "In right dominance (about 85%), the RCA gives the posterior interventricular artery and the AV nodal branch at the crux. In left dominance both come from the circumflex.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0017", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "Cardiac dominance is defined by which artery gives rise to the", "options": ["Posterior interventricular artery", "Anterior interventricular artery", "Sinoatrial nodal artery", "Right marginal artery", "Left marginal artery"], "answer": 0, "explanation": "Dominance is determined by the origin of the posterior interventricular (posterior descending) artery, not by which side supplies more muscle.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0018", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The anterior interventricular artery supplies the", "options": ["Anterior two-thirds of the interventricular septum", "Posterior one-third of the interventricular septum", "Sinoatrial node", "Atrioventricular node", "Right atrium"], "answer": 0, "explanation": "The LAD supplies the anterior two-thirds of the septum and both ventricles' anterior walls; the posterior third of the septum is supplied by the posterior interventricular artery.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0019", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The great cardiac vein runs alongside the", "options": ["Anterior interventricular artery", "Posterior interventricular artery", "Right marginal artery", "Circumflex artery only", "Sinoatrial nodal artery"], "answer": 0, "explanation": "The great cardiac vein ascends in the anterior interventricular groove with the LAD, then curves into the coronary sulcus to become the coronary sinus.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0020", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The middle cardiac vein accompanies the", "options": ["Posterior interventricular artery", "Anterior interventricular artery", "Right marginal artery", "Circumflex artery", "Left marginal artery"], "answer": 0, "explanation": "The middle cardiac vein lies in the posterior interventricular groove with the posterior interventricular artery and drains into the coronary sinus near its termination.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0021", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The coronary sinus opens into the", "options": ["Right atrium, between the IVC orifice and the tricuspid valve", "Right atrium, between the SVC orifice and the fossa ovalis", "Left atrium, near the left inferior pulmonary vein", "Right ventricle, below the tricuspid valve", "Inferior vena cava, just before it enters the heart"], "answer": 0, "explanation": "The coronary sinus drains into the right atrium at the posteroinferior aspect, guarded by the Thebesian valve, between the IVC opening and the tricuspid orifice.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0022", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "Which veins drain directly into the cardiac chambers rather than the coronary sinus?", "options": ["Smallest cardiac veins", "Great cardiac vein", "Middle cardiac vein", "Small cardiac vein", "Posterior vein of the left ventricle"], "answer": 0, "explanation": "The venae cordis minimae open directly into all chambers, chiefly the right atrium and ventricle; the anterior cardiac veins also bypass the sinus, draining into the right atrium.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0023", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The crista terminalis of the right atrium separates", "options": ["The smooth-walled sinus venarum from the rough-walled atrium proper", "The fossa ovalis from the coronary sinus opening", "The right atrium from the right auricle only", "The tricuspid orifice from the IVC opening", "The conus arteriosus from the trabeculated ventricle"], "answer": 0, "explanation": "The crista terminalis is the internal ridge corresponding to the external sulcus terminalis; it marks the junction of the embryonic sinus venosus (smooth) with the primitive atrium (pectinate muscles).", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0024", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The sinoatrial node lies at the", "options": ["Junction of the SVC with the right atrium, at the upper end of the crista terminalis", "Junction of the IVC with the right atrium", "Interatrial septum, near the opening of the coronary sinus", "Base of the right auricle", "Membranous interventricular septum"], "answer": 0, "explanation": "The SA node sits subepicardially at the superior end of the sulcus terminalis where the SVC enters the right atrium.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0025", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The atrioventricular node is located in the", "options": ["Interatrial septum near the opening of the coronary sinus", "Junction of the SVC with the right atrium", "Upper end of the crista terminalis", "Membranous interventricular septum", "Wall of the right auricle"], "answer": 0, "explanation": "The AV node lies in the triangle of Koch, in the lower interatrial septum just above the coronary sinus opening and the septal tricuspid leaflet.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0026", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The atrioventricular bundle passes from the AV node through the", "options": ["Membranous part of the interventricular septum", "Muscular part of the interventricular septum", "Septomarginal trabecula directly", "Right fibrous trigone into the left ventricular wall", "Interatrial septum toward the SA node"], "answer": 0, "explanation": "The bundle of His is the only normal conducting path from atria to ventricles, crossing the fibrous skeleton via the membranous septum before splitting into right and left bundle branches.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0027", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The septomarginal trabecula (moderator band) carries the", "options": ["Right bundle branch to the anterior papillary muscle", "Left bundle branch to the posterior papillary muscle", "Right coronary artery to the apex", "Great cardiac vein across the ventricle", "Chordae tendineae of the septal cusp"], "answer": 0, "explanation": "The moderator band conveys the right bundle branch from the septum to the anterior papillary muscle so that the papillary muscle contracts before the ventricle proper.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0028", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The right ventricle has how many papillary muscles?", "options": ["Three", "Two", "One", "Four", "Five"], "answer": 0, "explanation": "The right ventricle has anterior, posterior, and septal papillary muscles for the three tricuspid cusps; the left ventricle has two (anterior and posterior) for the two mitral cusps.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0029", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The smooth outflow portion of the right ventricle is called the", "options": ["Conus arteriosus", "Bulbus cordis", "Sinus venarum", "Supraventricular crest", "Aortic vestibule"], "answer": 0, "explanation": "The infundibulum leads to the pulmonary valve; its left ventricular counterpart is the aortic vestibule. The supraventricular crest separates the inflow and outflow portions of the right ventricle.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0030", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The pulmonary valve is best auscultated at the", "options": ["Left second intercostal space, parasternal", "Right second intercostal space, parasternal", "Left fifth intercostal space, midclavicular", "Left fourth intercostal space, parasternal", "Right fourth intercostal space, parasternal"], "answer": 0, "explanation": "Blood flow carries valve sounds downstream: pulmonary at left 2nd ICS, aortic at right 2nd ICS, tricuspid at left lower sternal border (4th-5th ICS), mitral at the apex.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0031", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The aortic valve has how many cusps?", "options": ["Three semilunar cusps", "Two semilunar cusps", "Three cusps with chordae tendineae", "Two cusps with chordae tendineae", "Four semilunar cusps"], "answer": 0, "explanation": "Both semilunar valves have three cusps and no chordae; the atrioventricular valves have chordae tendineae anchored to papillary muscles.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0032", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The ligamentum arteriosum connects the", "options": ["Left pulmonary artery to the inferior surface of the aortic arch", "Right pulmonary artery to the ascending aorta", "Pulmonary trunk to the descending aorta", "Left pulmonary artery to the left subclavian artery", "Pulmonary trunk to the ligamentum venosum"], "answer": 0, "explanation": "The ligamentum arteriosum is the remnant of the ductus arteriosus, running from the origin of the left pulmonary artery to the aortic arch just distal to the left subclavian. The left recurrent laryngeal nerve hooks under it.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0033", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The left recurrent laryngeal nerve loops under the", "options": ["Arch of the aorta", "Right subclavian artery", "Left subclavian artery", "Left pulmonary artery", "Brachiocephalic trunk"], "answer": 0, "explanation": "The left RLN hooks around the arch of the aorta immediately lateral to the ligamentum arteriosum; the right RLN hooks around the right subclavian artery. This asymmetry reflects the aortic arch derivatives.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0034", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The branches of the aortic arch, in order from right to left, are the", "options": ["Brachiocephalic trunk, left common carotid artery, left subclavian artery", "Left common carotid artery, brachiocephalic trunk, left subclavian artery", "Right subclavian artery, right common carotid artery, left common carotid artery", "Brachiocephalic trunk, left subclavian artery, left common carotid artery", "Right common carotid artery, brachiocephalic trunk, left subclavian artery"], "answer": 0, "explanation": "The arch gives three branches: brachiocephalic trunk (which divides into right common carotid and right subclavian), left common carotid, and left subclavian.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0035", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The phrenic nerve in the thorax passes", "options": ["Anterior to the root of the lung", "Posterior to the root of the lung", "Through the root of the lung", "Inferior to the root of the lung", "Between the pulmonary artery and the bronchus"], "answer": 0, "explanation": "The phrenic nerve descends anterior to the lung root on the pericardium; the vagus passes posterior to the root and contributes to the pulmonary plexus.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0036", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The phrenic nerve arises from spinal segments", "options": ["C3, C4, C5", "C4, C5, C6", "C2, C3, C4", "C5, C6, C7", "T1, T2, T3"], "answer": 0, "explanation": "C3-C5 keep the diaphragm alive. Its predominant root is C4. This is why pericardial and diaphragmatic irritation refers pain to the C4 dermatome at the shoulder.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0037", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The thoracic duct enters the thorax through the", "options": ["Aortic hiatus at T12", "Oesophageal hiatus at T10", "Caval opening at T8", "Left crus of the diaphragm", "Sternocostal triangle"], "answer": 0, "explanation": "The thoracic duct begins at the cisterna chyli and ascends through the aortic hiatus with the aorta and azygos vein, then rises between the azygos and the aorta on the right of the oesophagus before crossing to the left at T5.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0038", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The thoracic duct terminates by draining into the", "options": ["Junction of the left subclavian and left internal jugular veins", "Junction of the right subclavian and right internal jugular veins", "Left brachiocephalic vein at its origin", "Superior vena cava", "Left subclavian vein in the axilla"], "answer": 0, "explanation": "The thoracic duct empties at the left venous angle. The right lymphatic duct drains the right upper quadrant of the body into the right venous angle.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0039", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The azygos vein arches over the root of the right lung to drain into the", "options": ["Superior vena cava", "Right brachiocephalic vein", "Right atrium directly", "Inferior vena cava", "Left brachiocephalic vein"], "answer": 0, "explanation": "The azygos arch passes over the right lung root at T4 to enter the posterior surface of the SVC. The hemiazygos and accessory hemiazygos cross the midline at about T8 and T9 to join it.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0040", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "Which structure passes through the aortic hiatus but is not the aorta?", "options": ["Thoracic duct", "Oesophagus", "Vagus nerve trunks", "Phrenic nerve", "Inferior vena cava"], "answer": 0, "explanation": "The aortic hiatus (T12) transmits the aorta, the thoracic duct, and the azygos vein. The oesophagus and vagal trunks go through the oesophageal hiatus at T10; the IVC and right phrenic branches go through the caval opening at T8.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0041", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The oesophagus is constricted in the thorax at the level of the", "options": ["Aortic arch and left main bronchus", "Cricopharyngeus muscle", "Diaphragm only", "Thoracic inlet", "Right main bronchus"], "answer": 0, "explanation": "The four constrictions are the pharyngo-oesophageal junction (cricopharyngeus), the aortic arch, the left main bronchus, and the oesophageal hiatus. Two of the four are thoracic.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0042", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "Sympathetic preganglionic fibres to the heart arise from spinal segments", "options": ["T1-T4/T5", "T5-T9", "C1-C4", "T10-L2", "S2-S4"], "answer": 0, "explanation": "Cardiac sympathetics originate in the lateral horn of T1-T5, synapse in cervical and upper thoracic ganglia, and reach the heart as cardiac nerves. Cardiac visceral pain fibres follow the same route back, hence referral to T1-T4 dermatomes.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0043", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The greater splanchnic nerve is formed from sympathetic thoracic ganglia", "options": ["T5-T9", "T1-T4", "T10-T11", "T12", "T9-T12"], "answer": 0, "explanation": "Greater splanchnic T5-T9, lesser T10-T11, least T12. All carry preganglionic fibres that pierce the crus of the diaphragm to synapse in prevertebral ganglia around the abdominal aorta.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0044", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "A 62-year-old man is found unresponsive with no pulse. During resuscitation a physician attempts pericardiocentesis by inserting a needle just to the left of the xiphoid process, directing it superiorly and to the left. Which structure is most at risk from this approach?", "options": ["Right ventricle", "Left ventricle", "Right atrium", "Left phrenic nerve", "Internal thoracic artery"], "answer": 0, "explanation": "The subxiphoid route enters the pericardium at the diaphragmatic surface of the heart, which is formed largely by the right ventricle. Aiming towards the left shoulder avoids the internal thoracic artery and pleura, but the thin right ventricular wall lies directly in the path.", "tags": ["step1-hy"], "source": "Moore, Clinic
