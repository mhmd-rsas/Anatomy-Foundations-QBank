", "Endoderm of the pharyngeal pouches", "Surface ectoderm of the stomodeum", "Notochord"], "answer": 0, "explanation": "Alcohol is toxic to neural crest cells during their migration into the frontonasal and pharyngeal arch mesenchyme. Because the crest forms the facial skeleton, the result is midfacial hypoplasia characteristic of fetal alcohol syndrome.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0036", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "step", "stem": "A child is found to have a complete absence of the kidneys on ultrasound. Which embryonic mesoderm failed to differentiate?", "options": ["Intermediate mesoderm", "Paraxial mesoderm", "Somatic lateral plate mesoderm", "Splanchnic lateral plate mesoderm", "Cardiogenic mesoderm"], "answer": 0, "explanation": "The intermediate mesoderm forms the entire urogenital system. Bilateral renal agenesis leads to oligohydramnios and the Potter sequence of pulmonary hypoplasia and limb deformities.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0037", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "step", "stem": "An embryo with a mutation preventing sclerotome resegmentation would be expected to have which of the following?", "options": ["Spinal nerves emerging at the level of the vertebral bodies", "Complete absence of the ribs and costal cartilages", "Complete absence of skeletal muscle in the trunk", "Fusion of all the vertebral bodies into a single rod", "Loss of the dermis and hypodermis of the back"], "answer": 0, "explanation": "Resegmentation places each vertebra between two original sclerotome segments, so the segmental nerve emerges at the intervertebral level. Without it, the nerve would sit at the level of the body it originally lay beside.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0038", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "step", "stem": "A 30-year-old woman presents with a hoarse voice, difficulty swallowing, and a neck mass. Biopsy shows a tumour of parafollicular C cells of the thyroid. From which embryonic cell population did these cells originate?", "options": ["Neural crest cells that migrated into the ultimobranchial body", "Endoderm of the thyroid diverticulum", "Endoderm of the third pharyngeal pouch", "Mesoderm of the fourth pharyngeal arch", "Surface ectoderm of the foramen caecum"], "answer": 0, "explanation": "Parafollicular C cells are neural crest derivatives that migrate into the ultimobranchial body of the fourth pouch and become incorporated into the thyroid. Medullary carcinoma of the thyroid arises from them and is part of MEN 2, also a neural crest tumour syndrome.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0001", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "recall", "stem": "On a conventional radiograph, bone appears", "options": ["White, because it attenuates the most X-rays", "Black, because it transmits the most X-rays", "Grey, similar to soft tissue", "White, because it emits X-rays", "Black, because it contains calcium"], "answer": 0, "explanation": "Radiodensity depends on attenuation. Metal and bone are white; soft tissue and fluid are grey; fat is darker grey; air is black.", "tags": ["step1-hy"], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0002", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "recall", "stem": "In a PA chest radiograph the X-ray beam passes", "options": ["From the patient's back to the front, with the film against the chest", "From front to back, with the film against the back", "From left to right", "Vertically from above", "Tangentially across the chest"], "answer": 0, "explanation": "In the posteroanterior projection the heart lies close to the detector and is not magnified. AP films, taken with portable machines in supine patients, enlarge the heart shadow and can mimic cardiomegaly.", "tags": ["step1-hy"], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0003", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "recall", "stem": "The main limitation of conventional radiography is", "options": ["Superimposition of structures in a two-dimensional projection", "High cost relative to cross-sectional imaging", "Slow acquisition compared with CT", "Absence of ionising radiation exposure", "Inability to demonstrate cortical bone"], "answer": 0, "explanation": "Overlapping structures hide each other, and soft-tissue contrast is poor. CT solves the superimposition problem with cross-sectional slices.", "tags": [], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0004", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "recall", "stem": "Hounsfield units are anchored so that", "options": ["Water is 0 and air is -1000", "Water is 0 and bone is 0", "Air is 0 and water is 1000", "Fat is 0 and water is 100", "Air is +1000 and water is 0"], "answer": 0, "explanation": "The CT density scale defines water as 0 HU and air as -1000 HU. Fat is about -100, soft tissue +40 to +60, blood about +50 to +70 acutely, cortical bone +1000 or more.", "tags": ["step1-hy"], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0005", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "recall", "stem": "Windowing in CT refers to", "options": ["Adjusting the range of densities mapped to the grey scale", "Selecting the part of the body to be scanned", "Selecting the thickness of the reconstructed slices", "Setting the exposure time of the X-ray tube", "Choosing the dose of intravenous contrast"], "answer": 0, "explanation": "A lung window spreads the grey scale across low densities; a bone window across high ones. The same data set is displayed differently to answer different questions.", "tags": [], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0006", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "recall", "stem": "Intravenous iodinated contrast increases the attenuation of", "options": ["Blood vessels", "Air-filled lung", "Cortical bone", "Subcutaneous fat", "Bowel gas"], "answer": 0, "explanation": "Iodine is dense and makes perfused structures brighter, revealing vessels, enhancing tumours and inflamed tissue, and distinguishing them from non-enhancing cysts. Oral contrast opacifies bowel.", "tags": [], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0007", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "recall", "stem": "A deterministic effect of radiation", "options": ["Has a threshold dose above which severity increases with dose", "Occurs randomly with probability proportional to dose", "Has no threshold", "Is exemplified by cancer induction", "Cannot occur with medical imaging"], "answer": 0, "explanation": "Deterministic effects (skin erythema, cataract, hair loss) require a threshold and worsen with dose. Stochastic effects (cancer, heritable mutation) have no threshold; dose raises the probability, not the severity.", "tags": ["step1-hy"], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0008", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "recall", "stem": "Ultrasound images are generated from", "options": ["Reflection of high-frequency sound waves at tissue interfaces", "Attenuation of X-rays", "Radiofrequency signals from hydrogen nuclei", "Gamma rays from an injected tracer", "Infrared emission"], "answer": 0, "explanation": "A transducer emits pulses and records echoes; the depth is calculated from the time delay. Fluid is anechoic (black); interfaces such as gallstones reflect strongly and cast acoustic shadows.", "tags": [], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0009", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "recall", "stem": "The signature advantage of ultrasound is", "options": ["Real-time imaging with no ionising radiation", "Superior bone detail", "Independence from operator skill", "Imaging through gas-filled bowel", "Whole-body coverage in one acquisition"], "answer": 0, "explanation": "Ultrasound is dynamic, portable, cheap and radiation-free, ideal for obstetrics, guiding procedures and distinguishing solid from cystic lesions. Gas and bone block it, and quality depends on the operator.", "tags": [], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0010", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "recall", "stem": "On a T1-weighted MRI image", "options": ["Fat is bright and water is dark", "Water is bright and fat is dark", "Both fat and water are bright", "Both fat and water are dark", "Bone is bright"], "answer": 0, "explanation": "T1: fat bright, fluid (CSF) dark. T2: fluid bright, fat also fairly bright. Cortical bone is dark on all sequences because it has few mobile protons.", "tags": ["step1-hy"], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0011", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "recall", "stem": "On a T2-weighted MRI image, cerebrospinal fluid appears", "options": ["Bright", "Dark", "Grey like brain", "Absent", "Black like bone"], "answer": 0, "explanation": "T2 highlights water, so CSF, oedema and most pathology are bright. This is why T2 (and FLAIR, which suppresses free CSF) is the workhorse for detecting lesions.", "tags": ["step1-hy"], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0012", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "recall", "stem": "Fat-saturated MRI sequences are used to", "options": ["Suppress the fat signal to unmask pathology", "Increase the fat signal to outline organs", "Image cortical bone at higher resolution", "Replace the need for gadolinium contrast", "Shorten the acquisition time of the scan"], "answer": 0, "explanation": "Fat is bright on T1 and fairly bright on T2, and can hide bright pathology or gadolinium enhancement. Suppressing it unmasks bone marrow oedema, inflammation and enhancing tumours.", "tags": [], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0013", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "recall", "stem": "MRI contrast agents are based on", "options": ["Gadolinium", "Iodine", "Barium", "Technetium-99m", "Fluorodeoxyglucose"], "answer": 0, "explanation": "Gadolinium shortens T1, making enhancing tissue bright. It highlights areas of breakdown of the blood-brain barrier and increased vascularity.", "tags": [], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0014", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "recall", "stem": "The main limitations of MRI include", "options": ["Long acquisition, cost, and implant incompatibility", "Ionising radiation and stochastic cancer risk", "Poor soft-tissue contrast and reliance on windows", "Inability to image the brain and spinal cord", "Dependence on gas-free acoustic windows"], "answer": 0, "explanation": "MRI has superb soft-tissue contrast and no ionising radiation, but scans take minutes, are expensive, and are contraindicated with some pacemakers and ferromagnetic implants.", "tags": [], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0015", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "recall", "stem": "PET/CT is used mainly for", "options": ["Staging and follow-up of tumours", "Detecting fractures", "Assessing gallstones", "Imaging the fetus", "Screening for breast cancer"], "answer": 0, "explanation": "PET detects metabolic activity of an injected tracer (usually FDG) and fuses it with CT anatomy. Tumours and inflammation take up glucose avidly.", "tags": [], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0016", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "recall", "stem": "Mammography uses", "options": ["Low-energy X-rays", "High-frequency ultrasound", "Gamma emission from a tracer", "Magnetic resonance of protons", "High-energy X-rays"], "answer": 0, "explanation": "Low-energy X-rays improve soft-tissue contrast, showing masses and microcalcifications. Ultrasound and MRI supplement it in dense breasts.", "tags": [], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0017", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "recall", "stem": "A bone scan in nuclear medicine detects", "options": ["Increased osteoblastic activity", "Cortical bone thickness", "Bone marrow fat content", "Joint space width", "Ligament integrity"], "answer": 0, "explanation": "Technetium-99m diphosphonate binds to sites of active bone turnover, revealing metastases, fractures and infection as hot spots on a planar or SPECT image.", "tags": [], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0018", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "step", "stem": "A supine patient in intensive care has a portable chest film reported as showing an enlarged heart. The following day an erect PA film shows a normal cardiothoracic ratio. Which of the following explains the discrepancy?", "options": ["AP projection magnifies the heart because it is far from the detector", "The patient developed pericardial effusion overnight", "The AP film was taken at full expiration", "Contrast was given for the first film", "The PA film was underexposed"], "answer": 0, "explanation": "In an AP supine film the heart is closest to the tube and farthest from the detector, and the beam diverges, so the shadow is magnified. Supine positioning also raises the diaphragm. Cardiomegaly should not be diagnosed on AP films.", "tags": ["step1-hy"], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0019", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "step", "stem": "A CT of the head shows a lesion measured at +60 HU that on a later scan measures +20 HU. What does this change most likely represent?", "options": ["Blood becoming less dense as it ages", "Fat replacing water", "Calcification of the lesion", "Air entering the lesion", "Contrast enhancement"], "answer": 0, "explanation": "Fresh blood is hyperdense (about +50 to +70 HU) because of its protein content. Over days the clot breaks down and the density falls toward that of CSF, so old haematomas become isodense then hypodense.", "tags": ["step1-hy"], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0020", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "step", "stem": "A patient with a suspected gallstone has a normal abdominal radiograph. Which modality should be used next and why?", "options": ["Ultrasound, because most gallstones are not calcified and stones reflect sound strongly", "CT, because it has the best soft-tissue resolution", "MRI, because it shows the biliary tree best", "Nuclear medicine, because it shows bile flow", "A repeat radiograph with oral contrast"], "answer": 0, "explanation": "Only 10-15% of gallstones contain enough calcium to show on X-ray. Ultrasound shows any stone as an echogenic focus with posterior acoustic shadowing and is radiation-free.", "tags": ["step1-hy", "verify"], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0021", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "step", "stem": "A woman with a pacemaker needs imaging of a possible soft-tissue tumour in her thigh. Which modality is contraindicated and why?", "options": ["MRI, because the magnetic field may interfere with the device", "CT, because of ionising radiation", "Ultrasound, because sound is reflected by metal", "Radiography, because the device obscures the field", "PET, because the tracer accumulates in the device"], "answer": 0, "explanation": "Most older pacemakers are unsafe in MRI. Newer MRI-conditional devices exist but require specific protocols. CT or ultrasound would be used instead.", "tags": [], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}, {"id": "F-RAD-L01-0022", "block": "Foundations", "discipline": "RAD", "unit": "F-RAD-L01", "system": "General", "type": "step", "stem": "A radiologist reviewing a CT of a young woman with abdominal pain changes the display from a soft-tissue window to a lung window to check the lung bases. What has actually changed?", "options": ["The display mapping of density to grey scale", "The thickness of the reconstructed slices", "The radiation dose delivered to the patient", "The phase of intravenous contrast enhancement", "The position of the patient on the table"], "answer": 0, "explanation": "Windowing is a display setting. The same acquired data can be viewed with a wide window centred on low densities to see lung parenchyma or a narrow window at soft-tissue density to see the abdominal organs.", "tags": [], "source": "Herring, Learning Radiology 5e, Ch.1-2", "written": "2026-09-05", "status": "active"}], "manifest": {"block": "Foundations", "block_code": "F", "derived_from": "Foundation_Schedule_20262027.pdf, pages 1-2 (Weeks 1-2)", "date_generated": "2026-09-05", "note": "Units are keyed to LECTURE IDENTITY, not scheduled day. The master document records two delivery deviations: ANA-L07 was delivered early (Wk1 Friday), and ANA-L06 + ANA-L08 were delivered Mon Aug 31 as a makeup slot.", "disciplines": [{"code": "ANA", "name": "Anatomy", "lectures": [{"unit": "F-ANA-L01", "title": "Introduction to anatomical concepts", "course_id": "1005", "lecturer": "Dr. Dunya", "scheduled": "2026-08-24"}, {"unit": "F-ANA-L02", "title": "Anatomy & relationship of thorax, heart and mediastinum", "course_id": "1017", "lecturer": "Dr. Dunya", "scheduled": "2026-08-24"}, {"unit": "F-ANA-L03", "title": "Anterior abdominal wall, inguinal region & peritoneal space", "course_id": "1039", "lecturer": "Dr. Dunya", "scheduled": "2026-08-26"}, {"unit": "F-ANA-L04", "title": "Osteology: ribs, sternum, thoracic vertebrae", "course_id": "10283", "lecturer": "Dr. Petrosyan", "scheduled": "2026-08-26"}, {"unit": "F-ANA-L06", "title": "Spinal cord basics", "course_id": "1019", "lecturer": "Dr. Dunya", "scheduled": "2026-08-28", "delivered": "2026-08-31"}, {"unit": "F-ANA-L07", "title": "Abdominal viscera and their vasculature", "course_id": "1040", "lecturer": "Dr. Dunya", "scheduled": "2026-08-31", "delivered": "2026-08-28"}, {"unit": "F-ANA-L08", "title": "Autonomic nervous system (anatomical)", "course_id": null, "lecturer": "Dr. Dunya", "scheduled": "2026-08-31"}, {"unit": "F-ANA-L09", "title": "Posterior abdominal wall", "course_id": "1055", "lecturer": "Dr. Dunya", "scheduled": "2026-09-01"}]}, {"code": "EMB", "name": "Embryology", "note": "Timetabled as Anatomy Lectures 5 and 10; filed under Embryology by content. Original lecture numbers preserved in the unit code so they map back to the schedule.", "lectures": [{"unit": "F-EMB-L05", "title": "Basic embryology (gametogenesis, fertilisation, gastrulation)", "course_id": "1021", "lecturer": "Dr. Dunya", "scheduled": "2026-08-28"}, {"unit": "F-EMB-L10", "title": "Basic embryology: critical weeks", "course_id": "10104", "lecturer": "Dr. Petrosyan", "scheduled": "2026-09-01"}]}, {"code": "HIS", "name": "Histology", "lectures": [{"unit": "F-HIS-L01", "title": "Introduction to histology and microscopy", "course_id": "1006", "lecturer": "PNP", "scheduled": "2026-08-27"}, {"unit": "F-HIS-L02", "title": "Basic tissue types and connective tissue", "course_id": "1061+1062", "lecturer": "Dr. Sabbah", "scheduled": "2026-08-31", "note": "ID#1062 confirmed not a separate lecture; content sits inside ID#1061."}, {"unit": "F-HIS-S01", "title": "SDL: Epithelium — classification, cell junctions and surface specializations", "course_id": null, "lecturer": "Dr. Selim Nasser (handout)", "scheduled": "2026-08-28", "type": "SDL"}]}, {"code": "PHY", "name": "Physiology", "lectures": [{"unit": "F-PHY-L01", "title": "Introduction to physiology", "course_id": "10094", "lecturer": "Dr. Abi Gerges", "scheduled": "2026-08-27"}, {"unit": "F-PHY-L02", "title": "Cell signalling and the autonomic nervous system", "course_id": "10095", "lecturer": "Dr. Abi Gerges", "scheduled": "2026-09-03"}]}, {"code": "RAD", "name": "Radiology", "lectures": [{"unit": "F-RAD-L01", "title": "Introduction to basic radiology", "course_id": "10170", "lecturer": "Dr. Semaan", "scheduled": "2026-08-26"}]}], "out_of_scope": ["Anatomy dissection labs (ID#1016, 1018, 1020, 1041, 1053, 1303)", "Histology lab (ID#1063), Histology lab: Epithelia", "Histology TBL: Glandular epithelium (ID#1060)", "Medical Education 1 and 2 (ID#1001/1004)", "Teach and learn, Flipped classroom, TBL orientation, SOM orientation"], "total_units": 16}}</script>
<script>
const DATA=JSON.parse(document.getElementById('store').textContent);
const Q=DATA.questions.filter(q=>q.status!=='retired');
const MAN=DATA.manifest;
const LETTERS='ABCDE';
const $=s=>document.querySelector(s);
const app=$('#app'), sheet=$('#sheet');

/* ---------- persistence (per-question history, keyed by permanent ID) ---------- */
const KEY='qbank.history.v1';
let H={}; try{H=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){H={}}
function rec(id,ok){ try{ const h=H[id]||{n:0,c:0,last:null}; h.n++; if(ok)h.c++; h.last=ok?1:0; H[id]=h; localStorage.setItem(KEY,JSON.stringify(H)); }catch(e){} }
function unitStats(unit){ const ids=Q.filter(q=>q.unit===unit).map(q=>q.id); let n=0,c=0,seen=0; ids.forEach(i=>{const h=H[i]; if(h){seen++;n+=h.n;c+=h.c}}); return {seen,n,c,total:ids.length}; }
function resetHist(){ if(confirm('Clear all performance history on this device?')){H={};try{localStorage.removeItem(KEY)}catch(e){};home();} }

/* ---------- home ---------- */
function home(){
  sheet.classList.remove('on');
  let h=`<h1>Foundations</h1><p class="sub">${Q.length} questions · ${MAN.disciplines.reduce((a,d)=>a+d.lectures.filter(l=>Q.some(q=>q.unit===l.unit)).length,0)} lectures</p>`;
  MAN.disciplines.forEach(d=>{
    const lecs=d.lectures.filter(l=>Q.some(q=>q.unit===l.unit));
    if(!lecs.length) return;
    const dn=Q.filter(q=>q.discipline===d.code).length;
    h+=`<div class="group"><h2>${d.name}<small>${dn}</small></h2>`;
    lecs.forEach(l=>{
      const n=Q.filter(q=>q.unit===l.unit).length, r=Q.filter(q=>q.unit===l.unit&&q.type==='recall').length;
      const st=unitStats(l.unit); const acc=st.n?Math.round(100*st.c/st.n):null;
      const num=l.unit.split('-')[2].replace(/^[LS]0?/,'');
      const kind=l.type==='SDL'?'SDL':'';
      h+=`<button class="lec" data-u="${l.unit}"><span class="n">${kind||num}</span><span><span class="t">${l.title}</span><div class="m">${l.lecturer||''}</div></span><span class="s">${acc!==null?`<b class="${acc<60?'w':acc>=80?'g':''}">${acc}%</b><br>${st.seen} of ${n} seen`:`<b>${n}</b><br>${r} recall`}</span></button>`;
    });
    if(lecs.length>1){ h+=`<button class="lec all" data-d="${d.code}"><span class="n">∑</span><span><span class="t">All of ${d.name}</span><div class="m">${lecs.length} lectures mixed</div></span><span class="s"><b>${dn}</b></span></button>`; }
    h+=`</div>`;
  });
  const allSeen=Object.keys(H).length;
  h+=`<button class="lec all" data-d="*"><span class="n">∑</span><span><span class="t">Everything</span><div class="m">all lectures, all disciplines</div></span><span class="s"><b>${Q.length}</b></span></button>`;
  h+=`<p class="hist">${allSeen?`History kept for ${allSeen} questions on this device. <button onclick="resetHist()">Clear</button>`:'Your answers are remembered on this device so you can retry what you miss.'}</p>`;
  app.innerHTML=h;
  app.querySelectorAll('.lec').forEach(b=>b.onclick=()=>openSheet(b.dataset.u?{unit:b.dataset.u}:{disc:b.dataset.d}));
  window.scrollTo(0,0);
}

/* ---------- start sheet ---------- */
let cfg={type:'both',mode:'tutor',len:'all',pool:'all'};
function poolFor(sel){ return sel.unit?Q.filter(q=>q.unit===sel.unit):(sel.disc==='*'?Q:Q.filter(q=>q.discipline===sel.disc)); }
function openSheet(sel){
  const base=poolFor(sel);
  const title=sel.unit?MAN.disciplines.flatMap(d=>d.lectures).find(l=>l.unit===sel.unit).title:(sel.disc==='*'?'Everything':'All of '+MAN.disciplines.find(d=>d.code===sel.disc).name);
  const missed=base.filter(q=>H[q.id]&&H[q.id].last===0).length, unseen=base.filter(q=>!H[q.id]).length;
  const draw=()=>{
    const pool=base.filter(q=>cfg.type==='both'||q.type===cfg.type).filter(q=>cfg.pool==='all'||(cfg.pool==='missed'?(H[q.id]&&H[q.id].last===0):!H[q.id]));
    const nR=base.filter(q=>q.type==='recall').length, nS=base.length-nR;
    sheet.innerHTML=`<div class="panel">
      <h3>${title}</h3><p class="sub">${base.length} questions · ${nR} recall · ${nS} step-style</p>
      <div class="row"><span class="lab">Question type</span>
        ${chip('type','recall','Recall')}${chip('type','step','Step-style')}${chip('type','both','Both')}</div>
      <div class="row"><span class="lab">Show answers</span>
        ${chip('mode','tutor','After each')}${chip('mode','exam','At the end')}</div>
      <div class="row"><span class="lab">Which questions</span>
        ${chip('pool','all','All')}${chip('pool','unseen','Unseen',!unseen)}${chip('pool','missed','Missed',!missed)}</div>
      <div class="row"><span class="lab">How many</span>
        ${chip('len','20','20')}${chip('len','40','40')}${chip('len','all','All')}</div>
      <button class="go" ${pool.length?'':'disabled'}>Start · ${cfg.len==='all'?pool.length:Math.min(pool.length,+cfg.len)} questions</button>
      <button class="ghost" id="cancel">Back</button></div>`;
    sheet.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{cfg[c.dataset.k]=c.dataset.v;draw();});
    sheet.querySelector('.go').onclick=()=>start(pool);
    sheet.querySelector('#cancel').onclick=()=>sheet.classList.remove('on');
  };
  draw(); sheet.classList.add('on');
  sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('on')};
}
function chip(k,v,label,dis){ return `<button class="chip ${cfg[k]===v?'on':''}" data-k="${k}" data-v="${v}" ${dis?'disabled':''}>${label}</button>`; }

/* ---------- session ---------- */
let S=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function start(pool){
  sheet.classList.remove('on');
  let items=shuffle(pool); if(cfg.len!=='all') items=items.slice(0,+cfg.len);
  S={items:items.map(q=>({q,order:shuffle([...q.options.keys()]),pick:null,flag:false})),i:0,done:false};
  render();
}
function render(){
  const it=S.items[S.i], q=it.q, answered=it.pick!==null, reveal=answered&&cfg.mode==='tutor';
  let h=`<div class="top"><button id="quit">‹ Lectures</button><span>${S.i+1} of ${S.items.length}</span></div>
  <div class="bar"><i style="width:${100*S.i/S.items.length}%"></i></div>
  <div class="kind">${q.type==='step'?'Step-style':'Recall'} · ${unitTitle(q.unit)}</div>
  <p class="stem ${q.type}">${q.stem}</p>`;
  it.order.forEach((oi,pos)=>{
    let cls='opt'; if(reveal){ if(oi===q.answer)cls+=' ok'; else if(pos===it.pick)cls+=' bad'; } else if(pos===it.pick)cls+=' sel';
    h+=`<button class="${cls}" data-p="${pos}" ${reveal?'disabled':''}><span class="k">${LETTERS[pos]}</span><span>${q.options[oi]}</span></button>`;
  });
  if(reveal){
    const ok=it.order[it.pick]===q.answer; const parts=splitNote(q.explanation);
    h+=`<div class="exp ${ok?'ok':'bad'}"><div class="v ${ok?'ok':'bad'}">${ok?'Correct':'Not this one — '+LETTERS[it.order.indexOf(q.answer)]+' is correct'}</div>${parts.main}${parts.note?`<div class="note">${parts.note}</div>`:''}<div class="src">${q.id}${q.source?' · '+q.source:''}</div></div>`;
  }
  h+=`<div class="acts"><button class="next" id="next">${reveal||cfg.mode==='exam'?(S.i+1<S.items.length?'Next':'Finish'):'Check'}</button><button class="flag ${it.flag?'on':''}" id="flag">${it.flag?'Flagged':'Flag'}</button></div>`;
  app.innerHTML=h; window.scrollTo(0,0);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(reveal)return; it.pick=+b.dataset.p; if(cfg.mode==='exam'){advance();} else render(); });
  $('#next').onclick=()=>{ if(it.pick===null) return; if(cfg.mode==='tutor'&&!answered) return; advance(); };
  $('#flag').onclick=()=>{it.flag=!it.flag;render();};
  $('#quit').onclick=()=>{ if(confirm('Leave this set? Progress on answered questions is kept.')) {finish(true);} };
}
function advance(){
  const it=S.items[S.i]; if(it.pick!==null && !it.recorded){ it.recorded=true; rec(it.q.id, it.order[it.pick]===it.q.answer); }
  if(S.i+1<S.items.length){S.i++;render();} else finish(false);
}
function splitNote(e){ const m=e.match(/^(.*?)(NOTE:.*)$/s); return m?{main:m[1].trim(),note:m[2]}:{main:e,note:null}; }
function unitTitle(u){ const l=MAN.disciplines.flatMap(d=>d.lectures).find(l=>l.unit===u); return l?l.title:u; }
function fmt(n){return n.toString()}

/* ---------- results ---------- */
function finish(early){
  const done=S.items.filter(it=>it.pick!==null); done.forEach(it=>{ if(!it.recorded){it.recorded=true;rec(it.q.id,it.order[it.pick]===it.q.answer);} });
  if(!done.length){home();return;}
  const right=done.filter(it=>it.order[it.pick]===it.q.answer); const pct=Math.round(100*right.length/done.length);
  const byUnit={}; done.forEach(it=>{const u=it.q.unit;byUnit[u]=byUnit[u]||{n:0,c:0};byUnit[u].n++;if(it.order[it.pick]===it.q.answer)byUnit[u].c++;});
  const byType={}; done.forEach(it=>{const t=it.q.type;byType[t]=byType[t]||{n:0,c:0};byType[t].n++;if(it.order[it.pick]===it.q.answer)byType[t].c++;});
  const missed=done.filter(it=>it.order[it.pick]!==it.q.answer), flagged=S.items.filter(it=>it.flag);
  let h=`<div class="top"><button id="quit">‹ Lectures</button><span>${early?'Stopped early':'Finished'}</span></div>
  <div class="big">${pct}<small>%</small></div><p class="sub">${right.length} of ${done.length} correct</p>`;
  const rows=Object.entries(byUnit).sort((a,b)=>(a[1].c/a[1].n)-(b[1].c/b[1].n));
  h+=`<table class="tbl">`;
  if(rows.length>1) rows.forEach(([u,s])=>{const p=Math.round(100*s.c/s.n);h+=`<tr><td>${unitTitle(u)}</td><td class="${p<60?'w':p>=80?'g':''}">${s.c}/${s.n} · ${p}%</td></tr>`});
  Object.entries(byType).forEach(([t,s])=>{const p=Math.round(100*s.c/s.n);h+=`<tr><td>${t==='step'?'Step-style':'Recall'}</td><td class="${p<60?'w':p>=80?'g':''}">${s.c}/${s.n} · ${p}%</td></tr>`});
  h+=`</table>`;
  if(missed.length){
    h+=`<h2 style="font-family:var(--serif);font-weight:500;font-size:22px;margin:6px 0 8px">Missed</h2>`;
    missed.forEach(it=>{const q=it.q;h+=`<div class="miss"><div class="q">${q.stem}</div><div class="a">You chose: ${q.options[it.order[it.pick]]}<br>Correct: <b>${q.options[q.answer]}</b></div></div>`});
  }
  h+=`<div style="margin-top:22px">`;
  if(missed.length) h+=`<button class="go" id="rm">Retry the ${missed.length} missed</button>`;
  if(flagged.length) h+=`<button class="ghost" id="rf">Retry ${flagged.length} flagged</button>`;
  h+=`<button class="ghost" id="ra">Same set again</button><button class="ghost" id="home">Back to lectures</button></div>`;
  app.innerHTML=h; window.scrollTo(0,0);
  const again=items=>{S={items:shuffle(items).map(q=>({q,order:shuffle([...q.options.keys()]),pick:null,flag:false})),i:0};render();};
  if(missed.length)$('#rm').onclick=()=>again(missed.map(it=>it.q));
  if(flagged.length)$('#rf').onclick=()=>again(flagged.map(it=>it.q));
  $('#ra').onclick=()=>again(S.items.map(it=>it.q));
  $('#home').onclick=home; $('#quit').onclick=home;
}

/* ---------- keys ---------- */
document.addEventListener('keydown',e=>{
  if(!S||!$('#next'))return;
  const it=S.items[S.i]; const k=e.key;
  if('12345'.includes(k)&&k!==''){const b=app.querySelector(`.opt[data-p="${+k-1}"]`);if(b&&!b.disabled)b.click();}
  else if(k==='Enter'||k==='ArrowRight'){$('#next').click();}
  else if(k.toLowerCase()==='f'){$('#flag').click();}
});
home();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
</html>
