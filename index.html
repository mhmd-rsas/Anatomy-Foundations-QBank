perextensible skin and joints, and his vessels rupture easily. Which of the following collagens is most often defective in the vascular form of this disease?", "options": ["Type III", "Type I", "Type II", "Type IV", "Type VII"], "answer": 0, "explanation": "Vascular Ehlers-Danlos (type IV) is caused by COL3A1 mutations. Type III collagen is prominent in blood vessel walls and hollow organs, so aneurysm, arterial rupture and bowel perforation occur.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0026", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "step", "stem": "A biopsy of a lymph node shows a delicate fibre network that is invisible on H&E but stains black with silver. Which fibre type is this and what does it consist of?", "options": ["Reticular fibres of type III collagen", "Elastic fibres of elastin and fibrillin", "Type I collagen fibres", "Anchoring fibrils of type VII collagen", "Basement membrane of type IV collagen"], "answer": 0, "explanation": "Reticular fibres are thin type III collagen fibrils heavily coated with glycoprotein, which explains their silver affinity. They scaffold cells in lymphoid organs, liver and bone marrow.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0027", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "step", "stem": "A 45-year-old woman has hives, wheezing and hypotension minutes after a bee sting. Which connective tissue cell released the mediators responsible?", "options": ["Mast cell", "Macrophage", "Plasma cell", "Fibroblast", "Adipocyte"], "answer": 0, "explanation": "Anaphylaxis is IgE-mediated mast cell degranulation, releasing histamine (vasodilation, oedema, bronchospasm), heparin and proteases, followed by leukotrienes.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0001", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "recall", "stem": "An epithelium in which all cells contact the basement membrane but nuclei lie at different levels is", "options": ["Pseudostratified columnar", "Stratified columnar", "Simple columnar", "Transitional", "Stratified cuboidal"], "answer": 0, "explanation": "Pseudostratified epithelium looks layered because nuclei sit at different heights, but every cell touches the basement membrane. It lines the respiratory tract (ciliated, with goblet cells) and the epididymis (stereociliated).", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0002", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "recall", "stem": "Simple squamous epithelium lining blood vessels is called", "options": ["Endothelium", "Mesothelium", "Urothelium", "Epidermis", "Endometrium"], "answer": 0, "explanation": "Endothelium lines vessels and the heart; mesothelium lines the serous cavities. Both are simple squamous and both are mesoderm-derived, unlike most epithelia.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0003", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "recall", "stem": "Transitional epithelium is found in the", "options": ["Urinary bladder and ureters", "Trachea", "Oesophagus", "Small intestine", "Vagina"], "answer": 0, "explanation": "Urothelium has dome-shaped surface cells with a thick, plaque-rich apical membrane that unfolds as the bladder fills, so the epithelium appears stratified when empty and thinner when full.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0004", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "recall", "stem": "Keratinised stratified squamous epithelium lines the", "options": ["Epidermis", "Oesophagus", "Vagina", "Oral mucosa of the cheek", "Anal canal above the pectinate line"], "answer": 0, "explanation": "Keratinised: skin. Non-keratinised: oesophagus, vagina, oral cavity, cornea, anal canal below the pectinate line. Keratin protects against abrasion and desiccation.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0005", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "recall", "stem": "Simple columnar epithelium with microvilli and goblet cells lines the", "options": ["Small intestine", "Trachea", "Stomach body", "Oesophagus", "Ureter"], "answer": 0, "explanation": "The intestinal lining is simple columnar with a brush border of microvilli and interspersed goblet cells. The stomach is simple columnar without goblet cells; the trachea is pseudostratified ciliated with goblet cells.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0006", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "recall", "stem": "The basement membrane consists of the", "options": ["Basal lamina and the underlying reticular lamina", "Basal lamina only", "Lamina lucida only", "Reticular fibres only", "Plasma membrane of the basal cell"], "answer": 0, "explanation": "The basal lamina (type IV collagen, laminin, perlecan, made by the epithelium) plus the reticular lamina (type III collagen, made by fibroblasts) together form the basement membrane seen on light microscopy with PAS.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0007", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "recall", "stem": "The major structural protein of the basal lamina is", "options": ["Type IV collagen", "Type I collagen", "Type III collagen", "Fibrillin", "Elastin"], "answer": 0, "explanation": "Type IV collagen forms the sheet-like scaffold of the lamina densa, with laminin, nidogen and perlecan filling it in. Laminin is the main adhesive glycoprotein binding epithelial integrins.", "tags": [], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0008", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "recall", "stem": "Microvilli are supported internally by", "options": ["Actin filaments", "Microtubules in a 9+2 arrangement", "Intermediate filaments", "Microtubules in a 9+0 arrangement", "Spectrin only"], "answer": 0, "explanation": "Microvilli have a core of bundled actin anchored into the terminal web. Cilia have microtubules (9+2). Stereocilia, despite the name, are actin-based like microvilli.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0009", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "recall", "stem": "Motile cilia have an axoneme arranged as", "options": ["Nine peripheral doublets and two central singlets", "Nine peripheral triplets and no central microtubules", "Nine peripheral doublets and no central microtubules", "Thirteen protofilaments in a ring", "A core of actin bundles"], "answer": 0, "explanation": "9+2 for motile cilia and flagella, moved by dynein arms sliding adjacent doublets. Basal bodies and centrioles are 9+0 triplets. Primary (non-motile) cilia are 9+0 doublets.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0010", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "recall", "stem": "The motor protein that generates ciliary beating is", "options": ["Dynein", "Kinesin", "Myosin", "Actin", "Tubulin"], "answer": 0, "explanation": "Ciliary dynein arms on the A tubule of each doublet walk along the neighbouring B tubule, bending the axoneme. Defective dynein causes primary ciliary dyskinesia.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0011", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "recall", "stem": "Stereocilia of the epididymis are", "options": ["Long, non-motile, actin-based extensions that increase absorptive surface", "Motile microtubule-based cilia", "Short microvilli forming a brush border", "Sensory microtubule structures like inner-ear hair cells", "Flagella"], "answer": 0, "explanation": "Epididymal stereocilia are elongated branched microvilli with an actin core, absorbing fluid from the lumen. Inner-ear hair cell stereocilia share the name and actin core but are mechanosensory, linked by tip links.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0012", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "recall", "stem": "The brush border of the intestinal epithelium consists of", "options": ["Microvilli with an enzyme-rich glycocalyx", "Cilia with a mucus coat", "Stereocilia with ion channels", "Flagella with a dynein core", "Tight junction strands"], "answer": 0, "explanation": "Microvilli increase apical surface area about 20-fold and carry disaccharidases, peptidases and enterokinase in their glycocalyx. Loss of the brush border in coeliac disease causes secondary lactase deficiency.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0013", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "recall", "stem": "Microvillus inclusion disease results from", "options": ["Misrouting of apical membrane into intracellular vesicles", "Absence of actin from the enterocyte cytoskeleton", "Loss of dynein arms from the enterocyte cilia", "Absence of tight junctions between enterocytes", "Failure of goblet cells to differentiate in the crypts"], "answer": 0, "explanation": "MYO5B mutations block delivery of apical membrane; microvilli form inside cytoplasmic inclusions instead of on the surface, producing intractable secretory diarrhoea from birth.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0014", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "recall", "stem": "The junctional complex from apical to basal consists of", "options": ["Zonula occludens, zonula adherens, macula adherens", "Macula adherens, zonula adherens, zonula occludens", "Zonula adherens, zonula occludens, gap junction", "Hemidesmosome, desmosome, tight junction", "Gap junction, tight junction, desmosome"], "answer": 0, "explanation": "Tight junction at the top sealing the space, adhesion belt below it, then spot desmosomes. Gap junctions lie anywhere along the lateral membrane; hemidesmosomes are basal.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0015", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "recall", "stem": "The zonula occludens prevents", "options": ["Paracellular leakage and mixing of membrane domains", "Electrical coupling between adjacent cells", "Attachment of the cell to the basal lamina", "Movement of the cilia on the apical surface", "Secretion of mucus from goblet cells"], "answer": 0, "explanation": "Tight junctions seal the paracellular route (fence and gate functions). Their leakiness varies by tissue: very tight in the bladder and distal tubule, leaky in the proximal tubule.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0016", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "recall", "stem": "Epithelia are characterised by all of the following EXCEPT", "options": ["A rich intrinsic blood supply", "Polarity with apical and basal surfaces", "Attachment to a basement membrane", "Close cell apposition with little matrix", "High regenerative capacity"], "answer": 0, "explanation": "Epithelia are avascular and depend on diffusion from the underlying connective tissue. They are polarised, sit on a basal lamina, have abundant junctions and turn over rapidly.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0017", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "recall", "stem": "Ciliated pseudostratified epithelium with goblet cells is called respiratory epithelium and its function is", "options": ["Mucociliary clearance", "Absorption of nutrients", "Gas exchange", "Protection from abrasion", "Filtration of blood"], "answer": 0, "explanation": "Goblet cells secrete mucus that traps particles; cilia beat toward the pharynx to clear it. Smoking metaplasia to squamous epithelium loses this and predisposes to infection.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0018", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "step", "stem": "A child has recurrent sinusitis, bronchiectasis, and situs inversus. Electron microscopy of respiratory cilia shows absence of the dynein arms. Which of the following processes is most directly impaired?", "options": ["Sliding of adjacent microtubule doublets to bend the axoneme", "Assembly of the actin core of microvilli", "Formation of tight junctions", "Secretion of mucus by goblet cells", "Anchoring of cilia to basal bodies"], "answer": 0, "explanation": "Kartagener syndrome. Without dynein the doublets cannot slide, cilia are immotile, mucus is not cleared, and nodal cilia cannot generate leftward flow, randomising sidedness. Males are infertile because sperm flagella share the defect.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0019", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "step", "stem": "A biopsy from the oesophagus of a man with long-standing reflux shows the normal lining replaced by columnar epithelium with goblet cells. Which of the following best describes this change?", "options": ["Metaplasia from squamous to columnar epithelium", "Hyperplasia of the basal squamous cells", "Dysplasia of the basal layer of the epithelium", "Atrophy of the mucosa with loss of cell layers", "Hypertrophy of the surface columnar cells"], "answer": 0, "explanation": "Barrett's oesophagus is a metaplastic response to acid: one adult epithelium replaced by another better suited to the insult. It carries a risk of progression to dysplasia and adenocarcinoma.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0020", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "step", "stem": "A section of the bladder from a patient at post-mortem shows a lining several cells thick with rounded surface cells. A second section from the same bladder taken when it was distended shows a thinner epithelium with flattened surface cells. What accounts for the difference?", "options": ["Transitional epithelium unfolds its plaque-rich apical membrane as the organ fills", "The epithelium is stratified squamous and desquamates when stretched", "The bladder is lined by simple columnar cells that flatten", "Cells were lost during fixation", "The distended bladder is lined by mesothelium"], "answer": 0, "explanation": "Urothelial umbrella cells have stiff membrane plaques stored in fusiform vesicles that insert into the apical membrane on stretch, so the epithelium changes shape without losing its impermeability.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0021", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "step", "stem": "An infant develops profuse watery diarrhoea from the first days of life. Biopsy of the small intestine shows enterocytes lacking a brush border and containing intracellular vesicles lined by microvilli. Which cellular process has failed?", "options": ["Trafficking of apical membrane to the cell surface", "Assembly of tight junctions", "Synthesis of actin", "Secretion of disaccharidases", "Migration of cells from the crypt"], "answer": 0, "explanation": "Microvillus inclusion disease. The motor myosin Vb is needed to deliver apical membrane vesicles; without it the microvilli assemble inside the cell rather than on it.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-S01-0022", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-S01", "system": "General", "type": "step", "stem": "A woman with coeliac disease has bloating and diarrhoea after drinking milk, although she tolerated it before her diagnosis. Which of the following best explains her new intolerance?", "options": ["Villous atrophy has removed the brush border where lactase is anchored", "She has developed an allergy to milk protein", "Her tight junctions have become leaky", "Goblet cells have stopped secreting mucus", "Her enterocytes no longer express GLUT2"], "answer": 0, "explanation": "Lactase sits in the glycocalyx of the microvilli. When coeliac disease flattens the villi and destroys the brush border, lactase is lost with the surface, producing secondary lactase deficiency that recovers on a gluten-free diet.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.4", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0001", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The abdominal aorta bifurcates at the level of", "options": ["L4", "L3", "L5", "L2", "The sacral promontory"], "answer": 0, "explanation": "The aorta divides into the common iliac arteries at L4, at about the level of the umbilicus and the iliac crests. The IVC forms one level lower, at L5.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0002", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The unpaired visceral branches of the abdominal aorta are the", "options": ["Celiac trunk, superior mesenteric, and inferior mesenteric arteries", "Renal, suprarenal, and gonadal arteries", "Inferior phrenic, lumbar, and median sacral arteries", "Celiac trunk, renal, and gonadal arteries", "Superior mesenteric, renal, and median sacral arteries"], "answer": 0, "explanation": "The three unpaired visceral branches supply the gut tube (celiac T12, SMA L1, IMA L3). The paired visceral branches are the suprarenal, renal and gonadal arteries; the parietal branches are the inferior phrenics, four pairs of lumbars, and the unpaired median sacral.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0003", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The paired visceral branches of the abdominal aorta are the", "options": ["Middle suprarenal, renal, and gonadal arteries", "Inferior phrenic, lumbar, and gonadal arteries", "Celiac, renal, and lumbar arteries", "Superior suprarenal, renal, and inferior phrenic arteries", "Renal, gonadal, and common iliac arteries"], "answer": 0, "explanation": "Paired visceral: middle suprarenal (L1), renal (L1-L2), gonadal (L2). The inferior phrenics and lumbars are parietal. The superior suprarenals come from the inferior phrenics, not the aorta directly.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0004", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The renal arteries arise from the aorta at approximately the level of", "options": ["L1-L2", "T12", "L3", "L4", "T11"], "answer": 0, "explanation": "The renal arteries leave the aorta just below the SMA at about L1-L2. The right is longer and passes behind the IVC.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0005", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The right renal artery passes", "options": ["Posterior to the inferior vena cava", "Anterior to the inferior vena cava", "Posterior to the right renal vein and anterior to the IVC", "Between the IVC and the aorta anteriorly", "Anterior to the right ureter and IVC"], "answer": 0, "explanation": "Because the aorta lies to the left of the IVC, the right renal artery must cross behind the IVC to reach the right kidney. The left renal vein must cross in front of the aorta to reach the IVC.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0006", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The inferior vena cava is formed at the level of", "options": ["L5", "L4", "L3", "S1", "L2"], "answer": 0, "explanation": "The common iliac veins unite behind the right common iliac artery at L5 to form the IVC, one vertebral level below the aortic bifurcation.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0007", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The left suprarenal vein drains into the", "options": ["Left renal vein", "Inferior vena cava directly", "Left inferior phrenic vein", "Left gonadal vein", "Splenic vein"], "answer": 0, "explanation": "Left-sided asymmetry: left suprarenal and left gonadal veins drain into the left renal vein; on the right both drain directly into the IVC. The right suprarenal vein is short and wide, and tears easily in adrenalectomy.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0008", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "Which vein is at risk of compression in the aortomesenteric angle?", "options": ["Left renal vein", "Right renal vein", "Left gonadal vein", "Inferior mesenteric vein", "Splenic vein"], "answer": 0, "explanation": "The left renal vein passes between the aorta behind and the SMA in front. Compression causes left renal venous hypertension, haematuria, left flank pain, and left varicocele (nutcracker syndrome).", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0009", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The structures at the renal hilum, from anterior to posterior, are", "options": ["Renal vein, renal artery, renal pelvis", "Renal artery, renal vein, renal pelvis", "Renal pelvis, renal artery, renal vein", "Renal vein, renal pelvis, renal artery", "Renal artery, renal pelvis, renal vein"], "answer": 0, "explanation": "VAP anterior to posterior: vein, artery, pelvis. The renal artery often divides before the hilum, and a posterior segmental branch may lie behind the pelvis.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0010", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The right kidney lies lower than the left because of the", "options": ["Liver", "Spleen", "Duodenum", "Right suprarenal gland", "Hepatic flexure"], "answer": 0, "explanation": "The large right lobe of the liver pushes the right kidney about 1-2 cm lower. The hila are roughly at L1 (left) and L1-L2 (right), and the 12th rib crosses the upper pole of the right kidney and the middle of the left.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0011", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The kidney is enclosed, from inside out, by the", "options": ["Fibrous capsule, perirenal fat, renal fascia, pararenal fat", "Renal fascia, perirenal fat, fibrous capsule, pararenal fat", "Fibrous capsule, renal fascia, perirenal fat, pararenal fat", "Perirenal fat, fibrous capsule, renal fascia, pararenal fat", "Fibrous capsule, pararenal fat, renal fascia, perirenal fat"], "answer": 0, "explanation": "Capsule, perirenal (perinephric) fat, renal (Gerota's) fascia, then pararenal fat. Perirenal fat and Gerota's fascia enclose the suprarenal too, but a septum separates gland from kidney so a nephrectomy can leave the adrenal behind.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0012", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The three normal constrictions of the ureter are at the", "options": ["Pelviureteric junction, pelvic brim, and ureteric orifice", "Renal hilum, pelvic brim, and bladder neck", "Pelviureteric junction, crossing of the gonadal vessels, and ureteric orifice", "Pelviureteric junction, crossing of the common iliac artery, and bladder neck", "Renal pelvis, crossing of the psoas tendon, and vesical trigone"], "answer": 0, "explanation": "Stones lodge at the pelviureteric junction, where the ureter crosses the pelvic brim over the common iliac bifurcation, and at the intramural passage through the bladder wall.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0013", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The ureter crosses the pelvic brim", "options": ["Anterior to the bifurcation of the common iliac artery", "Posterior to the external iliac artery", "Anterior to the internal iliac vein", "Medial to the common iliac vein", "Lateral to the gonadal vessels"], "answer": 0, "explanation": "Water runs under the bridge for the gonadal vessels (they cross anterior to the ureter), but at the brim the ureter itself crosses anterior to the common iliac bifurcation, a landmark used to find it at surgery.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0014", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "Ureteric colic is referred to the", "options": ["Loin to groin, along T11-L2 dermatomes", "Umbilicus only, along T10", "Epigastrium, along T5-T9", "Perineum, along S2-S4", "Shoulder tip, along C3-C5"], "answer": 0, "explanation": "Ureteric afferents enter the cord at T11-L2, so pain runs from the loin down toward the groin and scrotum or labium as the stone descends. Nausea and vomiting come from shared visceral pathways.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0015", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The suprarenal gland receives arterial supply from", "options": ["Three sources: inferior phrenic, aorta, and renal arteries", "Two sources: aorta and renal arteries", "One source: the middle suprarenal artery from the aorta", "Three sources: aorta, renal, and gonadal arteries", "Two sources: inferior phrenic and celiac trunk"], "answer": 0, "explanation": "Superior suprarenal from the inferior phrenic, middle from the aorta, inferior from the renal artery. Venous drainage is by a single suprarenal vein on each side.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0016", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The right suprarenal vein drains into the", "options": ["Inferior vena cava", "Right renal vein", "Right inferior phrenic vein", "Azygos vein", "Right gonadal vein"], "answer": 0, "explanation": "The right suprarenal vein is short and enters the IVC directly at an angle that makes it prone to avulsion during surgery. The left drains into the left renal vein.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0017", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The caval opening of the diaphragm is at the level of", "options": ["T8", "T10", "T12", "T6", "T11"], "answer": 0, "explanation": "I 8 (IVC at T8) 10 EGGS (oesophagus at T10) AT 12 (aorta at T12). The caval opening is in the central tendon, so it widens on inspiration; the aortic hiatus is behind the diaphragm between the crura and is not compressed.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0018", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "Which structure passes through the caval opening with the IVC?", "options": ["Branches of the right phrenic nerve", "Right vagus nerve", "Thoracic duct", "Azygos vein", "Right greater splanchnic nerve"], "answer": 0, "explanation": "The caval opening at T8 transmits the IVC and terminal branches of the right phrenic nerve. The left phrenic pierces the muscular diaphragm separately.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0019", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The oesophageal hiatus transmits the oesophagus and the", "options": ["Anterior and posterior vagal trunks", "Thoracic duct", "Azygos vein", "Left phrenic nerve", "Greater splanchnic nerves"], "answer": 0, "explanation": "The oesophageal hiatus at T10, formed by the right crus, transmits the oesophagus, both vagal trunks, oesophageal branches of the left gastric vessels, and some lymphatics.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0020", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The aortic hiatus is at the level of", "options": ["T12", "T10", "T8", "L1", "T11"], "answer": 0, "explanation": "The aortic hiatus lies behind the median arcuate ligament between the two crura at T12 and transmits the aorta, the thoracic duct, and the azygos vein. Because it is behind rather than through the muscle, the aorta is not compressed in inspiration.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0021", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The greater splanchnic nerve enters the abdomen by", "options": ["Piercing the crus of the diaphragm", "Passing through the aortic hiatus", "Passing behind the medial arcuate ligament with the sympathetic trunk", "Passing through the oesophageal hiatus with the vagal trunks", "Passing behind the lateral arcuate ligament"], "answer": 0, "explanation": "The splanchnic nerves pierce the ipsilateral crus to reach the celiac ganglia. The sympathetic trunk passes behind the medial arcuate ligament over psoas; the subcostal nerve passes behind the lateral arcuate ligament over quadratus lumborum.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0022", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The medial arcuate ligament arches over the", "options": ["Psoas major", "Quadratus lumborum", "Aorta", "Iliacus", "Sympathetic trunk only"], "answer": 0, "explanation": "Medial arcuate ligament over psoas major (with the sympathetic trunk passing behind it), lateral arcuate ligament over quadratus lumborum (with the subcostal nerve behind it), median arcuate ligament over the aorta.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0023", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "Irritation of the diaphragm refers pain to the", "options": ["Shoulder tip", "Umbilicus", "Epigastrium", "Loin", "Groin"], "answer": 0, "explanation": "Kehr's sign: blood or pus under the diaphragm irritates its central part, supplied by the phrenic nerve (C3-C5), and pain is felt at the C4 dermatome on the shoulder. The peripheral diaphragm is supplied by lower intercostal nerves and refers to the abdominal wall.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0024", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The psoas major muscle inserts on the", "options": ["Lesser trochanter of the femur", "Greater trochanter of the femur", "Iliac crest", "Anterior superior iliac spine", "Intertrochanteric line"], "answer": 0, "explanation": "Psoas major and iliacus share a tendon to the lesser trochanter, making iliopsoas the chief hip flexor. The lumbar plexus forms within the substance of psoas, which is why a psoas abscess can present with nerve signs.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0025", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The lumbar plexus is formed by the anterior rami of", "options": ["L1-L4", "L1-L5", "L2-L5", "T12-L3", "L4-S3"], "answer": 0, "explanation": "The lumbar plexus forms within psoas major from L1-L4 (plus a T12 twig). L4-S3 contribute to the sacral plexus via the lumbosacral trunk.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0026", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "Which nerve emerges from the lateral border of psoas major?", "options": ["Iliohypogastric nerve", "Genitofemoral nerve", "Obturator nerve", "Lumbosacral trunk", "Femoral branch of the genitofemoral only"], "answer": 0, "explanation": "Lateral border: iliohypogastric, ilioinguinal, lateral femoral cutaneous, femoral. Anterior surface: genitofemoral (pierces it). Medial border: obturator nerve and lumbosacral trunk.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0027", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The genitofemoral nerve is distinctive in that it", "options": ["Pierces psoas major and runs on its anterior surface", "Emerges from the medial border of psoas", "Passes behind the inguinal ligament with the femoral artery", "Supplies the adductor compartment of the thigh", "Passes through the obturator foramen"], "answer": 0, "explanation": "The genitofemoral nerve (L1-L2) emerges through the anterior surface of psoas and descends on it. Its genital branch enters the deep inguinal ring; its femoral branch goes beneath the inguinal ligament to the skin of the femoral triangle.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0028", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The obturator nerve emerges from the", "options": ["Medial border of psoas major", "Lateral border of psoas major", "Anterior surface of psoas major", "Posterior surface of quadratus lumborum", "Substance of iliacus"], "answer": 0, "explanation": "The obturator nerve (L2-L4) leaves the medial border of psoas, runs on the lateral pelvic wall, and exits through the obturator canal to supply the adductors and skin of the medial thigh.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0029", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The lateral femoral cutaneous nerve passes into the thigh", "options": ["Beneath or through the inguinal ligament just medial to the ASIS", "Through the femoral canal", "Through the obturator foramen", "Beneath the inguinal ligament with the femoral artery", "Through the superficial inguinal ring"], "answer": 0, "explanation": "The lateral femoral cutaneous nerve (L2-L3) passes under the lateral end of the inguinal ligament near the ASIS, where it can be entrapped by tight belts or obesity to give meralgia paraesthetica.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0030", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "Sympathetic innervation of the bladder detrusor produces", "options": ["Relaxation of the detrusor and contraction of the internal urethral sphincter", "Contraction of the detrusor and relaxation of the internal sphincter", "Contraction of both the detrusor and internal sphincter", "Relaxation of both the detrusor and internal sphincter", "Contraction of the external urethral sphincter"], "answer": 0, "explanation": "Sympathetic (T11-L2, hypogastric nerve) is storage: β3 relaxes detrusor, α1 closes the internal sphincter. Parasympathetic (S2-S4, pelvic splanchnics) is voiding: M3 contracts detrusor. The external sphincter is somatic via the pudendal nerve.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0031", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "The vesicoureteric junction resists reflux because", "options": ["The ureter passes obliquely through the bladder wall and is compressed as the bladder fills", "The ureteric orifice has a circular smooth-muscle sphincter", "The ureter enters at the apex of the bladder", "Sympathetic tone keeps the orifice closed", "The trigone contracts during filling"], "answer": 0, "explanation": "The intramural ureter tunnels obliquely through detrusor for 1-2 cm. Rising bladder pressure flattens the tunnel, acting as a flap valve. A short tunnel in children causes vesicoureteric reflux.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0032", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "Most abdominal aortic aneurysms arise", "options": ["Below the renal arteries", "Above the celiac trunk", "Between the celiac trunk and the SMA", "At the origin of the SMA", "In the common iliac arteries"], "answer": 0, "explanation": "Roughly 90% of AAAs are infrarenal. The infrarenal aorta has fewer vasa vasorum and less elastin, and takes the full pulse-wave reflection from the bifurcation, all of which favour degeneration there.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0033", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "During open AAA repair, which artery is commonly ligated with the expectation that collaterals will preserve its territory?", "options": ["Inferior mesenteric artery", "Superior mesenteric artery", "Renal artery", "Celiac trunk", "Common iliac artery"], "answer": 0, "explanation": "The IMA usually arises from the aneurysm sac and is oversewn. The left colon survives on the marginal artery from the middle colic and on retrograde flow from the internal iliacs via the rectal arteries, provided those are intact.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0034", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "recall", "stem": "Quadratus lumborum attaches superiorly to the", "options": ["Twelfth rib", "Eleventh rib", "Transverse process of L1 only", "Iliac crest", "Body of T12"], "answer": 0, "explanation": "Quadratus lumborum runs from the iliac crest and iliolumbar ligament to the 12th rib and the transverse processes of L1-L4. It fixes the 12th rib during inspiration and laterally flexes the trunk.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0035", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "step", "stem": "A 70-year-old man collapses with severe back pain and hypotension. A pulsatile mass is felt in the abdomen. At laparotomy a ruptured aneurysm is found arising below the origin of the renal arteries. Which of the following best explains why this segment is most prone to aneurysm?", "options": ["It has fewer vasa vasorum and less elastin, and bears reflected pulse waves from the bifurcation", "It is compressed repeatedly by the third part of the duodenum during peristalsis", "It gives off no branches and so its wall is thinner than the rest of the aorta", "It lies directly on the lumbar vertebral bodies and is abraded with each pulse", "It is derived from the embryonic aortic sac and retains a primitive wall structure"], "answer": 0, "explanation": "The infrarenal aorta has a thinner media with less elastin, is poorly served by vasa vasorum, and receives reflected pressure waves from the bifurcation. This is why 90% of AAAs are infrarenal.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0036", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "step", "stem": "A 42-year-old man has sudden severe left flank pain radiating to the left groin and testicle, with haematuria. Which structure has the stone most likely become lodged against at the point of crossing the pelvic brim?", "options": ["Bifurcation of the common iliac artery", "Origin of the external iliac vein", "Crossing of the gonadal vessels", "Emergence of the obturator nerve", "Passage of the lumbosacral trunk"], "answer": 0, "explanation": "The ureter narrows where it crosses the pelvic brim in front of the bifurcation of the common iliac artery. Pain follows T11-L2 to the groin and scrotum because the ureteric afferents and the genitofemoral and ilioinguinal territories share cord segments.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0037", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "step", "stem": "A 55-year-old woman has a left renal cell carcinoma with tumour extending into the left renal vein. Which of the following veins is most likely to become obstructed as a result?", "options": ["Left gonadal vein", "Right gonadal vein", "Left inferior phrenic vein", "Inferior mesenteric vein", "Right suprarenal vein"], "answer": 0, "explanation": "The left gonadal and left suprarenal veins drain into the left renal vein rather than the IVC. Tumour thrombus in the renal vein blocks the gonadal vein and produces a new left varicocele that does not empty on lying down.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0038", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "step", "stem": "A 28-year-old woman has pain in the right lower abdomen that is worse on extending the hip. CT shows a collection tracking down the psoas sheath from a tuberculous vertebral body. Which of the following nerves is most likely to be compressed within the sheath?", "options": ["Femoral nerve", "Obturator nerve", "Sciatic nerve", "Genitofemoral nerve", "Superior gluteal nerve"], "answer": 0, "explanation": "The lumbar plexus forms within psoas major. The femoral nerve lies in the groove between psoas and iliacus, so a psoas abscess presents with hip flexion, pain on extension, and can compress the femoral nerve to weaken the quadriceps.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0039", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "step", "stem": "Following an open appendicectomy through a gridiron incision, a young man develops weakness of the abdominal wall above the inguinal ligament and a direct inguinal hernia. Which nerve was most likely divided?", "options": ["Iliohypogastric nerve", "Ilioinguinal nerve", "Genitofemoral nerve", "Subcostal nerve", "Lateral femoral cutaneous nerve"], "answer": 0, "explanation": "The iliohypogastric nerve (L1) runs between internal oblique and transversus toward the pubis and is at risk in the gridiron incision. It supplies the muscles that reinforce the posterior inguinal wall, so its loss predisposes to direct hernia.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0040", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "step", "stem": "A 40-year-old man who wears a tight belt reports burning and numbness over the anterolateral thigh with no motor deficit. Which nerve is compressed and where?", "options": ["Lateral femoral cutaneous nerve, beneath the inguinal ligament near the ASIS", "Femoral nerve, beneath the inguinal ligament lateral to the artery", "Obturator nerve, in the obturator canal", "Genitofemoral nerve, on the surface of psoas", "Ilioinguinal nerve, in the inguinal canal"], "answer": 0, "explanation": "Meralgia paraesthetica is entrapment of the purely sensory lateral femoral cutaneous nerve (L2-L3) as it passes under the lateral end of the inguinal ligament. No motor loss distinguishes it from femoral neuropathy.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0041", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "step", "stem": "During a left adrenalectomy the surgeon ligates the main venous drainage of the gland. Into which vessel does it normally drain?", "options": ["Left renal vein", "Inferior vena cava", "Left inferior phrenic vein", "Splenic vein", "Left gonadal vein"], "answer": 0, "explanation": "The left suprarenal vein drains into the left renal vein, as does the left gonadal vein. The right suprarenal vein drains directly into the IVC.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0042", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "step", "stem": "A 65-year-old man with a ruptured spleen has pain at his left shoulder tip that worsens when he lies flat. Which of the following explains the site of his pain?", "options": ["Blood irritates the central diaphragm, whose afferents run in the phrenic nerve to C3-C5, sharing segments with the supraclavicular nerves", "The spleen's visceral afferents follow the greater splanchnic nerve to T5-T9, which projects to the shoulder", "The peritoneum over the spleen is supplied by the intercostobrachial nerve", "Blood tracks up to the axilla through the left paracolic gutter", "The left vagus carries splenic pain to the cervical cord"], "answer": 0, "explanation": "Kehr's sign is referred diaphragmatic pain. The central tendon is supplied by the phrenic nerve, whose sensory fibres enter the cord at C3-C5 alongside the supraclavicular nerves to the shoulder skin.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0043", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "step", "stem": "A patient with a spinal cord injury at T6 has a bladder that fills without sensation and then empties reflexly. Which nerves mediate the reflex emptying that remains intact?", "options": ["Pelvic splanchnic nerves from S2-S4", "Hypogastric nerves from T11-L2", "Pudendal nerve from S2-S4", "Lumbar splanchnic nerves", "Sacral splanchnic nerves"], "answer": 0, "explanation": "Detrusor contraction is parasympathetic via the pelvic splanchnics. With the cord cut above the sacral centre, the local reflex arc survives and the bladder empties automatically. The pudendal nerve controls the voluntary external sphincter and is somatic.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0044", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "step", "stem": "During surgery on the posterior abdominal wall a resident identifies a nerve passing posterior to the lateral arcuate ligament. Which nerve is it?", "options": ["Subcostal nerve", "Sympathetic trunk", "Iliohypogastric nerve", "Greater splanchnic nerve", "Femoral nerve"], "answer": 0, "explanation": "The subcostal nerve (T12) passes behind the lateral arcuate ligament on quadratus lumborum. The sympathetic trunk passes behind the medial arcuate ligament on psoas. The splanchnics pierce the crura.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L09-0045", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L09", "system": "Abdomen", "type": "step", "stem": "A 60-year-old woman has right-sided hydronephrosis. Angiography shows a large right renal artery aneurysm. Which venous structure lies immediately anterior to the aneurysm?", "options": ["Inferior vena cava", "Right renal vein", "Right gonadal vein", "Portal vein", "Azygos vein"], "answer": 0, "explanation": "The right renal artery passes posterior to the IVC en route to the kidney because the aorta is to the left of the IVC. A dilated right renal artery therefore compresses the IVC from behind.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0001", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "The neural plate is induced by the", "options": ["Notochord and paraxial mesoderm", "Primitive streak", "Endoderm of the yolk sac", "Neural crest", "Prechordal plate only"], "answer": 0, "explanation": "The notochord (and adjacent paraxial mesoderm) signals to the overlying ectoderm, which thickens into the neural plate at about day 18. This is primary neurulation.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0002", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "The neural tube closes first at the level of the", "options": ["Future cervical region", "Cranial neuropore", "Caudal neuropore", "Lumbosacral region", "Future midbrain"], "answer": 0, "explanation": "Closure begins in the cervical region and zips both cranially and caudally. The cranial neuropore closes on about day 25 and the caudal neuropore on about day 27-28.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0003", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "The cranial neuropore closes on approximately day", "options": ["25", "18", "21", "28", "35"], "answer": 0, "explanation": "Cranial neuropore day 25, caudal neuropore day 27-28. Failure of the cranial end gives anencephaly; failure of the caudal end gives spina bifida.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0004", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "Failure of the caudal neuropore to close results in", "options": ["Spina bifida", "Anencephaly", "Encephalocele", "Holoprosencephaly", "Hydrocephalus"], "answer": 0, "explanation": "The caudal neuropore forms the lumbosacral cord. Failure of closure leaves an open neural plate (myeloschisis) or, with less severe defects, meningomyelocele or spina bifida occulta.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0005", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "Failure of the cranial neuropore to close results in", "options": ["Anencephaly", "Spina bifida occulta", "Meningomyelocele", "Tethered cord", "Dandy-Walker malformation"], "answer": 0, "explanation": "Without closure of the cranial neuropore the forebrain does not develop, the skull vault does not form over it, and the exposed neural tissue degenerates. Anencephaly is incompatible with life.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0006", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "Maternal supplementation shown to reduce neural tube defects is", "options": ["Folic acid", "Vitamin B12", "Iron", "Vitamin A", "Calcium"], "answer": 0, "explanation": "Folate reduces NTD risk by up to 70% but only if taken in the weeks before closure (day 28), which is before most women know they are pregnant. Hence pre-conception supplementation.", "tags": ["step1-hy", "verify"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0007", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "Elevated maternal serum alpha-fetoprotein most strongly suggests", "options": ["An open neural tube defect", "Trisomy 21", "Hydatidiform mole", "Twin pregnancy with a shared placenta", "Fetal cardiac malformation"], "answer": 0, "explanation": "Alpha-fetoprotein leaks from exposed neural tissue into amniotic fluid and maternal blood. It is raised with open spina bifida, anencephaly, and abdominal wall defects; it is low in trisomy 21.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0008", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "Neural crest cells originate from the", "options": ["Lateral edges of the neural plate", "Ventral midline of the notochord", "Paraxial mesoderm of the somites", "Primitive node at the streak's tip", "Intermediate mesoderm of the nephrotome"], "answer": 0, "explanation": "Neural crest cells arise from the neural folds at the junction with surface ectoderm, undergo epithelial-to-mesenchymal transition, and migrate extensively. They are ectodermal in origin but form many mesenchymal tissues.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0009", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "Which of the following is derived from neural crest?", "options": ["Adrenal medulla", "Adrenal cortex", "Anterior pituitary", "Lens of the eye", "Skeletal muscle of the limbs"], "answer": 0, "explanation": "Neural crest derivatives include dorsal root and autonomic ganglia, Schwann cells, adrenal medulla, melanocytes, enteric neurons, facial bones and cartilage, the aorticopulmonary septum, odontoblasts, and thyroid C cells. The adrenal cortex is mesoderm.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0010", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "The paraxial mesoderm gives rise to the", "options": ["Somites", "Kidneys and gonads", "Body wall lining and limb connective tissue", "Heart", "Notochord"], "answer": 0, "explanation": "Mesoderm is divided into three columns: paraxial (somites), intermediate (urogenital system), and lateral plate (somatic and splanchnic layers). The notochord is a separate axial structure.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0011", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "The intermediate mesoderm gives rise to the", "options": ["Kidneys, gonads and their ducts", "Vertebrae and ribs", "Dermis of the back", "Smooth muscle of the gut wall", "Pericardium"], "answer": 0, "explanation": "Intermediate mesoderm forms the urogenital ridge: nephrotomes, mesonephros, metanephros, and the gonads. This explains why the kidney is retroperitoneal from the start rather than having lost a mesentery.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0012", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "The somatic (parietal) layer of lateral plate mesoderm forms the", "options": ["Parietal peritoneum, pleura and pericardium, and the body wall dermis and connective tissue", "Visceral peritoneum and the smooth muscle of the gut", "Heart and blood vessels of the gut", "Vertebral column", "Kidneys"], "answer": 0, "explanation": "Somatic mesoderm lines the body wall (somatopleure with ectoderm); splanchnic mesoderm covers the gut (splanchnopleure with endoderm) and forms its smooth muscle, connective tissue, and the heart.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0013", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "Each somite differentiates into", "options": ["Sclerotome, myotome, and dermatome", "Sclerotome and myotome only", "Nephrotome, myotome, and dermatome", "Sclerotome, nephrotome, and dermatome", "Myotome and dermomyotome only"], "answer": 0, "explanation": "The ventromedial sclerotome forms vertebrae and ribs; the dorsolateral dermomyotome splits into myotome (skeletal muscle of the trunk) and dermatome (dermis of the back).", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0014", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "By the end of week 5, the number of somite pairs is approximately", "options": ["42-44", "20-22", "30-32", "33-35", "50-52"], "answer": 0, "explanation": "About 42-44 pairs form (4 occipital, 8 cervical, 12 thoracic, 5 lumbar, 5 sacral, 8-10 coccygeal); the first occipital and last several coccygeal disappear. The number of somites is used to age embryos in weeks 3-5.", "tags": ["verify"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0015", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "Resegmentation of the sclerotomes means that", "options": ["Each vertebra is formed from the caudal half of one sclerotome and the cranial half of the next", "Each vertebra is formed from a single sclerotome", "Each rib is formed from two adjacent myotomes", "Each spinal nerve serves two adjacent dermatomes", "The notochord is divided into segments by the vertebrae"], "answer": 0, "explanation": "Because each vertebra is built from halves of two sclerotomes, the myotomes (which do not resegment) bridge the intervertebral joints, and the spinal nerves come to lie between vertebrae at the intervertebral foramina.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0016", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "The myotome of each somite is innervated by", "options": ["The spinal nerve of its own segment, retained during migration", "The spinal nerve of the segment immediately above it", "The nearest cranial nerve at its final position", "Sympathetic fibres from the adjacent chain ganglion", "No fixed nerve until the muscle reaches its final position"], "answer": 0, "explanation": "Each myotome captures its own segmental nerve early, and the nerve follows the muscle during migration. This is why the diaphragm, which forms at C3-C5 and descends, keeps the phrenic nerve.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0017", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "Embryonic folding in the cephalocaudal direction is driven mainly by", "options": ["Rapid growth of the neural tube and brain vesicles", "Expansion of the yolk sac beneath the embryo", "Growth of the amnion over the dorsal surface", "Elongation of the notochord along the axis", "Contraction of the body stalk toward the placenta"], "answer": 0, "explanation": "The brain grows so fast that the head folds ventrally, swinging the septum transversum, heart, and buccopharyngeal membrane from cranial to ventral. Lateral folding, driven by somites, brings the body wall together ventrally.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0018", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "Before head folding, the septum transversum lies", "options": ["Cranial to the cardiogenic area and buccopharyngeal membrane", "Caudal to the cloacal membrane", "Lateral to the neural plate", "Between the notochord and the endoderm", "Within the yolk sac wall"], "answer": 0, "explanation": "The septum transversum is initially the most cranial mesoderm. Head folding rotates it beneath the heart, where it becomes the central tendon of the diaphragm and the framework of the liver.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0019", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "The diaphragm develops from four components. They are the", "options": ["Septum transversum, pleuroperitoneal membranes, dorsal mesentery of the oesophagus, and body wall muscle", "Septum transversum, pericardioperitoneal canals, lateral plate, and notochord", "Pleuroperitoneal membranes, somites, allantois, and yolk sac", "Septum transversum, cardiogenic mesoderm, neural crest, and endoderm", "Dorsal mesentery, ventral mesentery, myotomes, and pleura"], "answer": 0, "explanation": "Septum transversum (central tendon), pleuroperitoneal membranes (dorsolateral parts), dorsal mesentery of the oesophagus (crura), and ingrowth of body wall myoblasts from C3-C5 (peripheral muscle).", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0020", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "The central tendon of the diaphragm is derived from the", "options": ["Septum transversum", "Pleuroperitoneal membranes", "Dorsal mesentery of the oesophagus", "Body wall myotomes", "Cervical somites directly"], "answer": 0, "explanation": "The septum transversum forms the central tendon. The pleuroperitoneal membranes close the pericardioperitoneal canals; the dorsal mesentery forms the crura; body wall contributions form the peripheral muscle.", "tags": [], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0021", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "The crura of the diaphragm are derived from the", "options": ["Dorsal mesentery of the oesophagus", "Septum transversum", "Pleuroperitoneal membranes", "Body wall", "Cervical myotomes"], "answer": 0, "explanation": "The mesoderm around the oesophagus, the dorsal mesentery, forms the crura and the median portion behind the aorta.", "tags": [], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0022", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "A congenital diaphragmatic hernia most commonly results from", "options": ["Failure of the pleuroperitoneal membrane to close the canal", "Failure of the septum transversum to form the central tendon", "Absence of the dorsal mesentery around the oesophagus", "Persistence of the ductus venosus through the liver", "Failure of body wall myoblasts to migrate into the septum"], "answer": 0, "explanation": "Bochdalek hernia, posterolateral and left-sided in about 85%, is a defect in the pleuroperitoneal membrane. The left closes later than the right and the liver protects the right, so the left is far commoner. Abdominal contents enter the chest and cause pulmonary hypoplasia.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0023", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "The main cause of death in a newborn with a large congenital diaphragmatic hernia is", "options": ["Pulmonary hypoplasia", "Bowel strangulation", "Cardiac failure", "Liver rupture", "Oesophageal obstruction"], "answer": 0, "explanation": "Abdominal viscera in the chest compress the developing lungs, reducing bronchial branching and alveolar number. The hypoplastic lungs and pulmonary hypertension are what kill, not the hernia itself.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0024", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "The vitelline duct normally connects the midgut to the", "options": ["Yolk sac", "Allantois", "Amniotic cavity", "Bladder", "Placenta"], "answer": 0, "explanation": "The vitelline (omphalomesenteric) duct joins the midgut loop to the yolk sac through the umbilicus. It normally obliterates by week 7. Its persistence gives Meckel's diverticulum, a fistula, or a cyst.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0025", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "Meckel's diverticulum is a remnant of the", "options": ["Vitelline duct", "Urachus", "Allantois", "Umbilical vein", "Cloaca"], "answer": 0, "explanation": "Meckel's is the commonest GI congenital anomaly: rule of 2s, in about 2% of people, 2 feet from the ileocaecal valve, 2 inches long, 2 types of ectopic mucosa (gastric, pancreatic), usually symptomatic before age 2, twice as common in males.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0026", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "Meckel's diverticulum is located on the", "options": ["Antimesenteric border of the ileum", "Mesenteric border of the ileum", "Antimesenteric border of the jejunum", "Greater curvature of the stomach", "Apex of the caecum"], "answer": 0, "explanation": "The vitelline duct was attached to the apex of the midgut loop opposite the SMA, so its remnant sits on the antimesenteric border of the ileum, unlike acquired diverticula which emerge where vessels pierce the wall.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0027", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "Physiological herniation of the midgut into the umbilical cord occurs during", "options": ["Week 6, returning by week 10", "Week 3, returning by week 5", "Week 10, returning by week 12", "Week 12, returning by week 20", "Week 8, returning at birth"], "answer": 0, "explanation": "The midgut loop grows faster than the abdominal cavity, herniates into the umbilical cord in week 6, rotates 90 degrees counter-clockwise there, and returns in week 10 rotating a further 180 degrees.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0028", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "Omphalocele results from", "options": ["Failure of the midgut to return to the abdomen after physiological herniation", "Failure of the lateral body folds to close the anterior wall", "Persistence of the vitelline duct", "Failure of the urachus to obliterate", "Rupture of the amnion"], "answer": 0, "explanation": "Omphalocele is a midline defect at the umbilicus with the herniated viscera covered by amnion and peritoneum. It is strongly associated with chromosomal and cardiac anomalies.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0029", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "recall", "stem": "Gastroschisis differs from omphalocele in that gastroschisis", "options": ["Is a paraumbilical defect with bowel that is not covered by a membrane", "Is covered by amnion", "Is located in the midline through the umbilical ring", "Is associated with chromosomal anomalies in most cases", "Involves the liver in most cases"], "answer": 0, "explanation": "Gastroschisis is a full-thickness body wall defect usually to the right of the umbilicus. The bowel is exposed to amniotic fluid, matted and thickened, but chromosomal anomalies are rare and prognosis is good after surgery.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0030", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "step", "stem": "A woman has an ultrasound at 18 weeks showing an open defect over the lumbosacral spine with a fluid-filled sac containing neural tissue. Maternal AFP is elevated. Which of the following events failed?", "options": ["Closure of the caudal neuropore around day 27-28", "Closure of the cranial neuropore around day 25", "Induction of the neural plate by the notochord", "Migration of neural crest cells", "Formation of the primitive streak"], "answer": 0, "explanation": "A meningomyelocele in the lumbosacral region means the caudal neuropore did not close. The defect occurred in the fourth week, before the mother knew she was pregnant, which is why folate must be started before conception.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0031", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "step", "stem": "A neonate has respiratory distress at birth. Examination shows a scaphoid abdomen and bowel sounds in the left chest. Which of the following embryonic structures failed to develop normally?", "options": ["Left pleuroperitoneal membrane", "Septum transversum", "Left dorsal mesentery of the oesophagus", "Left body wall myotomes", "Left pericardioperitoneal canal septum from the heart"], "answer": 0, "explanation": "A left posterolateral (Bochdalek) hernia results from the pleuroperitoneal membrane failing to close the pericardioperitoneal canal by week 8. Bowel in the chest empties the abdomen and compresses the lung.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0032", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "step", "stem": "A 2-year-old boy presents with painless rectal bleeding. A nuclear scan with technetium-99m pertechnetate shows uptake in the right lower abdomen. Which of the following best explains the finding?", "options": ["Ectopic gastric mucosa in a persistent vitelline duct remnant", "Ectopic pancreatic tissue in the appendix", "A duplicated ileum", "Bleeding from a hindgut polyp", "An ileal intussusception"], "answer": 0, "explanation": "Pertechnetate is taken up by gastric mucosa. A Meckel's diverticulum containing ectopic gastric epithelium secretes acid, ulcerates the adjacent ileum, and bleeds painlessly. Meckel's is the commonest cause of significant lower GI bleeding in young children.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0033", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "step", "stem": "An infant is born with a membrane-covered sac at the umbilicus containing loops of bowel and part of the liver. Which of the following is the most likely additional finding?", "options": ["A chromosomal or cardiac anomaly", "Normal chromosomes and no other defects", "Bowel that is thickened and matted from exposure", "A defect to the right of the umbilicus", "A persistent vitelline duct"], "answer": 0, "explanation": "This is an omphalocele. Because it reflects a global failure of the midgut to return, it is often part of a syndrome (trisomy 13, 18, Beckwith-Wiedemann) and associated with cardiac defects. Gastroschisis is isolated and uncovered.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0034", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "step", "stem": "A newborn has a sinus at the umbilicus that leaks yellow fluid. On probing, the tract leads to a loop of ileum. Which structure failed to obliterate?", "options": ["Vitelline duct", "Urachus", "Umbilical vein", "Umbilical artery", "Allantois"], "answer": 0, "explanation": "A patent vitelline duct produces an ileo-umbilical fistula discharging bowel contents. A patent urachus would leak urine and would connect to the bladder.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.5-7 and 15", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L10-0035", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L10", "system": "General", "type": "step", "stem": "A woman drinks heavily from week 3 to week 8 of pregnancy. The child is born with midface hypoplasia and a smooth philtrum. Which population of cells is most likely to have been damaged?", "options": ["Neural crest cells migrating into the facial primordia", "Paraxial mesoderm of the cranial somites
