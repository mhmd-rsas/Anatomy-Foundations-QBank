rrhoea, bradycardia and miosis", "Dry mouth, urinary retention, tachycardia and mydriasis", "Sweating, tremor, tachycardia and hyperglycaemia", "Hypertension, piloerection, mydriasis and bronchodilation", "Fasciculation, weakness, tachycardia and hypertension"], "answer": 0, "explanation": "SLUDD plus the three decreases: heart rate, bronchial diameter, pupil diameter. Atropine reverses them. Organophosphate poisoning produces this picture plus nicotinic effects.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0021", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "G-protein receptor kinase 2 (GRK2) contributes to heart failure by", "options": ["Phosphorylating β receptors and uncoupling them from Gs", "Stimulating adenylyl cyclase and raising cAMP production", "Blocking α1 receptors on the coronary vessels", "Phosphorylating phospholamban and activating SERCA", "Opening L-type calcium channels and raising calcium entry"], "answer": 0, "explanation": "Chronic sympathetic drive upregulates GRK2, which phosphorylates β1 receptors so β-arrestin binds and uncouples them. Contractile reserve falls. β-blockers reduce this drive and improve mortality.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0022", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "step", "stem": "A 24-year-old asthmatic uses salbutamol frequently and develops tremor and a serum potassium of 3.1 mmol/L. Which mechanism explains the low potassium?", "options": ["β2 stimulation of the Na+/K+-ATPase drives potassium into skeletal muscle cells", "β2 stimulation increases renal potassium excretion", "α1 stimulation causes potassium loss in sweat", "β1 stimulation of the kidney releases renin", "M3 stimulation increases intestinal potassium secretion"], "answer": 0, "explanation": "β2 agonists increase cAMP, activating the sodium pump in skeletal muscle and shifting potassium intracellularly. The same effect is used therapeutically to treat hyperkalaemia with nebulised salbutamol.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0023", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "step", "stem": "A farmer is exposed to an organophosphate insecticide. He has salivation, wheezing, a heart rate of 40, pinpoint pupils and muscle twitching. Which of the following best explains the twitching alongside the other signs?", "options": ["Excess acetylcholine is acting on nicotinic receptors at the neuromuscular junction", "The insecticide is directly toxic to skeletal muscle fibres", "Nicotinic receptors at the neuromuscular junction are being blocked", "Hypokalaemia from profuse sweating is causing muscle irritability", "β2 receptors on skeletal muscle are being stimulated by adrenaline"], "answer": 0, "explanation": "Acetylcholinesterase inhibition raises ACh at every cholinergic synapse. Muscarinic excess gives SLUDD and bradycardia; nicotinic excess at the NMJ gives fasciculations then paralysis. Atropine treats only the muscarinic component.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0024", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "step", "stem": "A patient with severe hypertension is given phenylephrine by mistake. Which second-messenger pathway is activated in his vascular smooth muscle, and what is the effect?", "options": ["Gq to IP3 and calcium release, causing contraction", "Gs to cAMP, causing relaxation", "Gi to reduced cAMP, causing relaxation", "Guanylyl cyclase to cGMP, causing relaxation", "Ligand-gated sodium channel, causing depolarisation"], "answer": 0, "explanation": "Phenylephrine is an α1 agonist. α1 is Gq-coupled; IP3 releases calcium from the sarcoplasmic reticulum and MLCK is activated, contracting the vessel and raising pressure.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0025", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "step", "stem": "A 55-year-old man with heart failure is started on a β-blocker and improves over months. Which of the following best explains the long-term benefit despite the drug's negative inotropic effect?", "options": ["Reduced sympathetic drive restores β receptor sensitivity and slows remodelling", "Increased cAMP in myocytes raises contractility over time", "β2 stimulation produces a direct and sustained positive inotropy", "Increased sympathetic outflow from the brainstem supports the failing heart", "Enhanced calcium release through IP3 improves the contractile reserve"], "answer": 0, "explanation": "Chronic catecholamine excess in failure drives hypertrophy, apoptosis and β receptor downregulation. Blocking it restores receptor sensitivity and prevents remodelling; the benefit is on the heart's structure, not immediate contractility.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0026", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "step", "stem": "During an experiment, an isolated heart is perfused with acetylcholine and the heart rate falls. Adding a toxin that ADP-ribosylates Gi abolishes the slowing. Which of the following was the toxin most likely blocking?", "options": ["M2 receptor signalling through Gi", "M3 receptor signalling through Gq", "β1 receptor signalling through Gs", "Nicotinic receptor cation flux", "α1 receptor signalling through Gq"], "answer": 0, "explanation": "Pertussis toxin inactivates Gi. M2 receptors on the SA node are Gi-coupled; without Gi, acetylcholine cannot open GIRK channels or lower cAMP, so the bradycardic effect disappears.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0027", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "step", "stem": "A patient with a pheochromocytoma has an episode of severe hypertension and a heart rate of 130. He is given a non-selective β-blocker alone and his blood pressure rises further. Which of the following explains the paradox?", "options": ["Loss of β2-mediated vasodilation leaves unopposed α1 vasoconstriction from circulating catecholamines", "The β-blocker stimulates α1 receptors directly", "β1 blockade increases renin release", "The drug is a partial agonist at β2", "β-blockade increases catecholamine release from the tumour"], "answer": 0, "explanation": "Adrenaline dilates skeletal muscle beds via β2. Blocking β2 removes that dilation while α1 constriction continues, so pressure climbs. α-blockade must come first in pheochromocytoma.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0028", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "step", "stem": "A woman is prescribed a drug that blocks nicotinic receptors in autonomic ganglia. Which of the following pairs correctly predicts the effects, given which division dominates each organ at rest?", "options": ["Tachycardia and constipation", "Bradycardia and diarrhoea", "Tachycardia and diarrhoea", "Bradycardia and hypertension", "Miosis and urinary retention"], "answer": 0, "explanation": "At rest the heart is under parasympathetic dominance, so ganglion blockade speeds it. The gut is also parasympathetically dominant, so blockade slows it. The vessels are sympathetically dominant, so pressure falls.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0001", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The foregut ends and the midgut begins at the", "options": ["Major duodenal papilla in the second part of the duodenum", "Pylorus", "Duodenojejunal flexure", "Minor duodenal papilla", "Junction of the first and second parts of the duodenum"], "answer": 0, "explanation": "The foregut-midgut boundary is at the opening of the bile duct into the duodenum. This is why the duodenum is described as two-thirds foregut and why the gastroduodenal artery (celiac) and the inferior pancreaticoduodenal (SMA) meet around the second part.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0002", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The midgut ends and the hindgut begins at the", "options": ["Junction of the proximal two-thirds and distal third of the transverse colon", "Ileocaecal junction", "Hepatic flexure", "Rectosigmoid junction", "Junction of the descending and sigmoid colon"], "answer": 0, "explanation": "The midgut-hindgut junction lies about two-thirds along the transverse colon, close to the splenic flexure. The SMA supplies up to this point, the IMA beyond it, and the marginal artery links them across the watershed.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0003", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "Visceral pain from midgut structures is referred to the", "options": ["Umbilical (T10) region", "Epigastric (T5-T9) region", "Hypogastric (T11-L1) region", "Right upper quadrant", "Left iliac fossa"], "answer": 0, "explanation": "Foregut pain is epigastric, midgut pain periumbilical, hindgut pain suprapubic. The referral follows the sympathetic afferents entering the cord at the greater (T5-T9), lesser (T10-T11), and least/lumbar (T12-L2) splanchnic levels.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0004", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The celiac trunk arises from the abdominal aorta at the level of", "options": ["T12", "L1", "L2", "T11", "L3"], "answer": 0, "explanation": "Celiac trunk T12, SMA L1, renal arteries L1-L2, gonadal arteries L2, IMA L3, bifurcation L4. The celiac trunk arises just below the aortic hiatus and immediately divides into three branches.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0005", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The branches of the celiac trunk are the", "options": ["Left gastric, splenic, and common hepatic arteries", "Left gastric, right gastric, and hepatic arteries", "Splenic, gastroduodenal, and common hepatic arteries", "Left gastric, splenic, and gastroduodenal arteries", "Left gastric, proper hepatic, and splenic arteries"], "answer": 0, "explanation": "The celiac trunk trifurcates into the left gastric (smallest), the splenic (largest), and the common hepatic artery. The right gastric and gastroduodenal are branches of the hepatic.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0006", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The gastroduodenal artery arises from the", "options": ["Common hepatic artery", "Proper hepatic artery", "Splenic artery", "Superior mesenteric artery", "Celiac trunk directly"], "answer": 0, "explanation": "The common hepatic divides into the proper hepatic and the gastroduodenal. The gastroduodenal then gives the right gastro-omental and the superior pancreaticoduodenal arteries, running behind the first part of the duodenum.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0007", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The artery eroded by a posterior duodenal ulcer is the", "options": ["Gastroduodenal artery", "Left gastric artery", "Splenic artery", "Superior mesenteric artery", "Right gastric artery"], "answer": 0, "explanation": "The gastroduodenal artery runs directly behind the first part of the duodenum. Posterior ulcers there bleed; anterior ulcers perforate into the peritoneum. Lesser-curve gastric ulcers erode the left gastric artery.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0008", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The short gastric arteries are branches of the", "options": ["Splenic artery", "Left gastric artery", "Left gastro-omental artery", "Common hepatic artery", "Celiac trunk"], "answer": 0, "explanation": "The short gastrics run in the gastrosplenic ligament to the fundus. The splenic artery also gives the left gastro-omental artery, which runs along the greater curvature in the greater omentum.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0009", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The superior mesenteric artery arises from the aorta at the level of", "options": ["L1", "T12", "L2", "L3", "L4"], "answer": 0, "explanation": "The SMA leaves the aorta at L1, about 1 cm below the celiac trunk, and passes anterior to the left renal vein, the uncinate process, and the third part of the duodenum, all of which can be compressed in the aortomesenteric angle.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0010", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "Which structure is compressed between the SMA and the aorta in nutcracker syndrome?", "options": ["Left renal vein", "Third part of the duodenum", "Left gonadal vein", "Uncinate process of the pancreas", "Inferior mesenteric vein"], "answer": 0, "explanation": "Nutcracker compresses the left renal vein; SMA (Wilkie's) syndrome compresses the third part of the duodenum. Both live in the same angle, which narrows when the retroperitoneal fat pad is lost.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0011", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The first branch of the superior mesenteric artery is the", "options": ["Inferior pancreaticoduodenal artery", "Middle colic artery", "Ileocolic artery", "First jejunal artery", "Right colic artery"], "answer": 0, "explanation": "The inferior pancreaticoduodenal artery leaves the SMA as it emerges from behind the pancreas and anastomoses with the superior pancreaticoduodenal from the gastroduodenal, joining celiac and SMA territories across the foregut-midgut boundary.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0012", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "Which artery supplies the appendix?", "options": ["Ileocolic artery", "Right colic artery", "Middle colic artery", "Last ileal artery", "Sigmoid artery"], "answer": 0, "explanation": "The appendicular artery is a branch of the posterior caecal branch of the ileocolic. It runs in the free edge of the mesoappendix and is an end artery, which is why appendicitis progresses to gangrene.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0013", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The middle colic artery supplies the", "options": ["Transverse colon", "Ascending colon", "Descending colon", "Sigmoid colon", "Caecum"], "answer": 0, "explanation": "The middle colic supplies the transverse colon up to the midgut-hindgut junction; the right colic supplies the ascending colon; the ileocolic supplies caecum, appendix, and terminal ileum.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0014", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The inferior mesenteric artery arises from the aorta at the level of", "options": ["L3", "L1", "L2", "L4", "L5"], "answer": 0, "explanation": "The IMA arises at L3, a few centimetres above the bifurcation at L4, and supplies the hindgut through the left colic, sigmoid, and superior rectal arteries.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0015", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The superior rectal artery is the continuation of the", "options": ["Inferior mesenteric artery", "Internal iliac artery", "Middle rectal artery", "Median sacral artery", "Sigmoid artery"], "answer": 0, "explanation": "The IMA crosses the pelvic brim and continues as the superior rectal artery. The middle rectal comes from the internal iliac and the inferior rectal from the internal pudendal.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0016", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The marginal artery of Drummond", "options": ["Runs along the mesenteric border of the colon connecting SMA and IMA branches", "Is the terminal branch of the ileocolic artery", "Supplies the rectum below the pectinate line", "Connects the celiac trunk and the SMA behind the pancreas", "Runs in the free edge of the mesoappendix"], "answer": 0, "explanation": "The marginal artery is the continuous arcade along the colon formed by branches of the ileocolic, right, middle, and left colic and sigmoid arteries. It can be weak at the splenic flexure.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0017", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "Griffiths' point is a watershed zone at the", "options": ["Splenic flexure", "Rectosigmoid junction", "Hepatic flexure", "Ileocaecal junction", "Duodenojejunal flexure"], "answer": 0, "explanation": "Griffiths' point at the splenic flexure (SMA to IMA) and Sudeck's point at the rectosigmoid junction (IMA to internal iliac) are the two colonic watersheds most prone to ischaemia in hypotension.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0018", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The portal vein is formed by the union of the", "options": ["Superior mesenteric vein and splenic vein", "Superior mesenteric vein and inferior mesenteric vein", "Splenic vein and inferior mesenteric vein", "Left gastric vein and splenic vein", "Superior mesenteric vein and left renal vein"], "answer": 0, "explanation": "The portal vein forms behind the neck of the pancreas from the SMV and splenic vein. The IMV usually drains into the splenic vein first.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0019", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The inferior mesenteric vein most commonly drains into the", "options": ["Splenic vein", "Superior mesenteric vein", "Portal vein directly", "Left renal vein", "Inferior vena cava"], "answer": 0, "explanation": "The IMV usually ends in the splenic vein behind the pancreas, though it may join the SMV or the confluence itself. It carries hindgut blood into the portal system.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0020", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The portal vein lies in the hepatoduodenal ligament", "options": ["Posterior to both the bile duct and the hepatic artery", "Anterior to the bile duct and hepatic artery", "To the right of the bile duct", "To the left of the hepatic artery", "Between the bile duct and the hepatic artery"], "answer": 0, "explanation": "In the free edge of the lesser omentum the bile duct is anterior and right, the hepatic artery proper is anterior and left, and the portal vein lies behind both. This is the arrangement clamped in the Pringle manoeuvre.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0021", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "Oesophageal varices in portal hypertension form at the anastomosis between the", "options": ["Left gastric vein and the oesophageal veins draining to the azygos", "Splenic vein and the left renal vein", "Superior rectal vein and the middle rectal vein", "Paraumbilical veins and the epigastric veins", "Colic veins and the retroperitoneal veins"], "answer": 0, "explanation": "Oesophageal varices: left gastric (portal) to azygos tributaries (systemic). Rectal varices: superior rectal (portal) to middle and inferior rectal (systemic). Caput medusae: paraumbilical (portal) to epigastric (systemic). Retroperitoneal: colic veins to lumbar veins (veins of Retzius).", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0022", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "Caput medusae results from dilation of the anastomosis between the", "options": ["Paraumbilical veins and the superficial epigastric veins", "Left gastric and azygos veins", "Superior and middle rectal veins", "Splenic and left renal veins", "Colic and lumbar veins"], "answer": 0, "explanation": "Paraumbilical veins run in the falciform ligament along the ligamentum teres from the left portal branch to the umbilicus, where they meet the superficial epigastric, thoracoepigastric and inferior epigastric systems.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0023", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The most common cause of portal hypertension worldwide and in developed countries is", "options": ["Cirrhosis", "Portal vein thrombosis", "Budd-Chiari syndrome", "Schistosomiasis", "Constrictive pericarditis"], "answer": 0, "explanation": "Cirrhosis is an intrahepatic sinusoidal cause and is by far the commonest cause overall. Schistosomiasis is a leading cause in endemic regions. Thrombosis is prehepatic; Budd-Chiari and cardiac causes are posthepatic.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0024", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The pancreatic head, distal stomach, duodenum, gallbladder, and distal bile duct are resected together in", "options": ["Whipple's procedure", "Splenectomy", "Hemicolectomy", "Billroth I gastrectomy", "Cholecystectomy"], "answer": 0, "explanation": "Pancreaticoduodenectomy removes the head of the pancreas with the duodenum because they share the pancreaticoduodenal arcades; removing one devascularises the other. The gallbladder and distal bile duct go because the duct runs through the head.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0025", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "Lymph from the stomach ultimately drains to the", "options": ["Celiac lymph nodes", "Superior mesenteric lymph nodes", "Inferior mesenteric lymph nodes", "Lumbar lymph nodes", "Internal iliac lymph nodes"], "answer": 0, "explanation": "Foregut organs drain to celiac nodes, midgut to superior mesenteric nodes, hindgut to inferior mesenteric nodes, and all reach the cisterna chyli via intestinal trunks. Gastric cancer can reach the left supraclavicular node (Virchow) via the thoracic duct.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0026", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The hepatoduodenal ligament forms the anterior boundary of the", "options": ["Omental foramen", "Lesser sac", "Hepatorenal recess", "Right paracolic gutter", "Subphrenic space"], "answer": 0, "explanation": "The free edge of the lesser omentum is the anterior wall of the epiploic foramen of Winslow. The IVC is posterior, the caudate lobe superior, and the first part of the duodenum inferior.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0027", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The gastro-oesophageal junction is marked histologically by the", "options": ["Z-line", "Pyloric sphincter", "Cardiac notch", "Angular incisure", "Pectinate line"], "answer": 0, "explanation": "The Z-line is the squamocolumnar junction. When columnar epithelium migrates above it in response to acid reflux, the change is Barrett's oesophagus, a metaplasia that predisposes to adenocarcinoma.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0028", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The angular incisure of the stomach lies on the", "options": ["Lesser curvature", "Greater curvature", "Fundus", "Pyloric canal", "Cardia"], "answer": 0, "explanation": "The incisura angularis is the sharp bend on the lesser curvature marking the junction of the body and the pyloric part. It is the commonest site of gastric ulcers.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0029", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "Which feature distinguishes the jejunum from the ileum?", "options": ["The jejunum has longer vasa recta and fewer arterial arcades", "The jejunum has shorter vasa recta and more arterial arcades", "The jejunum has more Peyer's patches", "The jejunum has a thinner wall and narrower lumen", "The jejunum has more fat in its mesentery"], "answer": 0, "explanation": "Jejunum: wide lumen, thick wall, tall closely packed circular folds, long vasa recta, few large arcades, less mesenteric fat, few lymphoid patches. Ileum is the reverse on every point.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0030", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "Peyer's patches are most numerous in the", "options": ["Ileum", "Jejunum", "Duodenum", "Caecum", "Sigmoid colon"], "answer": 0, "explanation": "Aggregated lymphoid nodules are concentrated in the terminal ileum on the antimesenteric border. They are the site of entry for Salmonella typhi and the site of ileal ulceration in typhoid.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0031", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "Which of the following is a feature of the large intestine but not the small intestine?", "options": ["Omental appendices", "Circular folds", "Villi", "Peyer's patches", "Mesentery"], "answer": 0, "explanation": "Large intestine has taeniae coli, haustra, and omental (epiploic) appendices. The small intestine has plicae circulares and villi. Both have some mesentery in parts.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0032", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The taeniae coli converge at the", "options": ["Base of the appendix", "Ileocaecal valve", "Rectosigmoid junction", "Hepatic flexure", "Anal canal"], "answer": 0, "explanation": "The three taeniae fan out from the base of the appendix. Following the anterior taenia down the caecum is the surgeon's method for finding the appendix regardless of its position.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0033", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The most common position of the appendix is", "options": ["Retrocaecal", "Pelvic", "Subcaecal", "Pre-ileal", "Post-ileal"], "answer": 0, "explanation": "Retrocaecal is commonest (roughly two-thirds), then pelvic. A retrocaecal appendix irritates psoas, giving a positive psoas sign; a pelvic appendix irritates obturator internus and may cause diarrhoea or urinary symptoms.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0034", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "McBurney's point lies", "options": ["One-third of the way along a line from the ASIS to the umbilicus", "Two-thirds of the way along a line from the ASIS to the umbilicus", "At the midpoint of the inguinal ligament", "At the midpoint between the umbilicus and the pubic symphysis", "At the right costal margin in the midclavicular line"], "answer": 0, "explanation": "McBurney's point marks the base of the appendix on the surface, one-third of the distance from the ASIS toward the umbilicus. It is the point of maximal tenderness once the parietal peritoneum is involved.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0035", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The liver is divided into functional right and left lobes by", "options": ["Cantlie's line, from the gallbladder fossa to the IVC", "The falciform ligament", "The ligamentum venosum", "The ligamentum teres", "The transverse fissure at the porta hepatis"], "answer": 0, "explanation": "Cantlie's line follows the middle hepatic vein and divides the liver by portal and arterial supply into right and left halves. The falciform ligament divides it anatomically, leaving the quadrate and caudate lobes in a functionally left position.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0036", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The caudate lobe of the liver is located", "options": ["Posteriorly, between the IVC and the fissure for the ligamentum venosum", "Anteriorly, between the gallbladder and the ligamentum teres", "On the left of the falciform ligament", "On the diaphragmatic surface only", "Within the porta hepatis"], "answer": 0, "explanation": "The caudate lobe lies on the posterior surface bounded by the IVC on the right and the ligamentum venosum on the left; the quadrate lobe lies anteriorly between the gallbladder and the ligamentum teres, with the porta hepatis between them.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0037", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The ligamentum venosum is the remnant of the", "options": ["Ductus venosus", "Umbilical vein", "Umbilical artery", "Ductus arteriosus", "Vitelline vein"], "answer": 0, "explanation": "Ductus venosus becomes the ligamentum venosum; the left umbilical vein becomes the ligamentum teres hepatis; the umbilical arteries become the medial umbilical ligaments; the urachus becomes the median umbilical ligament.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0038", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The hepatorenal recess (Morison's pouch) is the space between the", "options": ["Liver and the right kidney", "Liver and the diaphragm", "Stomach and the pancreas", "Spleen and the left kidney", "Transverse colon and the greater omentum"], "answer": 0, "explanation": "Morison's pouch is the most dependent part of the peritoneal cavity in a supine patient above the pelvis, so fluid from a perforated ulcer or a ruptured spleen collects there and it is the first space checked on FAST scan.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0039", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The right subphrenic space communicates directly with the", "options": ["Hepatorenal recess", "Lesser sac", "Left subphrenic space", "Left paracolic gutter", "Pelvic cavity via the left gutter"], "answer": 0, "explanation": "The right subphrenic space, between the liver and diaphragm to the right of the falciform ligament, opens posteriorly into the hepatorenal recess and then into the right paracolic gutter, which runs freely to the pelvis. The falciform ligament blocks the left.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0040", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "Which structure limits the spread of fluid down the left paracolic gutter?", "options": ["Phrenicocolic ligament", "Falciform ligament", "Gastrosplenic ligament", "Transverse mesocolon", "Sigmoid mesocolon"], "answer": 0, "explanation": "The phrenicocolic ligament at the splenic flexure partially blocks the left gutter superiorly, so fluid from a left-sided source tends to go to the pelvis rather than up to the left subphrenic space.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0041", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The lesser sac lies posterior to the", "options": ["Stomach and lesser omentum", "Liver", "Transverse mesocolon", "Duodenum", "Right kidney"], "answer": 0, "explanation": "The omental bursa is the pocket behind the stomach and lesser omentum, bounded below by the transverse mesocolon and behind by the pancreas. It allows the stomach to slide during filling.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0042", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "Which vessel runs along the superior border of the pancreas?", "options": ["Splenic artery", "Splenic vein", "Superior mesenteric artery", "Gastroduodenal artery", "Left gastric artery"], "answer": 0, "explanation": "The tortuous splenic artery runs along the upper border of the pancreas; the splenic vein runs behind the gland. Pancreatic cancer of the body invades the splenic vein and can produce isolated gastric varices.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0043", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "recall", "stem": "The hepatic artery proper divides into right and left hepatic arteries. The cystic artery usually arises from the", "options": ["Right hepatic artery", "Left hepatic artery", "Common hepatic artery", "Gastroduodenal artery", "Superior mesenteric artery"], "answer": 0, "explanation": "The cystic artery classically comes from the right hepatic artery within the hepatobiliary triangle of Calot, bounded by the cystic duct, common hepatic duct, and inferior surface of the liver.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0044", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "step", "stem": "A 45-year-old man vomits bright red blood. Endoscopy shows an ulcer on the posterior wall of the first part of the duodenum with a visible bleeding vessel. Which artery is most likely eroded?", "options": ["Gastroduodenal artery", "Right gastric artery", "Superior mesenteric artery", "Left gastric artery", "Splenic artery"], "answer": 0, "explanation": "The gastroduodenal artery descends behind the duodenal cap. It is the vessel classically eroded by posterior duodenal ulcers and is a branch of the common hepatic artery.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0045", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "step", "stem": "A 70-year-old woman with atrial fibrillation develops sudden severe abdominal pain out of proportion to examination findings. CT shows an embolus occluding an artery just distal to its origin from the aorta at L1. Which part of the bowel is most at risk of infarction?", "options": ["Jejunum, ileum, and colon to the splenic flexure", "Stomach and duodenum", "Descending and sigmoid colon", "Rectum", "Transverse colon distal to the splenic flexure only"], "answer": 0, "explanation": "An artery arising at L1 is the SMA. It supplies the midgut: the gut distal to the major duodenal papilla to the junction of the proximal two-thirds and distal third of the transverse colon. Emboli lodge distal to the middle colic origin, so the proximal jejunum is often spared.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0046", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "step", "stem": "A 65-year-old man becomes hypotensive after a myocardial infarction and later develops bloody diarrhoea and left-sided abdominal pain. Colonoscopy shows ischaemic mucosa localised around the splenic flexure. Which of the following best explains the site?", "options": ["It is a watershed between the last SMA branch and the first IMA branch", "It is the point where the IMA arises from the aorta", "It is the site of the ileocolic artery's termination", "The marginal artery ends at the hepatic flexure", "It is supplied only by the superior rectal artery"], "answer": 0, "explanation": "Griffiths' point at the splenic flexure is where the middle colic and left colic territories meet through a marginal artery that may be tenuous. In low flow states it is the first colonic segment to suffer.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0047", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "step", "stem": "A 55-year-old man with alcoholic cirrhosis vomits blood. Endoscopy shows dilated veins in the lower oesophagus. Which of the following pairs of veins has become abnormally dilated at this site?", "options": ["Left gastric vein and oesophageal tributaries of the azygos vein", "Paraumbilical veins and superficial epigastric veins", "Superior rectal vein and middle rectal veins", "Splenic vein and left renal vein", "Colic veins and lumbar veins"], "answer": 0, "explanation": "Oesophageal varices are a portosystemic anastomosis between the left gastric vein (portal) and oesophageal veins draining to the azygos (systemic). They bleed torrentially because of high portal pressure and thin walls.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0048", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "step", "stem": "A 60-year-old woman has painless jaundice, weight loss, and a palpable gallbladder. CT shows a mass in the head of the pancreas. Which of the following explains why the gallbladder is enlarged rather than shrunken?", "options": ["The bile duct is blocked below the cystic duct and the gallbladder wall is healthy", "The tumour has invaded the gallbladder wall and paralysed its smooth muscle", "A stone is obstructing the cystic duct and the gallbladder is distending with mucus", "The pancreatic duct is blocked and pancreatic juice is refluxing into the gallbladder", "The common hepatic duct is compressed above the cystic duct by an enlarged node"], "answer": 0, "explanation": "Courvoisier's sign: a palpable non-tender gallbladder with jaundice is unlikely to be gallstones, because stone disease scars the gallbladder so it cannot distend. A tumour compresses the bile duct below the cystic duct where it runs through the pancreatic head.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0049", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "step", "stem": "During a cholecystectomy the surgeon needs to identify the cystic artery safely. Which structures bound the triangle in which she will find it?", "options": ["Cystic duct, common hepatic duct, and liver surface", "Cystic duct, bile duct, and first part of the duodenum", "Common hepatic duct, portal vein, and gastroduodenal artery", "Right hepatic duct, left hepatic duct, and liver", "Cystic duct, gallbladder neck, and hepatic artery proper"], "answer": 0, "explanation": "The hepatobiliary triangle of Calot is bounded by the cystic duct, the common hepatic duct and the liver surface. The cystic artery usually crosses it from the right hepatic artery. Misidentifying the right hepatic artery or duct here is a classic cause of injury.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0050", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "step", "stem": "A surgeon controls haemorrhage from the liver by compressing the free edge of the lesser omentum between finger and thumb. Bleeding slows but continues. Which vessel is the most likely source of the persistent bleeding?", "options": ["Hepatic veins draining into the IVC", "Hepatic artery proper", "Portal vein", "Cystic artery", "Left gastric artery"], "answer": 0, "explanation": "The Pringle manoeuvre occludes the hepatoduodenal ligament and therefore the hepatic artery and portal vein. The hepatic veins drain directly into the IVC behind the liver and are not controlled; continued bleeding suggests a venous outflow injury.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0051", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "step", "stem": "A 22-year-old woman with appendicitis has pain on passive extension of her right hip. Which position of the appendix is most likely?", "options": ["Retrocaecal", "Pelvic", "Pre-ileal", "Post-ileal", "Subcaecal"], "answer": 0, "explanation": "A positive psoas sign indicates the inflamed appendix is lying against psoas major, which means it is retrocaecal, the commonest position. A pelvic appendix gives an obturator sign on internal rotation of the flexed hip.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0052", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "step", "stem": "A surgeon opens the abdomen for suspected appendicitis but cannot find the appendix in the right iliac fossa. Which of the following will reliably lead her to it?", "options": ["Following the anterior taenia coli of the caecum to its base", "Following the ileocolic artery to its termination", "Tracing the terminal ileum to the ileocaecal valve", "Palpating McBurney's point from inside", "Following the right paracolic gutter superiorly"], "answer": 0, "explanation": "The three taeniae coli converge on the base of the appendix, so tracing the anterior taenia down the caecum reaches it regardless of whether the appendix is retrocaecal, pelvic or elsewhere.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0053", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "step", "stem": "A trauma patient has a FAST scan showing free fluid between the liver and the right kidney. Assuming the fluid is blood from a ruptured spleen, through which route did it most likely reach this location?", "options": ["Down the left paracolic gutter to the pelvis, then up the right gutter", "Through the omental foramen into the lesser sac and then the right gutter", "Across the falciform ligament into the right subphrenic space", "Through the gastrosplenic ligament into the left subphrenic space", "Through the transverse mesocolon into the infracolic compartment"], "answer": 0, "explanation": "Blood from the left upper quadrant is blocked from going up the left gutter by the phrenicocolic ligament, so it tracks down to the pelvis and then rises up the right gutter into Morison's pouch, the most dependent supine space. This is why the right upper quadrant is scanned first.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0054", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "step", "stem": "A 48-year-old man has a gastric carcinoma of the lesser curvature. On examination there is a hard lymph node in the left supraclavicular fossa. Which of the following describes the route by which tumour cells reached it?", "options": ["Celiac nodes, cisterna chyli, thoracic duct, left venous angle", "Superior mesenteric nodes, right lymphatic duct, right venous angle", "Retrograde flow along the azygos vein into the neck veins", "Direct spread through the diaphragm into the posterior mediastinum", "Along the left gastric vein into the portal system and liver"], "answer": 0, "explanation": "Virchow's node enlarges because the thoracic duct empties at the left venous angle, receiving lymph from the whole abdomen via the cisterna chyli. Gastric drainage goes first to celiac nodes, then upward by this route.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0055", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "step", "stem": "A 50-year-old man develops severe epigastric pain radiating to the back. His amylase is markedly raised. Given the position of the pancreas, which of the following structures lies immediately posterior to the neck of the gland and is most at risk of thrombosis in severe pancreatitis?", "options": ["Origin of the portal vein", "Abdominal aorta", "Inferior vena cava", "Left renal vein", "Superior mesenteric artery"], "answer": 0, "explanation": "The portal vein forms behind the pancreatic neck from the SMV and splenic vein. Splenic vein thrombosis in pancreatitis produces gastric varices without oesophageal varices, because only the short gastric drainage is obstructed.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0056", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "step", "stem": "A surgeon is performing a Whipple procedure. Which of the following best explains why the duodenum must be removed with the head of the pancreas?", "options": ["They share the pancreaticoduodenal arterial arcades, so resecting one devascularises the other", "The duodenum is the usual site of the tumour", "The bile duct cannot be reconstructed without removing the duodenum", "The duodenum is intraperitoneal and cannot be separated from the head", "The superior mesenteric artery passes through the duodenal wall"], "answer": 0, "explanation": "The superior and inferior pancreaticoduodenal arteries run in the groove between the head and the C-loop of the duodenum, supplying both. Removing the head without the duodenum leaves the duodenum ischaemic.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L07-0057", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L07", "system": "Abdomen", "type": "step", "stem": "During a Billroth I gastrectomy the surgeon ligates the vessel running along the lesser curvature from the celiac trunk. Which vessel has she divided?", "options": ["Left gastric artery", "Right gastro-omental artery", "Left gastro-omental artery", "Short gastric arteries", "Gastroduodenal artery"], "answer": 0, "explanation": "The left gastric artery is the smallest celiac branch and runs along the lesser curvature to meet the right gastric from the hepatic artery. The gastro-omental arteries run along the greater curvature.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L01-0001", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L01", "system": "General", "type": "recall", "stem": "The most commonly used fixative in routine histology is", "options": ["Buffered formalin", "Absolute ethanol", "Glutaraldehyde", "Osmium tetroxide", "Bouin's fluid"], "answer": 0, "explanation": "Formalin cross-links proteins, halting autolysis and bacterial degradation while preserving morphology. Glutaraldehyde and osmium are used for electron microscopy.", "tags": [], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L01-0002", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L01", "system": "General", "type": "recall", "stem": "The purpose of dehydration in tissue processing is to", "options": ["Remove water before paraffin infiltration", "Kill microorganisms in the specimen", "Stain the nuclei before sectioning", "Decalcify any bone in the specimen", "Shrink the tissue to ease cutting"], "answer": 0, "explanation": "Water and paraffin are immiscible. Tissue is taken through graded alcohols, then a clearing agent (xylene) miscible with both alcohol and wax, then infiltrated with molten paraffin.", "tags": [], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L01-0003", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L01", "system": "General", "type": "recall", "stem": "The instrument used to cut paraffin sections is a", "options": ["Microtome", "Cryostat", "Ultramicrotome", "Vibratome", "Micromanipulator"], "answer": 0, "explanation": "A rotary microtome cuts paraffin blocks at 3-5 micrometres. A cryostat cuts frozen tissue for rapid intra-operative diagnosis. An ultramicrotome cuts resin-embedded tissue for electron microscopy.", "tags": [], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L01-0004", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L01", "system": "General", "type": "recall", "stem": "Haematoxylin stains", "options": ["Nuclei blue-purple", "Cytoplasm pink", "Collagen blue", "Lipids black", "Glycogen magenta"], "answer": 0, "explanation": "Haematoxylin is a basic (cationic) dye that binds acidic (basophilic) components: DNA, RNA, ribosome-rich cytoplasm. Eosin is acidic and binds basic (eosinophilic) proteins in the cytoplasm and collagen.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L01-0005", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L01", "system": "General", "type": "recall", "stem": "A structure described as eosinophilic", "options": ["Binds the acidic dye eosin and appears pink", "Binds haematoxylin and appears blue", "Contains large amounts of RNA", "Is rich in nucleic acids", "Is unstained by H&E"], "answer": 0, "explanation": "Eosinophilic structures are basic proteins: cytoplasm of muscle, collagen, red cells, and secretory granules of eosinophils. Basophilic structures are acidic: nucleus, rough ER, ribosomes.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L01-0006", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L01", "system": "General", "type": "recall", "stem": "A cell with abundant rough endoplasmic reticulum will appear on H&E as", "options": ["Basophilic in the cytoplasm", "Eosinophilic in the cytoplasm", "Unstained", "Black", "Green"], "answer": 0, "explanation": "The ribosomal RNA on rough ER is acidic and takes up haematoxylin, so protein-secreting cells (plasma cells, pancreatic acinar cells) have basophilic cytoplasm.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L01-0007", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L01", "system": "General", "type": "recall", "stem": "Periodic acid-Schiff stains", "options": ["Glycogen and mucins magenta", "Collagen and reticulin blue", "Elastic fibres black", "Nuclei and RNA blue", "Lipids and myelin red"], "answer": 0, "explanation": "PAS oxidises sugars to aldehydes, which react with Schiff reagent. It highlights glycogen, mucin, basement membranes and fungal walls.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L01-0008", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L01", "system": "General", "type": "recall", "stem": "Trichrome stains highlight", "options": ["Collagen", "Elastin", "Glycogen", "Nuclei only", "Lipid"], "answer": 0, "explanation": "Masson's trichrome stains collagen blue or green and muscle red, used to assess fibrosis in liver and kidney biopsies.", "tags": [], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L01-0009", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L01", "system": "General", "type": "recall", "stem": "Immunohistochemistry identifies", "options": ["Specific proteins using labelled antibodies", "DNA sequences using nucleic acid probes", "Lipids using osmium", "Carbohydrates using periodic acid", "Ions using fluorescent dyes"], "answer": 0, "explanation": "IHC uses antibodies coupled to an enzyme that produces a coloured product at the antigen's location. In situ hybridisation uses labelled nucleic acid probes to find DNA or RNA sequences.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L01-0010", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L01", "system": "General", "type": "recall", "stem": "The resolution limit of the light microscope is approximately", "options": ["0.2 micrometres", "2 micrometres", "20 nanometres", "0.2 nanometres", "20 micrometres"], "answer": 0, "explanation": "Resolution is limited by the wavelength of visible light to about 0.2 µm. Electron microscopy achieves about 0.2 nm because electrons have a far shorter wavelength.", "tags": ["step1-hy", "verify"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L01-0011", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L01", "system": "General", "type": "recall", "stem": "Frozen sections are used mainly for", "options": ["Rapid diagnosis during surgery", "Routine archival slides", "Electron microscopy", "Decalcified bone", "Cytology smears"], "answer": 0, "explanation": "A cryostat can produce a stained section in minutes, letting a pathologist advise on margins or diagnosis while the patient is on the table. Morphology is inferior to paraffin sections.", "tags": [], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L01-0012", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L01", "system": "General", "type": "recall", "stem": "Fixation before embedding is necessary because", "options": ["Unfixed tissue undergoes autolysis and bacterial decay", "Fixation stains the tissue", "Paraffin cannot infiltrate fixed tissue", "Fixed tissue is easier to freeze", "It removes water"], "answer": 0, "explanation": "Fixatives cross-link and precipitate proteins, inactivating enzymes and stabilising structure so subsequent processing does not destroy it.", "tags": [], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L01-0013", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L01", "system": "General", "type": "step", "stem": "A pathologist examines a liver biopsy and notes the cytoplasm of hepatocytes stains pale and washes out, while a PAS stain shows strong magenta granules that disappear after diastase treatment. What is the material?", "options": ["Glycogen", "Mucin", "Lipid", "Amyloid", "Haemosiderin"], "answer": 0, "explanation": "Glycogen is water-soluble and often lost in processing, but PAS shows it; diastase digests glycogen, so PAS-positive material that becomes negative after diastase is glycogen. Mucin is diastase-resistant.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L01-0014", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L01", "system": "General", "type": "step", "stem": "A biopsy shows a sheet of cells with abundant deeply basophilic cytoplasm and an eccentric nucleus with clumped chromatin. Which of the following organelles is most abundant in these cells?", "options": ["Rough endoplasmic reticulum", "Smooth endoplasmic reticulum", "Mitochondria", "Lysosomes", "Peroxisomes"], "answer": 0, "explanation": "Deep cytoplasmic basophilia reflects abundant RNA in rough ER and free ribosomes. These are plasma cells, protein factories for immunoglobulin, with a clock-face nucleus and a pale perinuclear Golgi zone.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L01-0015", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L01", "system": "General", "type": "step", "stem": "A surgeon wants to know whether a resection margin is clear of tumour while the patient is still under anaesthesia. Which technique should the pathologist use?", "options": ["Frozen section on a cryostat", "Paraffin section stained with H&E", "Electron microscopy", "Immunohistochemistry on a paraffin block", "In situ hybridisation"], "answer": 0, "explanation": "Only frozen section is fast enough for intra-operative decisions. Paraffin processing takes overnight; IHC and molecular tests take days.", "tags": [], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.1", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0001", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "The four basic tissue types are", "options": ["Epithelial, connective, muscle, and nervous", "Epithelial, connective, bone, and blood", "Covering, glandular, muscle, and nervous", "Connective, cartilage, muscle, and skin", "Epithelial, mesenchymal, neural, and vascular"], "answer": 0, "explanation": "Every organ is built from combinations of these four. Blood, bone and cartilage are all specialised connective tissues.", "tags": [], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0002", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "Connective tissue consists of", "options": ["Cells and extracellular matrix made of fibres and ground substance", "Cells only, tightly packed", "Fibres only", "Ground substance and blood vessels only", "Cells and a basement membrane"], "answer": 0, "explanation": "Unlike epithelium, connective tissue has abundant extracellular matrix. Matrix composition, fibre type and cell population define each subtype.", "tags": [], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0003", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "The principal cell that synthesises collagen and other matrix components is the", "options": ["Fibroblast", "Macrophage", "Mast cell", "Plasma cell", "Adipocyte"], "answer": 0, "explanation": "Fibroblasts secrete procollagen, elastin, proteoglycans and glycoproteins. Active fibroblasts have abundant rough ER; quiescent fibrocytes are spindle-shaped with little cytoplasm.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0004", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "The most abundant collagen in the body is", "options": ["Type I", "Type II", "Type III", "Type IV", "Type VII"], "answer": 0, "explanation": "Type I forms bone, tendon, ligament, dermis, fibrocartilage and organ capsules, providing tensile strength. It is the collagen defective in most forms of osteogenesis imperfecta.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0005", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "Type II collagen is characteristic of", "options": ["Hyaline and elastic cartilage", "Bone", "Basement membranes", "Reticular fibres", "Tendons"], "answer": 0, "explanation": "Type II forms thin fibrils in the cartilage matrix, resisting intermittent pressure. It is not assembled into thick fibres, which is why cartilage matrix looks homogeneous.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0006", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "Reticular fibres are composed of", "options": ["Type III collagen", "Type I collagen", "Type II collagen", "Type IV collagen", "Elastin"], "answer": 0, "explanation": "Reticulin (type III) forms the delicate framework of lymphoid organs, liver, spleen, bone marrow and around smooth muscle. It is argyrophilic, shown by silver stains, and is also the collagen of early wound healing.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0007", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "Type IV collagen is found in the", "options": ["Basal lamina", "Tendons", "Hyaline cartilage", "Reticular fibres of lymph nodes", "Anchoring fibrils"], "answer": 0, "explanation": "Type IV forms a sheet-like network rather than fibrils and is the structural core of the basal lamina. Mutations cause Alport syndrome; autoantibodies cause Goodpasture syndrome.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0008", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "Anchoring fibrils that attach the basal lamina to the underlying dermis are made of", "options": ["Type VII collagen", "Type IV collagen", "Type I collagen", "Fibrillin", "Laminin"], "answer": 0, "explanation": "Type VII forms anchoring fibrils at the dermal-epidermal junction. Defects produce dystrophic epidermolysis bullosa, with blistering below the basal lamina.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0009", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "Hydroxylation of proline and lysine during collagen synthesis requires", "options": ["Vitamin C", "Vitamin D", "Vitamin K", "Vitamin A", "Copper"], "answer": 0, "explanation": "Prolyl and lysyl hydroxylases need ascorbate as a cofactor. Without hydroxyproline the triple helix is unstable, so scurvy produces weak collagen: bleeding gums, poor wound healing, perifollicular haemorrhage.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0010", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "Cross-linking of collagen fibrils in the extracellular space is catalysed by", "options": ["Lysyl oxidase", "Prolyl hydroxylase", "Procollagen peptidase", "Matrix metalloproteinase", "Glycosyltransferase"], "answer": 0, "explanation": "Lysyl oxidase forms covalent cross-links between lysine and hydroxylysine residues of adjacent tropocollagen molecules, giving fibrils their tensile strength. Copper deficiency and Menkes disease impair it.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0011", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "Procollagen is converted to tropocollagen by", "options": ["Cleavage of terminal propeptides outside the cell", "Hydroxylation inside the rough ER", "Glycosylation in the Golgi", "Cross-linking by lysyl oxidase", "Triple helix formation"], "answer": 0, "explanation": "Procollagen peptidases remove the N- and C-terminal registration peptides after secretion, allowing tropocollagen to self-assemble into fibrils. Ehlers-Danlos type VII (dermatosparaxis) results from failure of this step.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0012", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "Elastic fibres consist of", "options": ["Elastin surrounded by fibrillin microfibrils", "Type I collagen", "Fibrillin alone", "Elastin and type III collagen", "Laminin and fibronectin"], "answer": 0, "explanation": "Elastin forms the amorphous core; fibrillin-1 microfibrils act as the scaffold on which it is deposited. Fibrillin-1 mutations cause Marfan syndrome, with weak aortic wall and lens dislocation.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0013", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "Marfan syndrome results from a defect in", "options": ["Fibrillin-1", "Type I collagen", "Type III collagen", "Elastin", "Lysyl oxidase"], "answer": 0, "explanation": "FBN1 mutations impair the microfibril scaffold for elastin, weakening elastic tissue in the aorta, lens zonules and skeleton. Fibrillin also normally sequesters TGF-β, and excess TGF-β signalling contributes.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0014", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "Ground substance is composed mainly of", "options": ["Glycosaminoglycans, proteoglycans and glycoproteins", "Collagen, elastin and reticular fibres", "Fibroblasts, macrophages and mast cells", "Water, electrolytes and plasma proteins", "Triglycerides, phospholipids and cholesterol"], "answer": 0, "explanation": "Highly hydrated GAGs (hyaluronan, chondroitin sulphate, heparan sulphate) attached to core proteins form proteoglycans, which trap water and resist compression. Laminin and fibronectin link cells to matrix.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0015", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "Mast cells contain granules rich in", "options": ["Histamine and heparin", "Collagen", "Immunoglobulin", "Lysozyme", "Melanin"], "answer": 0, "explanation": "Mast cells bind IgE via Fc receptors; cross-linking by allergen triggers degranulation with histamine, heparin, and proteases, and synthesis of leukotrienes. They are the effector cells of type I hypersensitivity.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0016", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "Plasma cells are derived from", "options": ["B lymphocytes", "T lymphocytes", "Monocytes", "Fibroblasts", "Mast cells"], "answer": 0, "explanation": "Plasma cells are terminally differentiated B cells that secrete immunoglobulin. They have eccentric clock-face nuclei, basophilic cytoplasm and a pale Golgi region.", "tags": [], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0017", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "Tissue macrophages arise from", "options": ["Blood monocytes", "Fibroblasts", "Lymphocytes", "Mast cells", "Endothelial cells"], "answer": 0, "explanation": "Monocytes leave the blood and differentiate into macrophages, which phagocytose debris, present antigen and secrete cytokines. Kupffer cells, alveolar macrophages and osteoclasts belong to the same lineage.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0018", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "Loose connective tissue differs from dense connective tissue in having", "options": ["More cells and fewer fibres", "More fibres and fewer cells", "No blood vessels or nerves", "Only fibroblasts and no other cells", "Fibres arranged in parallel bundles"], "answer": 0, "explanation": "Loose (areolar) tissue is cellular, well vascularised and flexible, filling spaces and supporting epithelia. Dense tissue is fibre-dominated: irregular in dermis and capsules, regular in tendons and ligaments.", "tags": [], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0019", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "Dense regular connective tissue is found in", "options": ["Tendons and ligaments", "Dermis", "Organ capsules", "Submucosa of the gut", "Lymph nodes"], "answer": 0, "explanation": "Parallel bundles of type I collagen with fibroblasts squeezed between them resist tension in a single direction. The dermis is dense irregular, resisting stress from any direction.", "tags": [], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0020", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "recall", "stem": "Brown adipose tissue differs from white in that brown adipocytes", "options": ["Are multilocular with many mitochondria and generate heat", "Store a single large lipid droplet", "Are found only in adults", "Lack a blood supply", "Secrete leptin only"], "answer": 0, "explanation": "Brown fat has many small lipid droplets and abundant mitochondria expressing uncoupling protein-1, which dissipates the proton gradient as heat. It is prominent in neonates.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0021", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "step", "stem": "A 6-year-old boy has recurrent fractures after minor trauma and blue sclerae. Which of the following is most likely defective?", "options": ["Type I collagen", "Type II collagen", "Type IV collagen", "Fibrillin-1", "Elastin"], "answer": 0, "explanation": "Osteogenesis imperfecta is caused by mutations in type I collagen. Bone, sclera and dentin all depend on it, explaining fragile bones, thin blue-appearing sclera and abnormal teeth.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0022", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "step", "stem": "A 20-year-old presents with a dislocated lens, arachnodactyly, and a dilated aortic root. Which extracellular matrix component is defective?", "options": ["Fibrillin-1 microfibrils", "Type I collagen", "Type III collagen", "Type IV collagen", "Hyaluronan"], "answer": 0, "explanation": "Marfan syndrome. Fibrillin-1 microfibrils scaffold elastic fibres in the aortic media and form the lens zonules. Loss weakens the aorta and lets the lens dislocate upward.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0023", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "step", "stem": "A young woman has haematuria, progressive deafness, and a family history of renal failure in males. Which of the following is the most likely defect?", "options": ["Type IV collagen in the glomerular basement membrane", "Type I collagen in bone", "Type III collagen in blood vessels", "Fibrillin-1 in elastic fibres", "Laminin in the basal lamina"], "answer": 0, "explanation": "Alport syndrome is a defect of type IV collagen chains (usually COL4A5, X-linked). The glomerular basement membrane splits and thins, and the same collagen in the cochlea and lens explains deafness and eye changes.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0024", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "step", "stem": "A sailor on a long voyage develops bleeding gums, bruising, and reopening of old scars. Which step in collagen synthesis is impaired?", "options": ["Hydroxylation of proline and lysine in the rough ER", "Cleavage of propeptides after secretion", "Cross-linking by lysyl oxidase", "Transcription of the collagen gene", "Assembly of fibrils into fibres"], "answer": 0, "explanation": "Scurvy is vitamin C deficiency. Prolyl hydroxylase cannot function, the triple helix is unstable, and new collagen is weak. Old scars reopen because collagen is continuously turned over.", "tags": ["step1-hy"], "source": "Mescher, Junqueira's Basic Histology 17e, Ch.5", "written": "2026-09-05", "status": "active"}, {"id": "F-HIS-L02-0025", "block": "Foundations", "discipline": "HIS", "unit": "F-HIS-L02", "system": "General", "type": "step", "stem": "A patient with Ehlers-Danlos syndrome has hy
