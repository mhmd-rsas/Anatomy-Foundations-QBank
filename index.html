ally Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0045", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "A 71-year-old woman develops a sharp pericardial pain that is worse lying supine and improved sitting forward. She also complains of pain over her left shoulder tip. Which nerve carries the shoulder-tip component of her pain?", "options": ["Phrenic nerve", "Vagus nerve", "Intercostal nerve T4", "Long thoracic nerve", "Suprascapular nerve"], "answer": 0, "explanation": "The fibrous and parietal pericardium are supplied by the phrenic nerve. Its C3-C5 afferents converge in the cord with the supraclavicular nerves of the same segments, so pericardial irritation is referred to the shoulder.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0046", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "A 58-year-old man presents with crushing chest pain and ST elevation in leads II, III and aVF. Angiography shows complete occlusion of a single vessel. In the most common coronary anatomy, which additional structure would be most likely to lose its blood supply?", "options": ["Atrioventricular node", "Anterior two-thirds of the interventricular septum", "Anterior papillary muscle of the left ventricle", "Left auricle", "Apex of the heart"], "answer": 0, "explanation": "Inferior ST elevation points to the right coronary territory. In right-dominant hearts the RCA gives the AV nodal branch at the crux, so inferior infarction is the one classically associated with AV block. The anterior septum and apex are LAD territory.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0047", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "A cardiac surgeon needs to stop all blood leaving the heart temporarily. She passes a tape through a pericardial sinus and pulls it tight around the great vessels. Through which sinus did the tape pass, and what does it encircle?", "options": ["Transverse sinus; ascending aorta and pulmonary trunk", "Oblique sinus; pulmonary veins", "Transverse sinus; superior vena cava and pulmonary veins", "Oblique sinus; ascending aorta and pulmonary trunk", "Transverse sinus; superior and inferior venae cavae"], "answer": 0, "explanation": "The transverse sinus is the passage behind the ascending aorta and pulmonary trunk and in front of the SVC. A tape through it isolates the arterial outflow, which is exactly what is needed to clamp both great arteries at once.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0048", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "A 19-year-old is stabbed in the left fourth intercostal space just lateral to the sternum. He becomes hypotensive with distended neck veins and muffled heart sounds. Which chamber is most likely to have been injured?", "options": ["Right ventricle", "Left ventricle", "Left atrium", "Right atrium", "Left auricle"], "answer": 0, "explanation": "The right ventricle forms most of the anterior (sternocostal) surface of the heart, so a parasternal stab in the 4th-5th space enters it most readily. Beck's triad indicates tamponade from the resulting haemopericardium.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0049", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "During thoracic surgery, a resident dissects immediately inferior to the aortic arch, just lateral to the ligamentum arteriosum. Postoperatively the patient has a hoarse voice. Which nerve was injured?", "options": ["Left recurrent laryngeal nerve", "Right recurrent laryngeal nerve", "Left vagus nerve above the arch", "Left phrenic nerve", "Left superior laryngeal nerve"], "answer": 0, "explanation": "The left recurrent laryngeal nerve hooks beneath the arch of the aorta lateral to the ligamentum arteriosum. The right nerve recurs higher, around the right subclavian artery, and is not in the field. An enlarged left atrium or an aortic arch aneurysm can produce the same hoarseness.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0050", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "A 45-year-old man has a malignant lymph node compressing the superior vena cava. His face and both arms are swollen and the veins on the anterior chest wall are dilated. Which vein most importantly provides collateral return of blood to the heart in this condition?", "options": ["Azygos vein", "Internal thoracic vein", "Left superior intercostal vein", "Hemiazygos vein", "Thoracic duct"], "answer": 0, "explanation": "In SVC obstruction the azygos system is the principal collateral, receiving blood from the posterior intercostal, lumbar, and vertebral veins and delivering it to the SVC below the block or to the IVC. The chest-wall veins visible on examination are part of this diversion.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0051", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "An 8-year-old has a patent ductus arteriosus. Which vessel is abnormally connected to the aorta?", "options": ["Left pulmonary artery", "Right pulmonary artery", "Left pulmonary vein", "Left subclavian artery", "Ascending aorta"], "answer": 0, "explanation": "The ductus arteriosus joins the pulmonary trunk at the origin of the left pulmonary artery to the aortic arch distal to the left subclavian. Its remnant is the ligamentum arteriosum.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0052", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "A woman undergoing surgery has her left phrenic nerve accidentally divided in the superior mediastinum. Which of the following would be expected at follow-up?", "options": ["Paradoxical upward movement of the left hemidiaphragm on inspiration", "Loss of sensation over the left anterior chest wall", "Paralysis of the left intercostal muscles", "Inability to abduct the left arm", "Loss of the left cough reflex"], "answer": 0, "explanation": "The phrenic nerve is the sole motor supply to its hemidiaphragm. A paralysed dome is pushed up by abdominal pressure when the contralateral side descends, seen as paradoxical movement on fluoroscopy.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0053", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "A 34-year-old woman is found on chest radiograph to have a mass that displaces the trachea to the right and lies above the level of the sternal angle, anterior to the great vessels. Which mediastinal compartment contains the mass and what is its most likely tissue of origin?", "options": ["Superior mediastinum; thymus", "Posterior mediastinum; sympathetic chain", "Middle mediastinum; pericardium", "Anterior mediastinum; lymph node", "Posterior mediastinum; oesophagus"], "answer": 0, "explanation": "A mass above the sternal angle is in the superior mediastinum; anterior to the great vessels at that level places it in the thymic area. Thymoma is the commonest anterior/superior mediastinal mass in adults.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0054", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "A patient with dysphagia is found on barium swallow to have indentation of the oesophagus at the level of T4. Which structure is most likely responsible?", "options": ["Arch of the aorta", "Left atrium", "Right main bronchus", "Cricopharyngeus muscle", "Descending thoracic aorta"], "answer": 0, "explanation": "The aortic arch crosses the oesophagus at T4 and produces one of its normal constrictions; an aneurysm here enlarges the impression. Left atrial enlargement indents lower and more posteriorly.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0055", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "A 24-year-old marathon runner has a heart rate of 44 bpm at rest. The physiological slowing of his heart is mediated primarily through nerve fibres that reach the heart via", "options": ["Cardiac branches of the vagus nerve synapsing in ganglia within the cardiac plexus", "Cardiac branches of the cervical sympathetic ganglia", "The greater splanchnic nerve", "The phrenic nerve", "The recurrent laryngeal nerve"], "answer": 0, "explanation": "Parasympathetic supply to the heart comes from the vagus, with preganglionic fibres synapsing in tiny ganglia in the cardiac plexus and atrial wall near the SA and AV nodes. Postganglionic fibres are short and release acetylcholine onto M2 receptors.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0056", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The anterior axillary fold is formed by the", "options": ["Pectoralis major", "Pectoralis minor", "Latissimus dorsi", "Teres major", "Serratus anterior"], "answer": 0, "explanation": "The anterior fold is pectoralis major; the posterior fold is latissimus dorsi with teres major. Serratus anterior forms the medial wall of the axilla.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0057", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The retromammary space lies between the breast and the", "options": ["Pectoral fascia", "Dermis of the skin", "Superficial fascia", "Pectoralis minor", "Costal cartilages"], "answer": 0, "explanation": "The retromammary space is a layer of loose areolar tissue between the breast and pectoral fascia that lets the breast move freely; fixation of a breast to underlying muscle suggests invasion through it.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0058", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "Most lymph from the breast (about 75%) drains to the", "options": ["Axillary lymph nodes", "Parasternal (internal thoracic) nodes", "Supraclavicular nodes", "Abdominal nodes", "Contralateral breast nodes"], "answer": 0, "explanation": "Roughly three-quarters of breast lymph, especially from the lateral quadrants, drains to axillary nodes (pectoral group first). The medial quadrants drain partly to the parasternal nodes, which is how cancer can cross to the opposite breast.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0059", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The intercostal neurovascular bundle lies in the costal groove in the order, from superior to inferior,", "options": ["Vein, artery, nerve", "Artery, vein, nerve", "Nerve, artery, vein", "Vein, nerve, artery", "Artery, nerve, vein"], "answer": 0, "explanation": "VAN from above down, tucked under the inferior border of the rib. This is why needles are placed at the upper border of the lower rib of an intercostal space.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0060", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The intercostal neurovascular bundle runs between which two muscle layers?", "options": ["Internal intercostal and innermost intercostal", "External intercostal and internal intercostal", "Innermost intercostal and endothoracic fascia", "External intercostal and pectoralis major", "Internal intercostal and parietal pleura"], "answer": 0, "explanation": "The bundle lies in the neurovascular plane between the internal and innermost intercostal muscles, the same relationship as in the abdominal wall between internal oblique and transversus.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0061", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "A chest tube for pneumothorax is typically inserted in the", "options": ["Fourth or fifth intercostal space, anterior to the midaxillary line", "Second intercostal space, midclavicular line", "Seventh intercostal space, posterior axillary line", "Ninth intercostal space, scapular line", "Sixth intercostal space, midclavicular line"], "answer": 0, "explanation": "The safe triangle bounded by pectoralis major, latissimus dorsi, and a line at the nipple level places the tube in the 4th-5th space, above the diaphragm and away from the internal thoracic and long thoracic structures.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0062", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "Thoracentesis should not be performed below which rib posteriorly?", "options": ["Ninth", "Seventh", "Eleventh", "Fifth", "Twelfth"], "answer": 0, "explanation": "Below rib 9 in the scapular line the needle risks passing through the diaphragm into liver or spleen, since the pleural reflection descends only to rib 12 but the diaphragmatic dome lies much higher.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0063", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The costodiaphragmatic recess is the site where", "options": ["Pleural fluid collects first when the patient is upright", "The lung expands during quiet breathing", "The phrenic nerve enters the diaphragm", "The pleura reflects onto the pericardium", "The azygos vein arches over the lung root"], "answer": 0, "explanation": "The costodiaphragmatic recess is the most dependent part of the pleural cavity, never entered by the lung, and the first place fluid pools on an upright film (blunting of the costophrenic angle).", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0064", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "At the midclavicular line, the parietal pleura extends inferiorly to the level of the", "options": ["Eighth rib", "Sixth rib", "Tenth rib", "Twelfth rib", "Seventh rib"], "answer": 0, "explanation": "Pleural reflections: rib 8 midclavicular, rib 10 midaxillary, rib 12 paravertebral. The lung margins are two ribs higher (6, 8, 10). The 2-4-6-8-10-12 pattern is the usual mnemonic.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0065", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "Which structure lies most anterior in the root of the lung?", "options": ["Pulmonary veins", "Pulmonary artery", "Main bronchus", "Bronchial artery", "Pulmonary ligament"], "answer": 0, "explanation": "In the hilum the veins are most anterior and inferior, the bronchus is most posterior, and the artery sits superior (left) or anterior to the bronchus (right). RALS describes the artery-to-bronchus relation.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0066", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "On the right side, the pulmonary artery is related to the main bronchus by lying", "options": ["Anterior to it", "Superior to it", "Posterior to it", "Inferior to it", "Medial to it"], "answer": 0, "explanation": "RALS: Right Anterior, Left Superior. The right pulmonary artery lies in front of the right main bronchus because the eparterial bronchus branches off before the artery reaches it.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0067", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The right lung has how many lobes and fissures?", "options": ["Three lobes, two fissures", "Two lobes, one fissure", "Three lobes, one fissure", "Two lobes, two fissures", "Four lobes, three fissures"], "answer": 0, "explanation": "The right lung has upper, middle and lower lobes separated by the oblique and horizontal fissures. The left lung has two lobes with only an oblique fissure, plus the lingula as the middle-lobe homologue.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0068", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "An aspirated foreign body is most likely to lodge in the", "options": ["Right main bronchus", "Left main bronchus", "Trachea above the carina", "Left lower lobe bronchus", "Right upper lobe bronchus"], "answer": 0, "explanation": "The right main bronchus is wider, shorter and more vertical than the left, so it catches most aspirated material. In a supine patient the object usually continues to the right lower lobe.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0069", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The carina lies at the level of the", "options": ["Sternal angle (T4/T5)", "Jugular notch (T2)", "Xiphisternal joint (T9)", "Cricoid cartilage (C6)", "T7 vertebra"], "answer": 0, "explanation": "The trachea bifurcates at the transverse thoracic plane. Widening of the carina on bronchoscopy suggests subcarinal lymphadenopathy, often from carcinoma.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0070", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The bronchial arteries usually arise from the", "options": ["Thoracic aorta", "Pulmonary trunk", "Internal thoracic artery", "Subclavian artery", "Intercostal arteries only"], "answer": 0, "explanation": "Bronchial arteries (typically one right, two left) come from the descending thoracic aorta and supply the bronchial tree and visceral pleura. The right often arises from a posterior intercostal artery.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0071", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The visceral pleura receives its sensory innervation from", "options": ["Autonomic fibres from the pulmonary plexus", "Intercostal nerves", "Phrenic nerve", "Vagus nerve, somatic branches", "Sympathetic trunk only"], "answer": 0, "explanation": "Visceral pleura is insensitive to pain and touch and carries only autonomic afferents. Parietal pleura is somatically innervated (intercostals for costal, phrenic for mediastinal and central diaphragmatic), which is why pleurisy hurts and lung parenchyma does not.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0072", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The pulmonary ligament is", "options": ["A double fold of pleura hanging inferiorly from the lung root", "A fold of pleura draped over the arch of the azygos vein", "The reflection of mediastinal pleura onto the fibrous pericardium", "A fibrous remnant of the ductus arteriosus below the aortic arch", "A fascial sling suspending the apex of the lung from the first rib"], "answer": 0, "explanation": "The pulmonary ligament hangs down from the hilum as a loose sleeve of pleura that allows the root to move during respiration and accommodates the lower lobe's expansion.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0073", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The thoracic aorta gives off how many pairs of posterior intercostal arteries?", "options": ["Nine, supplying spaces 3 to 11", "Eleven, supplying spaces 1 to 11", "Ten, supplying spaces 2 to 11", "Nine, supplying spaces 1 to 9", "Twelve, supplying spaces 1 to 12"], "answer": 0, "explanation": "The first two posterior intercostal arteries come from the supreme (superior) intercostal branch of the costocervical trunk. The aorta supplies the remaining nine spaces and the subcostal artery.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0074", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The anterior intercostal arteries of the upper six spaces arise from the", "options": ["Internal thoracic artery", "Musculophrenic artery", "Thoracic aorta", "Lateral thoracic artery", "Superior epigastric artery"], "answer": 0, "explanation": "The internal thoracic artery supplies anterior intercostals to spaces 1-6, then divides at the 6th costal cartilage into the musculophrenic (spaces 7-9) and superior epigastric arteries.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0075", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "recall", "stem": "The hemiazygos vein typically crosses the midline to join the azygos vein at about the level of", "options": ["T8", "T4", "T12", "T6", "T10"], "answer": 0, "explanation": "The hemiazygos crosses at roughly T8 and the accessory hemiazygos at roughly T7-T8. Both pass behind the aorta, oesophagus and thoracic duct.", "tags": ["verify"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0076", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "A 60-year-old woman notices dimpling of the skin over her right breast. On examination there is a hard mass in the upper outer quadrant. Which structure is most likely involved by the tumour to produce the dimpling?", "options": ["Suspensory ligaments of the breast", "Pectoralis major", "Lactiferous ducts", "Retromammary space", "Axillary lymphatics"], "answer": 0, "explanation": "Invasion and shortening of the suspensory (Cooper's) ligaments tethers the skin and produces dimpling. Blockage of dermal lymphatics gives the different peau d'orange appearance; fixation to pectoralis major limits movement rather than dimpling the skin.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0077", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "During axillary node dissection for breast cancer a nerve running on the surface of serratus anterior is damaged. On follow-up the patient cannot raise her arm above her head and her scapula protrudes when she pushes against a wall. Which nerve was injured?", "options": ["Long thoracic nerve", "Thoracodorsal nerve", "Medial pectoral nerve", "Intercostobrachial nerve", "Axillary nerve"], "answer": 0, "explanation": "The long thoracic nerve (C5-C7) lies on the lateral chest wall on serratus anterior and is exposed during axillary surgery. Loss of serratus produces winging and inability to protract and upwardly rotate the scapula for full abduction.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0078", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "A 45-year-old man is brought in after a stab wound to the right chest. On examination the trachea is deviated to the left, the right hemithorax is hyperresonant, and the neck veins are distended. Which of the following best explains the mediastinal shift?", "options": ["Air trapped in the pleural space is raising intrapleural pressure and pushing the mediastinum away", "Blood filling the pleural space is compressing the lung and pulling the mediastinum toward it", "The collapsed lung has lost volume and is drawing the mediastinum toward the injured side", "The divided phrenic nerve has paralysed the diaphragm and let the mediastinum rotate away", "Blood filling the pericardium is displacing the heart and trachea toward the opposite side"], "answer": 0, "explanation": "This is a tension pneumothorax: a flap-valve wound lets air in but not out, so pressure builds and the mediastinum is pushed contralaterally, kinking the great veins. A simple pneumothorax or collapse pulls the mediastinum ipsilaterally, if at all.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0079", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "A physician performs a thoracentesis in the eighth intercostal space in the midaxillary line. She inserts the needle immediately above the upper border of the ninth rib. Which structure has she deliberately avoided?", "options": ["The neurovascular bundle of the eighth space", "The dome of the right hemidiaphragm", "The visceral pleura of the lower lobe", "The internal thoracic artery", "The costodiaphragmatic recess"], "answer": 0, "explanation": "The neurovascular bundle sits in the costal groove along the inferior border of each rib, so entering just above the rib below keeps the needle furthest from it. The collateral branches along the upper rib border are small.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0080", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "A 3-year-old aspirates a peanut while lying on his back. Bronchoscopy is planned. Which bronchus is the peanut most likely to be found in?", "options": ["Right lower lobe bronchus", "Left lower lobe bronchus", "Right upper lobe bronchus", "Right middle lobe bronchus", "Left upper lobe bronchus"], "answer": 0, "explanation": "The right main bronchus receives most aspirated objects. In the supine position gravity directs the object into the superior segment of the right lower lobe; standing, it goes to the basal segments of the same lobe.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0081", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "A woman has a tumour compressing structures in the root of her right lung. Which of the following relationships correctly identifies the structure that is most posterior in the hilum and therefore most likely spared by an anteriorly placed mass?", "options": ["Main bronchus", "Pulmonary artery", "Superior pulmonary vein", "Inferior pulmonary vein", "Phrenic nerve"], "answer": 0, "explanation": "In both hila the bronchus is the most posterior structure, the veins are most anterior, and the artery is above (left) or in front (right). The phrenic nerve lies anterior to the whole root and would be the first involved.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0082", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "A patient has pleuritic chest pain that is sharply localised to the right lower chest wall and worsens with deep inspiration. Which nerve fibres are carrying this pain?", "options": ["Somatic afferents in the intercostal nerves from the costal parietal pleura", "Autonomic afferents from the visceral pleura via the pulmonary plexus", "Phrenic nerve afferents from the visceral pleura", "Vagal afferents from the lung parenchyma", "Sympathetic afferents from the bronchial tree"], "answer": 0, "explanation": "Well-localised, inspiration-related chest wall pain is parietal pleural pain carried by intercostal nerves. The visceral pleura and lung have no somatic pain innervation, which is why a lung tumour can grow large without pain until it reaches the parietal pleura.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L02-0083", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L02", "system": "Thorax", "type": "step", "stem": "A 55-year-old with a left upper lobe tumour has a hoarse voice and a small, drooping left pupil. Which two structures has the tumour most likely invaded?", "options": ["Left recurrent laryngeal nerve and the cervical sympathetic chain", "Left phrenic nerve and the left vagus", "Left recurrent laryngeal nerve and the left phrenic nerve", "Cervical sympathetic chain and the left phrenic nerve", "Left vagus above the arch and the brachial plexus"], "answer": 0, "explanation": "Hoarseness plus Horner's syndrome from an apical lung tumour indicates invasion of the recurrent laryngeal nerve (near the arch on the left) and the stellate ganglion or sympathetic chain at the apex. Phrenic invasion gives a raised hemidiaphragm, not these signs.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0001", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The transpyloric plane lies at the level of the", "options": ["L1 vertebra", "T12 vertebra", "L2 vertebra", "L3 vertebra", "L4 vertebra"], "answer": 0, "explanation": "The transpyloric plane of Addison passes through L1, midway between the jugular notch and the pubic symphysis. It crosses the pylorus, the neck of the pancreas, the hila of the kidneys, the origin of the SMA, and the fundus of the gallbladder.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0002", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The subcostal plane passes through the level of", "options": ["L3 vertebra", "L1 vertebra", "L2 vertebra", "L4 vertebra", "L5 vertebra"], "answer": 0, "explanation": "The subcostal plane joins the lowest points of the 10th costal cartilages at L3. The transtubercular plane, through the iliac tubercles, is at L5.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0003", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The umbilicus in a lean adult lies at the level of the", "options": ["L3/L4 intervertebral disc", "L1/L2 intervertebral disc", "L2 vertebral body", "L5 vertebral body", "T12/L1 intervertebral disc"], "answer": 0, "explanation": "The umbilicus lies at roughly the L3/L4 disc, the same level as the aortic bifurcation (L4) and the plane where the T10 dermatome crosses the midline.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0004", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The T10 dermatome supplies skin at the level of the", "options": ["Umbilicus", "Xiphoid process", "Nipple", "Inguinal ligament", "Pubic symphysis"], "answer": 0, "explanation": "T4 nipple, T6 xiphoid, T10 umbilicus, L1 inguinal ligament. The umbilical dermatome matters for referred midgut pain, which localises to T10.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0005", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The membranous (deep) layer of the superficial fascia of the anterior abdominal wall is called", "options": ["Scarpa's fascia", "Camper's fascia", "Colles' fascia", "Transversalis fascia", "Buck's fascia"], "answer": 0, "explanation": "Camper's is the fatty superficial layer, Scarpa's the membranous deep layer. Scarpa's fascia continues into the perineum as Colles' fascia and onto the penis as the dartos-related fascia, which is why extravasated urine tracks into the abdominal wall but not the thigh.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0006", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "Scarpa's fascia attaches inferiorly to the", "options": ["Fascia lata, just below the inguinal ligament", "Inguinal ligament, along its whole length", "Iliac crest and pubic tubercle", "Pubic symphysis and pubic crest", "Linea alba and pubic symphysis"], "answer": 0, "explanation": "Scarpa's fascia fuses with the fascia lata a fingerbreadth below the inguinal ligament. This attachment stops extravasated fluid from entering the thigh while allowing it into the scrotum and penis via Colles' fascia.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0007", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The fibres of the external oblique run", "options": ["Inferomedially", "Superomedially", "Horizontally", "Vertically", "Inferolaterally"], "answer": 0, "explanation": "External oblique runs like hands in your pockets (inferomedially); internal oblique runs at right angles (superomedially); transversus abdominis runs horizontally.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0008", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The inguinal ligament is formed by the", "options": ["Free lower border of the external oblique aponeurosis", "Lower border of the internal oblique aponeurosis", "Fused aponeuroses of internal oblique and transversus abdominis", "Transversalis fascia thickened along its lower edge", "Iliac fascia continuing onto the pubis"], "answer": 0, "explanation": "The inguinal ligament of Poupart is the rolled-under inferior margin of the external oblique aponeurosis, stretching from the ASIS to the pubic tubercle. The conjoint tendon is the fused internal oblique and transversus.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0009", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The conjoint tendon is formed by the aponeuroses of", "options": ["Internal oblique and transversus abdominis", "External oblique and internal oblique", "External oblique and transversus abdominis", "Transversus abdominis and transversalis fascia", "Rectus abdominis and internal oblique"], "answer": 0, "explanation": "The falx inguinalis (conjoint tendon) is the merged lower aponeuroses of internal oblique and transversus, inserting on the pubic crest and pecten pubis behind the superficial ring, reinforcing the medial posterior wall of the inguinal canal.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0010", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The tendinous intersections of the rectus abdominis are adherent to the", "options": ["Anterior wall of the rectus sheath", "Posterior wall of the rectus sheath", "Linea alba only", "Transversalis fascia", "Both walls of the rectus sheath"], "answer": 0, "explanation": "The intersections fuse with the anterior sheath only, which is why the muscle must be dissected off the anterior wall but slides free from the posterior wall. They give the six-pack its segmented look.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0011", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "Below the arcuate line the posterior surface of the rectus abdominis is in contact with", "options": ["Transversalis fascia", "Aponeurosis of transversus abdominis", "Posterior lamina of the internal oblique aponeurosis", "Parietal peritoneum directly", "Extraperitoneal fat directly"], "answer": 0, "explanation": "Below the arcuate line all three aponeuroses pass anterior to the rectus, leaving only transversalis fascia, extraperitoneal fat, and peritoneum behind it. Above the line the internal oblique splits and transversus goes behind.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0012", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The arcuate line lies approximately", "options": ["Midway between the umbilicus and the pubic symphysis", "At the level of the umbilicus", "At the level of the anterior superior iliac spine", "At the level of the pubic symphysis", "Midway between the xiphoid and the umbilicus"], "answer": 0, "explanation": "The arcuate line (semicircular line of Douglas) lies about a third of the way from the umbilicus to the pubis. Below it the inferior epigastric vessels enter the sheath.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0013", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The inferior epigastric artery is a branch of the", "options": ["External iliac artery", "Internal iliac artery", "Femoral artery", "Deep circumflex iliac artery", "Common iliac artery"], "answer": 0, "explanation": "The inferior epigastric arises from the external iliac just above the inguinal ligament, runs medial to the deep inguinal ring, pierces transversalis fascia, and enters the rectus sheath below the arcuate line to anastomose with the superior epigastric.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0014", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The superior epigastric artery is a terminal branch of the", "options": ["Internal thoracic artery", "Musculophrenic artery", "Thoracic aorta", "Subclavian artery", "Superior phrenic artery"], "answer": 0, "explanation": "The internal thoracic divides at the 6th costal cartilage into the musculophrenic and superior epigastric arteries. The superior and inferior epigastrics form the main collateral between the subclavian and external iliac systems in coarctation.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0015", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The neurovascular plane of the anterolateral abdominal wall lies between", "options": ["Internal oblique and transversus abdominis", "External oblique and internal oblique", "Transversus abdominis and transversalis fascia", "Skin and external oblique", "Transversalis fascia and peritoneum"], "answer": 0, "explanation": "Thoracoabdominal nerves and vessels run between internal oblique and transversus, the homologue of the intercostal plane between internal and innermost intercostals. Nerve blocks (TAP block) target this plane.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0016", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The anterolateral abdominal wall is innervated by the anterior rami of", "options": ["T7-T12 and L1", "T5-T10", "T10-L2", "T7-T11 only", "T12-L3"], "answer": 0, "explanation": "Thoracoabdominal nerves T7-T11, the subcostal nerve T12, and the iliohypogastric and ilioinguinal nerves from L1 supply the wall. The lower six thoracic nerves also carry the segmental motor supply.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0017", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The median umbilical fold contains the", "options": ["Urachus", "Obliterated umbilical artery", "Inferior epigastric vessels", "Round ligament of the liver", "Obliterated umbilical vein"], "answer": 0, "explanation": "Median fold: urachus (remnant of the allantois). Medial folds: obliterated umbilical arteries. Lateral folds: inferior epigastric vessels. The ligamentum teres is above the umbilicus in the falciform ligament.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0018", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The lateral umbilical fold contains the", "options": ["Inferior epigastric vessels", "Obliterated umbilical artery", "Urachus", "Round ligament of the liver", "Ilioinguinal nerve"], "answer": 0, "explanation": "The lateral umbilical fold is raised by the inferior epigastric vessels and forms the lateral boundary of the inguinal triangle. It is the landmark that separates direct from indirect hernias when viewed from inside.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0019", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The deep inguinal ring is an opening in the", "options": ["Transversalis fascia", "External oblique aponeurosis", "Internal oblique aponeurosis", "Conjoint tendon", "Transversus abdominis aponeurosis"], "answer": 0, "explanation": "The deep ring lies in transversalis fascia at the midpoint of the inguinal ligament, just lateral to the inferior epigastric vessels. The superficial ring is a defect in the external oblique aponeurosis above the pubic tubercle.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0020", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The deep inguinal ring lies at the", "options": ["Midpoint of the inguinal ligament", "Midinguinal point", "Pubic tubercle", "Anterior superior iliac spine", "Midpoint between the ASIS and the umbilicus"], "answer": 0, "explanation": "The midpoint of the inguinal ligament (ASIS to pubic tubercle) marks the deep ring. The midinguinal point (ASIS to pubic symphysis) is slightly medial and marks the femoral artery.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0021", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The anterior wall of the inguinal canal is formed mainly by the", "options": ["External oblique aponeurosis", "Internal oblique aponeurosis", "Conjoint tendon", "Transversalis fascia", "Inguinal ligament"], "answer": 0, "explanation": "Anterior wall: external oblique aponeurosis, with internal oblique fibres reinforcing the lateral third. Posterior wall: transversalis fascia, with conjoint tendon reinforcing the medial third. Floor: inguinal and lacunar ligaments. Roof: arching fibres of internal oblique and transversus.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0022", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The posterior wall of the inguinal canal is formed by the", "options": ["Transversalis fascia and, medially, the conjoint tendon", "External oblique aponeurosis and, laterally, internal oblique", "Inguinal ligament and lacunar ligament", "Arching fibres of internal oblique and transversus", "Peritoneum and extraperitoneal fat"], "answer": 0, "explanation": "Transversalis fascia forms the posterior wall along its whole length, strengthened medially by the conjoint tendon. Weakness here is what a direct hernia exploits.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0023", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The floor of the inguinal canal is formed by the", "options": ["Inguinal ligament and lacunar ligament", "Conjoint tendon", "External oblique aponeurosis", "Transversalis fascia", "Pectineal ligament only"], "answer": 0, "explanation": "The floor is the grooved upper surface of the inguinal ligament, reinforced medially by the lacunar ligament. The pectineal (Cooper's) ligament continues from the lacunar ligament along the pecten pubis.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0024", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "Which structure passes through the inguinal canal in the female?", "options": ["Round ligament of the uterus", "Ovarian ligament", "Suspensory ligament of the ovary", "Ilioinguinal nerve only", "Broad ligament"], "answer": 0, "explanation": "The round ligament traverses the canal to end in the labium majus. The ilioinguinal nerve passes through in both sexes but enters through the canal wall rather than the deep ring.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0025", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The ilioinguinal nerve enters the inguinal canal by", "options": ["Piercing the internal oblique, not through the deep ring", "Passing through the deep inguinal ring with the cord", "Passing through the superficial ring from outside", "Piercing the transversalis fascia at the deep ring", "Running along the floor beneath the inguinal ligament"], "answer": 0, "explanation": "The ilioinguinal nerve enters the canal by piercing the internal oblique and exits through the superficial ring. It supplies the upper medial thigh, anterior scrotum or labium majus, and the root of the penis or mons.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0026", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The external spermatic fascia is derived from the", "options": ["External oblique aponeurosis", "Internal oblique muscle", "Transversalis fascia", "Transversus abdominis aponeurosis", "Scarpa's fascia"], "answer": 0, "explanation": "The three coverings of the cord: external spermatic fascia from external oblique aponeurosis (at the superficial ring), cremasteric fascia from internal oblique (in the canal), internal spermatic fascia from transversalis fascia (at the deep ring).", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0027", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The internal spermatic fascia is derived from the", "options": ["Transversalis fascia", "External oblique aponeurosis", "Internal oblique muscle", "Transversus abdominis aponeurosis", "Peritoneum"], "answer": 0, "explanation": "Transversalis fascia is dragged out through the deep ring as the innermost covering of the cord. Transversus abdominis contributes no layer because the deep ring lies below its free lower edge.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0028", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The cremaster muscle is derived from the", "options": ["Internal oblique", "External oblique", "Transversus abdominis", "Rectus abdominis", "Dartos"], "answer": 0, "explanation": "Cremaster fibres are drawn from the lowest fibres of internal oblique as the testis passes through the canal. They are skeletal muscle supplied by the genital branch of the genitofemoral nerve.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0029", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The efferent limb of the cremasteric reflex is carried by the", "options": ["Genital branch of the genitofemoral nerve", "Ilioinguinal nerve", "Femoral branch of the genitofemoral nerve", "Iliohypogastric nerve", "Pudendal nerve"], "answer": 0, "explanation": "Stroking the upper medial thigh (ilioinguinal afferent, L1) causes the cremaster to lift the testis via the genital branch of genitofemoral (L1-L2). Loss of the reflex is a sign of testicular torsion.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0030", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The testicular artery arises from the", "options": ["Abdominal aorta at about L2", "Internal iliac artery", "External iliac artery", "Inferior epigastric artery", "Renal artery"], "answer": 0, "explanation": "The gonadal arteries leave the aorta just below the renal arteries, reflecting the gonads' embryonic origin high on the posterior abdominal wall before descent.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0031", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The left testicular vein drains into the", "options": ["Left renal vein", "Inferior vena cava directly", "Left common iliac vein", "Left internal iliac vein", "Left suprarenal vein"], "answer": 0, "explanation": "The right testicular vein enters the IVC obliquely; the left enters the left renal vein at a right angle. Higher pressure and this angle predispose to left-sided varicocele.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0032", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "Lymph from the testis drains to the", "options": ["Lumbar lymph nodes", "Superficial inguinal lymph nodes", "Deep inguinal lymph nodes", "External iliac lymph nodes", "Internal iliac lymph nodes"], "answer": 0, "explanation": "The testis drains to para-aortic nodes at the level of the renal vessels, following the testicular vessels. The scrotum, being skin, drains to superficial inguinal nodes.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0033", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "Lymph from the skin of the scrotum drains to the", "options": ["Superficial inguinal lymph nodes", "Lumbar (para-aortic) lymph nodes", "Deep inguinal lymph nodes", "External iliac lymph nodes", "Sacral lymph nodes"], "answer": 0, "explanation": "Scrotal skin drains to superficial inguinal nodes like the rest of the perineal skin. Testicular cancer therefore does not enlarge the groin nodes unless it has invaded the scrotal wall.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0034", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "An indirect inguinal hernia enters the canal", "options": ["Through the deep ring, lateral to the inferior epigastric vessels", "Through the posterior wall, medial to the inferior epigastric vessels", "Through the superficial ring, medial to the inferior epigastric vessels", "Through the femoral ring, lateral to the lacunar ligament", "Through the conjoint tendon, lateral to the rectus abdominis"], "answer": 0, "explanation": "Indirect hernias pass through the deep ring lateral to the inferior epigastrics and traverse the whole canal, usually within a patent processus vaginalis. Direct hernias bulge through the posterior wall medially in Hesselbach's triangle.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0035", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "Hesselbach's triangle is bounded by the", "options": ["Inferior epigastric vessels, lateral border of rectus abdominis, and inguinal ligament", "Inferior epigastric vessels, linea alba, and pubic crest", "Deep circumflex iliac vessels, rectus abdominis, and inguinal ligament", "Inferior epigastric vessels, conjoint tendon, and lacunar ligament", "Medial umbilical fold, rectus abdominis, and pectineal ligament"], "answer": 0, "explanation": "The inguinal triangle lies between the inferior epigastric vessels laterally, the rectus edge medially, and the inguinal ligament below. A direct hernia pushes through its posterior wall.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0036", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "A direct inguinal hernia is usually covered by", "options": ["External spermatic fascia only", "All three spermatic fascial layers", "Internal spermatic fascia only", "Cremasteric fascia only", "The processus vaginalis"], "answer": 0, "explanation": "A direct hernia bulges through the posterior wall medial to the deep ring, so it does not acquire the internal spermatic or cremasteric coverings. If it exits the superficial ring it picks up only external spermatic fascia. NOTE: your lecture slide implies the direct hernia is inside the processus vaginalis, which contradicts its own definition. A processus vaginalis sac is the hallmark of the indirect hernia. Confirm with Dr. Dunya; written here to Moore.", "tags": ["step1-hy", "contradiction"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0037", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The femoral hernia emerges", "options": ["Below the inguinal ligament, lateral to the pubic tubercle", "Above the inguinal ligament, medial to the pubic tubercle", "Above the inguinal ligament, lateral to the pubic tubercle", "Below the inguinal ligament, medial to the pubic tubercle", "Through the obturator foramen, below the pubic ramus"], "answer": 0, "explanation": "Femoral hernias pass through the femoral ring into the femoral canal, medial to the femoral vein, presenting below and lateral to the pubic tubercle. Inguinal hernias present above and medial to it. Femoral hernias are commoner in women and strangulate readily.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0038", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The femoral canal is bounded medially by the", "options": ["Lacunar ligament", "Femoral vein", "Pectineal ligament", "Inguinal ligament", "Iliopsoas"], "answer": 0, "explanation": "The femoral ring is bounded anteriorly by the inguinal ligament, posteriorly by the pectineal ligament, laterally by the femoral vein, and medially by the lacunar ligament, whose sharp edge is what strangulates a femoral hernia.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0039", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The parietal peritoneum receives its sensory innervation from", "options": ["Somatic nerves of the adjacent body wall", "Autonomic fibres of the sympathetic trunk", "The vagus nerve", "The pelvic splanchnic nerves", "Enteric plexuses"], "answer": 0, "explanation": "Parietal peritoneum is supplied by the same somatic nerves as the overlying wall, so its pain is sharp and well localised. Visceral peritoneum has only autonomic innervation and its pain is dull and midline.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0040", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "Which organ is intraperitoneal?", "options": ["Spleen", "Kidney", "Pancreas (except tail)", "Ascending colon", "Second part of the duodenum"], "answer": 0, "explanation": "The spleen is suspended by the gastrosplenic and splenorenal ligaments and is fully intraperitoneal. Kidneys, pancreas head and body, ascending colon and the second part of the duodenum are secondarily retroperitoneal or primarily retroperitoneal.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0041", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "Which structure is primarily retroperitoneal, having never had a mesentery?", "options": ["Kidney", "Ascending colon", "Pancreas", "Duodenum, second part", "Descending colon"], "answer": 0, "explanation": "Kidneys, ureters, adrenals, aorta and IVC are primarily retroperitoneal. The ascending and descending colon, most of the duodenum and most of the pancreas are secondarily retroperitoneal, having lost their mesentery by fusion during rotation.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0042", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "Which portion of the duodenum is intraperitoneal?", "options": ["The proximal first part", "The distal first part", "The second part", "The third part", "The fourth part"], "answer": 0, "explanation": "Only the proximal duodenal cap retains a mesentery (the hepatoduodenal ligament attaches to it); parts 2-4 are secondarily retroperitoneal. This is why a bleeding posterior duodenal ulcer reaches the retroperitoneal gastroduodenal artery.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0043", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The tail of the pancreas lies within the", "options": ["Splenorenal ligament", "Gastrosplenic ligament", "Lesser omentum", "Transverse mesocolon", "Hepatoduodenal ligament"], "answer": 0, "explanation": "The pancreatic tail is the only intraperitoneal part of the gland, lying in the splenorenal ligament with the splenic vessels, which is why it can be injured during splenectomy.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0044", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The greater omentum hangs from the", "options": ["Greater curvature of the stomach", "Lesser curvature of the stomach", "Transverse colon only", "Liver", "Spleen"], "answer": 0, "explanation": "The greater omentum is a four-layered apron descending from the greater curvature, then folding back to attach to the transverse colon. It walls off infection, hence its nickname the policeman of the abdomen.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0045", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The lesser omentum extends from the", "options": ["Lesser curvature of the stomach and first part of the duodenum to the liver", "Greater curvature of the stomach to the transverse colon", "Stomach to the spleen", "Liver to the anterior abdominal wall", "Duodenum to the right kidney"], "answer": 0, "explanation": "The lesser omentum has two parts: the hepatogastric ligament to the lesser curvature and the hepatoduodenal ligament to the duodenal cap, the latter carrying the portal triad in its free edge.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0046", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "recall", "stem": "The peritoneal cavity in the female communicates with the exterior through the", "options": ["Uterine tubes", "Urethra", "Vagina only", "Ureters", "Round ligament"], "answer": 0, "explanation": "The abdominal ostia of the uterine tubes open into the peritoneal cavity, making the female cavity potentially open to the outside via tube, uterus and vagina. The male cavity is closed.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0047", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "step", "stem": "A 25-year-old man presents with a swelling in the right groin that appeared while lifting a heavy box. On examination the lump extends into the scrotum and cannot be felt separately from the testis. Pressure over the midpoint of the inguinal ligament after reduction prevents it from reappearing when he coughs. Which of the following is the most likely diagnosis?", "options": ["Indirect inguinal hernia", "Direct inguinal hernia", "Femoral hernia", "Hydrocele of the cord", "Varicocele"], "answer": 0, "explanation": "A hernia that reaches the scrotum, is controlled by occlusion of the deep ring, and appears in a young adult is an indirect hernia passing through a patent processus vaginalis. Direct hernias rarely descend into the scrotum and are not controlled by pressure at the deep ring.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0048", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "step", "stem": "A 68-year-old man with chronic cough has a bulge in the right groin that appears on straining and lies above and medial to the pubic tubercle. On invagination of the scrotum the impulse is felt on the pulp of the finger rather than its tip. Where does this hernia emerge relative to the inferior epigastric vessels?", "options": ["Medial to them, through the posterior wall of the inguinal canal", "Lateral to them, through the deep inguinal ring", "Lateral to them, beneath the inguinal ligament", "Medial to them, through the femoral ring", "Directly through the superficial inguinal ring from within the rectus sheath"], "answer": 0, "explanation": "A direct hernia in an older man with raised intra-abdominal pressure protrudes through Hesselbach's triangle, medial to the inferior epigastric vessels, directly forward. The impulse strikes the finger pulp because the sac comes from behind, not down the canal.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0049", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "step", "stem": "A 52-year-old woman presents with a small tender lump below the right inguinal ligament, lateral to the pubic tubercle. She is vomiting and the lump is irreducible. Which structure forms the sharp medial boundary most likely responsible for strangulation of this hernia?", "options": ["Lacunar ligament", "Inguinal ligament", "Pectineal ligament", "Femoral vein", "Conjoint tendon"], "answer": 0, "explanation": "A lump below the inguinal ligament lateral to the tubercle is a femoral hernia. The femoral ring is bounded medially by the crescentic lacunar ligament, which cuts into the neck of the sac. The vein is lateral and the pectineal ligament is posterior.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0050", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "step", "stem": "During an open inguinal hernia repair a surgeon opens the anterior wall of the canal and identifies a nerve lying on the surface of the spermatic cord. She protects it. Which area would have lost sensation had she divided it?", "options": ["Anterior scrotum and upper medial thigh", "Lateral thigh", "Posterior scrotum and perineum", "Skin over the pubic symphysis and lower abdomen", "Skin over the lateral buttock"], "answer": 0, "explanation": "The nerve on the cord inside the canal is the ilioinguinal nerve, which supplies the upper medial thigh, the anterior scrotum or labium majus, and the root of the penis or mons.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0051", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "step", "stem": "A 14-year-old boy presents with sudden severe testicular pain. On stroking the upper inner thigh on that side, the testis does not retract. Which nerve normally carries the efferent limb of the reflex that is absent?", "options": ["Genital branch of the genitofemoral nerve", "Ilioinguinal nerve", "Femoral branch of the genitofemoral nerve", "Iliohypogastric nerve", "Pudendal nerve"], "answer": 0, "explanation": "Absent cremasteric reflex in a boy with acute scrotal pain suggests torsion. The afferent limb is ilioinguinal (L1); the efferent limb to cremaster is the genital branch of genitofemoral (L1-L2). Torsion disrupts the reflex by strangulating the cord contents.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0052", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "step", "stem": "A 30-year-old man is found to have a painless left-sided scrotal swelling described as a bag of worms, which decompresses when he lies flat. Which of the following best explains why this condition is far more common on the left?", "options": ["The left testicular vein joins the left renal vein at a right angle and can be compressed in the aortomesenteric angle", "The left testicular vein is shorter and drains directly into the IVC", "The left testis is normally suspended higher than the right", "The left testicular artery arises from the left renal artery", "The left external spermatic fascia is thinner"], "answer": 0, "explanation": "Varicocele is left-sided in the large majority of cases because the left testicular vein enters the left renal vein perpendicularly and that vein crosses beneath the SMA where it can be compressed. A new right-sided varicocele that does not empty on lying down raises concern for IVC obstruction or a renal mass.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0053", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "step", "stem": "A 40-year-old man with a right testicular tumour asks about spread. His groin lymph nodes are not enlarged. Which nodes should be examined first on CT?", "options": ["Para-aortic nodes", "Superficial inguinal nodes", "Deep inguinal nodes", "External iliac nodes", "Internal iliac nodes"], "answer": 0, "explanation": "The testis descends from the posterior abdominal wall and keeps its lymphatic drainage to the lumbar nodes along the testicular vessels. Groin nodes only become involved if the tumour invades the scrotal skin.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0054", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "step", "stem": "A young man is kicked in the perineum and ruptures his bulbar urethra. Over the next day urine spreads into the scrotum, around the penis, and up onto the anterior abdominal wall, but not into the thighs. Which fascial attachment explains why the thighs are spared?", "options": ["Fusion of Scarpa's fascia with the fascia lata below the inguinal ligament", "Attachment of Camper's fascia to the iliac crest", "Attachment of the inguinal ligament to the pubic tubercle", "Fusion of the conjoint tendon with the pubic crest", "Continuity of transversalis fascia with the femoral sheath"], "answer": 0, "explanation": "Urine tracks in the plane deep to the membranous layer (Colles' in the perineum, Scarpa's on the abdomen). Because Scarpa's fascia is anchored to the fascia lata just below the inguinal ligament, fluid cannot pass into the thigh.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0055", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "step", "stem": "A 60-year-old woman has a Pfannenstiel incision that transects the rectus abdominis below the arcuate line. Postoperatively she bleeds into the sheath. Which vessel was most likely injured?", "options": ["Inferior epigastric artery", "Superior epigastric artery", "Deep circumflex iliac artery", "Musculophrenic artery", "Superficial epigastric artery"], "answer": 0, "explanation": "The inferior epigastric artery enters the rectus sheath at the arcuate line and lies on the posterior surface of the muscle in its lower part. It is the vessel divided in low transverse incisions and in rectus sheath haematomas.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0056", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "step", "stem": "A surgeon making a gridiron incision for appendicectomy splits the muscles in the line of their fibres. In which direction does she split the internal oblique?", "options": ["Superomedially, at right angles to the external oblique", "Inferomedially, parallel to the external oblique", "Horizontally, parallel to transversus abdominis", "Vertically, parallel to rectus abdominis", "Inferolaterally, parallel to the inguinal ligament"], "answer": 0, "explanation": "The gridiron approach splits external oblique inferomedially, then internal oblique roughly at right angles running superomedially, then transversus horizontally. Each layer is opened in the line of its own fibres, which is what makes the incision strong.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0057", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "step", "stem": "A patient with acute appendicitis initially had dull pain around the umbilicus that later became sharp and localised to the right iliac fossa. Which of the following correctly explains the shift?", "options": ["Early pain is visceral, referred to T10 via sympathetic afferents; later pain is somatic from inflamed parietal peritoneum supplied by the adjacent body wall nerves", "Early pain is somatic from the parietal peritoneum; later pain is visceral from the inflamed appendix", "Both phases are visceral pain, and the shift reflects movement of the appendix", "Early pain is referred via the phrenic nerve; later pain is via the ilioinguinal nerve", "Both phases are somatic, mediated by the iliohypogastric nerve as inflammation spreads"], "answer": 0, "explanation": "The appendix is midgut, so its visceral afferents travel with sympathetics to T10 and pain is felt at the umbilicus. Once inflammation reaches the parietal peritoneum, somatic afferents in the T12-L1 nerves of the wall give sharp, localised pain at McBurney's point.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0058", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "step", "stem": "After a laparoscopic procedure, a surgeon looks at the inner surface of the anterior abdominal wall and sees three folds converging on the umbilicus from below. Between the middle fold and the most lateral fold is a depression through which a hernia has appeared. Which structure raised the fold that lies immediately lateral to this hernia?", "options": ["Inferior epigastric vessels", "Obliterated umbilical artery", "Urachus", "Round ligament of the liver", "Ilioinguinal nerve"], "answer": 0, "explanation": "From the inside, the medial inguinal fossa (between the medial and lateral umbilical folds) corresponds to Hesselbach's triangle, the site of direct hernias. The lateral fold, raised by the inferior epigastric vessels, is lateral to it; a hernia lateral to that fold would be indirect.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L03-0059", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L03", "system": "Abdomen", "type": "step", "stem": "A 45-year-old woman has a perforated peptic ulcer. Fluid tracks from the lesser sac into the greater sac. Through which opening did it pass?", "options": ["Omental foramen", "Gastrosplenic ligament", "Transverse mesocolon", "Splenorenal ligament", "Hepatogastric ligament"], "answer": 0, "explanation": "The only communication between the lesser and greater sacs is the omental foramen of Winslow, behind the free edge of the lesser omentum, with the IVC behind and the caudate lobe above.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.5 (Abdomen)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0001", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "True ribs are those that", "options": ["Attach directly to the sternum by their own costal cartilage", "Attach to the sternum via the cartilage of the rib above", "Have no anterior attachment", "Articulate with a single vertebral body", "Lack a costal groove"], "answer": 0, "explanation": "Ribs 1-7 are true (vertebrosternal), 8-10 are false (vertebrochondral, joining the 7th cartilage), and 11-12 are floating (vertebral only).", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0002", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "Which ribs are classified as floating?", "options": ["11 and 12", "10, 11 and 12"
