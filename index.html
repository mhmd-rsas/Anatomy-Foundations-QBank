, "8, 9 and 10", "12 only", "9 to 12"], "answer": 0, "explanation": "Ribs 11 and 12 have no anterior attachment and end in the muscles of the posterior abdominal wall. Their heads have a single facet and they lack a tubercle.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0003", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "A typical rib articulates posteriorly with", "options": ["Two vertebral bodies and one transverse process", "One vertebral body and one transverse process", "Two vertebral bodies only", "One vertebral body only", "Two transverse processes"], "answer": 0, "explanation": "The head has two demifacets articulating with its own vertebra and the one above; the tubercle articulates with the transverse process of its own vertebra. Ribs 1, 10, 11 and 12 articulate with a single body.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0004", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "The head of rib 6 articulates with the bodies of", "options": ["T5 and T6", "T6 and T7", "T6 only", "T5, T6 and T7", "T4 and T5"], "answer": 0, "explanation": "The head of a typical rib sits on the intervertebral disc and adjacent demifacets of its own numbered vertebra and the vertebra above. The tubercle articulates with the transverse process of its own vertebra only.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0005", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "Which ribs are atypical?", "options": ["1, 2, 10, 11, and 12", "1 and 12 only", "1, 2, 11, and 12", "1, 11, and 12", "10, 11, and 12 only"], "answer": 0, "explanation": "Rib 1 is short, flat, with a scalene tubercle and grooves for the subclavian vessels; rib 2 has a tuberosity for serratus anterior; ribs 10-12 have single-facet heads, and 11-12 lack tubercles and necks.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0006", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "The scalene tubercle on the first rib is the attachment of", "options": ["Scalenus anterior", "Scalenus medius", "Scalenus posterior", "Subclavius", "Serratus anterior"], "answer": 0, "explanation": "Scalenus anterior inserts on the scalene tubercle, between the groove for the subclavian vein (anterior) and the groove for the subclavian artery and lower trunk of the brachial plexus (posterior).", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0007", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "On the superior surface of the first rib, the structure passing anterior to the scalene tubercle is the", "options": ["Subclavian vein", "Subclavian artery", "Lower trunk of the brachial plexus", "Phrenic nerve", "Sympathetic trunk"], "answer": 0, "explanation": "The subclavian vein crosses the first rib in front of scalenus anterior; the subclavian artery and the T1 root of the brachial plexus cross behind it. This is the anatomy of thoracic outlet compression.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0008", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "The sternal angle marks the junction of the", "options": ["Manubrium and body of the sternum", "Body and xiphoid process", "Clavicle and manubrium", "First costal cartilage and manubrium", "Body of the sternum and the seventh costal cartilage"], "answer": 0, "explanation": "The manubriosternal joint forms the palpable sternal angle at the level of the second costal cartilage and the T4/T5 disc. Counting ribs starts here because the first rib is hidden under the clavicle.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0009", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "The second costal cartilage articulates with the sternum at the", "options": ["Sternal angle", "Jugular notch", "Xiphisternal joint", "Body of the sternum, midway", "Manubrium above the angle"], "answer": 0, "explanation": "The second cartilage articulates at the manubriosternal junction, straddling both pieces. The first cartilage joins the manubrium; the 3rd-6th join the body; the 7th joins at the xiphisternal junction.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0010", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "The xiphisternal joint lies at the level of the", "options": ["T9 vertebra", "T7 vertebra", "T4 vertebra", "T11 vertebra", "L1 vertebra"], "answer": 0, "explanation": "The xiphisternal junction is at T9 and marks the inferior border of the heart and the upper limit of the liver in the midline. The jugular notch is at T2/T3 and the sternal angle at T4/T5.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0011", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "The manubriosternal joint is a", "options": ["Secondary cartilaginous joint (symphysis)", "Primary cartilaginous joint (synchondrosis)", "Synovial plane joint", "Fibrous joint", "Synovial saddle joint"], "answer": 0, "explanation": "The manubriosternal joint is a symphysis, permitting the slight hinging that raises the sternal body in inspiration. The first sternocostal joint is a synchondrosis; the 2nd-7th are synovial.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0012", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "The first sternocostal joint is a", "options": ["Primary cartilaginous joint", "Secondary cartilaginous joint", "Synovial plane joint", "Fibrous joint", "Synovial hinge joint"], "answer": 0, "explanation": "The first costal cartilage is fused directly to the manubrium as a synchondrosis and does not move, which stabilises the shoulder girdle. The remaining sternocostal joints are synovial.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0013", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "Thoracic vertebrae are identified by the presence of", "options": ["Costal facets on the bodies and transverse processes", "Transverse foramina in the transverse processes", "Bifid spinous processes with a posterior tubercle", "Large kidney-shaped bodies with short pedicles", "Mammillary processes on the superior articular processes"], "answer": 0, "explanation": "Costal facets on the bodies (demifacets on T2-T8) and on the transverse processes (T1-T10) are diagnostic of thoracic vertebrae. Transverse foramina are cervical; mammillary processes are lumbar.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0014", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "The spinous processes of the mid-thoracic vertebrae are", "options": ["Long and sloping steeply downward", "Short, bifid, and nearly horizontal", "Broad, quadrangular, and horizontal", "Rudimentary and fused to the lamina", "Short and directed slightly upward"], "answer": 0, "explanation": "Mid-thoracic spines point downward so far that the tip of T6 lies at the level of the T7 body. This is why lumbar puncture is impractical in the thoracic region and why palpated spines do not correspond to the vertebral body at the same level.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0015", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "The vertebral foramen of a thoracic vertebra is", "options": ["Small and circular", "Large and triangular", "Large and oval", "Heart-shaped", "Kidney-shaped"], "answer": 0, "explanation": "The thoracic vertebral canal is small and round because the cord is narrowest here between the cervical and lumbar enlargements, and the vertebrae have a stable rib cage rather than needing a large canal.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0016", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "Which thoracic vertebrae have a single complete costal facet on the body rather than demifacets?", "options": ["T1, T10, T11, and T12", "T1 and T12 only", "T11 and T12 only", "T9 to T12", "T1 to T3"], "answer": 0, "explanation": "T1 has a full facet for rib 1 and a demifacet for rib 2. T10-T12 each have a single complete facet because ribs 10-12 articulate with one vertebra only. T2-T9 have superior and inferior demifacets.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0017", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "The costotransverse joint of rib 6 is between the tubercle of the rib and the", "options": ["Transverse process of T6", "Transverse process of T5", "Transverse process of T7", "Body of T6", "Superior articular process of T6"], "answer": 0, "explanation": "The tubercle articulates with the transverse process of the vertebra of the same number. Ribs 11 and 12 have no tubercle and no costotransverse joint.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0018", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "Which movement of the ribs increases the transverse diameter of the thorax?", "options": ["Bucket-handle movement of the lower ribs", "Pump-handle movement of the upper ribs", "Depression of the first rib", "Rotation of the sternum", "Elevation of the xiphoid"], "answer": 0, "explanation": "Upper ribs (pump-handle) elevate the sternum to increase the AP diameter; lower ribs (bucket-handle) rise laterally about an anteroposterior axis to widen the chest. The diaphragm increases the vertical diameter.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0019", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "The costal groove lies on the", "options": ["Inferior border of the internal surface of the rib", "Superior border of the internal surface of the rib", "External surface at the angle", "Neck of the rib", "Inferior border of the external surface"], "answer": 0, "explanation": "The costal groove runs along the inferior inner border of the shaft and shelters the intercostal vein, artery and nerve. The groove is why the neurovascular bundle is safest avoided by staying at the superior border of the rib below.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0020", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "The angle of the rib is the point where", "options": ["The rib curves most sharply and the erector spinae's lateral border crosses", "The head joins the neck", "The costal cartilage begins", "The rib articulates with the transverse process", "The tubercle lies"], "answer": 0, "explanation": "The angle lies a few centimetres lateral to the tubercle and marks the lateral limit of erector spinae. It is the commonest site of rib fracture from indirect trauma because the curvature changes most sharply there.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0021", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "Rib fractures are most common in ribs", "options": ["5 to 9", "1 and 2", "3 and 4", "10 to 12", "11 and 12"], "answer": 0, "explanation": "The middle ribs are the most exposed and least protected. Ribs 1-2 are guarded by the clavicle and shoulder; 11-12 are short and mobile. Fracture of rib 1 signals massive force and mandates a search for great vessel injury.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0022", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "recall", "stem": "A cervical rib arises from the", "options": ["Seventh cervical vertebra", "Sixth cervical vertebra", "First thoracic vertebra", "Fifth cervical vertebra", "Manubrium"], "answer": 0, "explanation": "A cervical rib is an enlarged costal element of C7. It can compress the subclavian artery or the lower trunk of the brachial plexus (C8-T1), giving hand ischaemia or T1 wasting and numbness of the medial forearm.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0023", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "step", "stem": "A 40-year-old woman develops numbness along the medial forearm and wasting of the small muscles of the hand. Radiograph shows an extra rib arising from C7. Which structure is being compressed, and by what?", "options": ["Lower trunk of the brachial plexus, stretched over the cervical rib", "Upper trunk of the brachial plexus, compressed by scalenus anterior", "Median nerve, at the carpal tunnel", "Ulnar nerve, in the cubital tunnel", "Subclavian vein, against the first rib"], "answer": 0, "explanation": "The lower trunk (C8-T1) and subclavian artery pass over the first rib behind scalenus anterior. A cervical rib elevates them, stretching the lower trunk, which supplies the intrinsic hand muscles and the medial forearm skin via T1.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0024", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "step", "stem": "A 30-year-old is involved in a motorcycle crash and has a fractured first rib. Which of the following injuries should be actively excluded because of the force required to fracture this rib?", "options": ["Injury to the subclavian vessels and brachial plexus", "Injury to the spleen", "Fracture of the xiphoid process", "Injury to the phrenic nerve", "Tension pneumothorax on the contralateral side"], "answer": 0, "explanation": "The first rib is short, thick and shielded by the clavicle, so its fracture implies severe force. The subclavian vessels and lower brachial plexus lie directly on it and are at risk, as are the aorta and lungs.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0025", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "step", "stem": "A physician counts ribs to locate a lesion. She palpates the sternal angle and moves laterally to identify a rib. Which rib has she found, and why does she not start at the top?", "options": ["Second rib; the first is hidden beneath the clavicle", "First rib; it lies at the level of the sternal angle", "Third rib; the second is covered by pectoralis major", "Second rib; the first has no anterior cartilage", "First rib; it is the widest and easiest to feel"], "answer": 0, "explanation": "The second costal cartilage attaches at the sternal angle and is the first rib reliably palpable. The first rib lies beneath the clavicle and cannot be felt anteriorly.", "tags": [], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0026", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "step", "stem": "A 25-year-old man has a stab wound entering the back 4 cm lateral to the spinous process of T7. Which bony feature was the blade most likely to have struck, given the orientation of the thoracic spines?", "options": ["The lamina of T8", "The lamina of T7", "The lamina of T6", "The body of T7", "The pedicle of T6"], "answer": 0, "explanation": "Mid-thoracic spines slope so steeply that the tip of a spine lies at the level of the body of the next vertebra. A wound at the level of the T7 spine tip is at the T8 vertebral level.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0027", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "step", "stem": "An 80-year-old woman with osteoporosis falls and has a compression fracture. Which region of the thoracic column is most vulnerable, and why?", "options": ["The mid-thoracic vertebral bodies, at the apex of the kyphotic curve where load is greatest anteriorly", "The upper thoracic bodies, because they are the smallest", "The transverse processes, because the ribs pull on them", "The spinous processes, because they are long", "The lower thoracic laminae, because they lack rib support"], "answer": 0, "explanation": "The thoracic kyphosis concentrates compressive load on the anterior parts of the mid-thoracic bodies. In osteoporosis these collapse into wedge fractures, increasing the kyphosis and producing the classic loss of height.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-ANA-L04-0028", "block": "Foundations", "discipline": "ANA", "unit": "F-ANA-L04", "system": "Thorax", "type": "step", "stem": "During surgery on the thoracic outlet a surgeon identifies a muscle inserting on a tubercle on the inner border of the first rib. Which vessel lies immediately posterior to this insertion?", "options": ["Subclavian artery", "Subclavian vein", "Internal thoracic artery", "Vertebral artery", "Brachiocephalic vein"], "answer": 0, "explanation": "The muscle is scalenus anterior inserting on the scalene tubercle. The subclavian artery and lower trunk groove the rib behind it; the subclavian vein grooves the rib in front.", "tags": ["step1-hy"], "source": "Moore, Clinically Oriented Anatomy 9e, Ch.4 (Thorax)", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0001", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "Primordial germ cells first appear in the", "options": ["Wall of the yolk sac near the allantois", "Genital ridge", "Epiblast of the bilaminar disc", "Primitive streak", "Neural crest"], "answer": 0, "explanation": "Primordial germ cells are visible in the yolk sac wall in the 3rd-4th week and migrate by amoeboid movement along the dorsal mesentery of the hindgut to the gonadal ridges by week 5-6. Ectopic rests explain germ cell tumours in the midline.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0002", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "A primary oocyte arrested in prophase I has a chromosome and DNA content of", "options": ["46 chromosomes, 4N DNA", "46 chromosomes, 2N DNA", "23 chromosomes, 2N DNA", "23 chromosomes, 1N DNA", "92 chromosomes, 4N DNA"], "answer": 0, "explanation": "After DNA replication in the S phase before meiosis I, the primary oocyte has 46 chromosomes each with two chromatids, hence 4N DNA. It stays arrested here (diplotene) from fetal life until ovulation. NOTE: your lecture slide labels the primary oocyte 46,2N, which cannot be right after replication has occurred; the slide's own next step (secondary oocyte 23,2N) only works arithmetically from 46,4N. Written to Sadler. Raise with Dr. Petrosyan.", "tags": ["step1-hy", "contradiction"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0003", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "The primary oocyte remains arrested in", "options": ["Diplotene of prophase I", "Metaphase of meiosis I", "Metaphase of meiosis II", "Prophase of meiosis II", "Anaphase of meiosis I"], "answer": 0, "explanation": "Primary oocytes arrest in diplotene of prophase I under the influence of oocyte maturation inhibitor from follicular cells. They complete meiosis I only at the LH surge before ovulation.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0004", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "The secondary oocyte is arrested in", "options": ["Metaphase II", "Metaphase I", "Prophase I", "Anaphase II", "Telophase I"], "answer": 0, "explanation": "After completing meiosis I at ovulation, the secondary oocyte immediately enters meiosis II and arrests in metaphase II. It finishes meiosis II only if fertilised; otherwise it degenerates within about 24 hours.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0005", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "Meiosis I in the oocyte is completed", "options": ["Just before ovulation, in response to the LH surge", "At birth", "At puberty, for all oocytes at once", "At fertilisation", "During fetal life"], "answer": 0, "explanation": "The LH surge triggers completion of meiosis I, producing the secondary oocyte and first polar body. Meiosis II is completed only on sperm entry.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0006", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "The chromosomal error most commonly responsible for Down syndrome is", "options": ["Non-disjunction in maternal meiosis I", "Non-disjunction in paternal meiosis I", "Non-disjunction in maternal meiosis II", "Robertsonian translocation", "Mosaicism from a mitotic error"], "answer": 0, "explanation": "About 95% of trisomy 21 is non-disjunction, the great majority maternal, and most of that in meiosis I. The long arrest in prophase I, with cohesin loss over decades, underlies the rise with maternal age.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0007", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "Which of the following is the correct sequence of spermatogenesis?", "options": ["Spermatogonium, primary spermatocyte, secondary spermatocyte, spermatid, spermatozoon", "Spermatogonium, secondary spermatocyte, primary spermatocyte, spermatid, spermatozoon", "Spermatid, spermatogonium, primary spermatocyte, secondary spermatocyte, spermatozoon", "Primary spermatocyte, spermatogonium, spermatid, secondary spermatocyte, spermatozoon", "Spermatogonium, spermatid, primary spermatocyte, secondary spermatocyte, spermatozoon"], "answer": 0, "explanation": "Spermatogonia (2N) divide mitotically, become primary spermatocytes (4N after replication), complete meiosis I to give secondary spermatocytes (2N), complete meiosis II to give spermatids (1N), which undergo spermiogenesis into spermatozoa.", "tags": [], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0008", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "The transformation of a spermatid into a spermatozoon without cell division is called", "options": ["Spermiogenesis", "Spermatogenesis", "Spermiation", "Capacitation", "Acrosome reaction"], "answer": 0, "explanation": "Spermiogenesis is the morphological remodelling: acrosome formation, nuclear condensation, tail formation, and shedding of cytoplasm. Spermiation is release from the Sertoli cell. Capacitation happens in the female tract.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0009", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "Spermatogenesis from spermatogonium to mature sperm takes approximately", "options": ["64-74 days", "14 days", "28 days", "120 days", "7 days"], "answer": 0, "explanation": "The full cycle takes roughly 64 days in the testis plus 10-14 days of epididymal transit. This is why a drug or fever affecting spermatogenesis lowers sperm counts two months later.", "tags": ["verify"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0010", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "Capacitation of sperm occurs in the", "options": ["Female reproductive tract", "Epididymis", "Seminiferous tubules", "Seminal vesicles", "Ductus deferens"], "answer": 0, "explanation": "Capacitation is a 7-hour process in the uterus and tube that strips glycoproteins and seminal plasma proteins from the acrosomal membrane, making the sperm able to bind the zona pellucida and undergo the acrosome reaction.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0011", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "The zona pellucida protein that binds capacitated sperm and triggers the acrosome reaction is", "options": ["ZP3", "ZP1", "ZP2", "Fertilin", "Izumo1"], "answer": 0, "explanation": "ZP3 is the species-specific sperm receptor that induces the acrosome reaction. Zona reaction after fertilisation modifies ZP2 and ZP3 to block polyspermy.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0012", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "The fast block to polyspermy involves", "options": ["Depolarisation of the oocyte membrane on sperm fusion", "Release of cortical granules", "Modification of the zona pellucida glycoproteins", "Completion of meiosis II", "Formation of the female pronucleus"], "answer": 0, "explanation": "The fast block is electrical, seen mainly in non-mammals; the slow, definitive block in humans is the cortical (zona) reaction, in which cortical granule enzymes alter ZP2 and ZP3 so further sperm cannot bind.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0013", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "Fertilisation normally occurs in the", "options": ["Ampulla of the uterine tube", "Isthmus of the uterine tube", "Infundibulum of the uterine tube", "Uterine cavity", "Fimbriae"], "answer": 0, "explanation": "Fertilisation usually happens in the ampulla, the widest part of the tube. The zygote then takes about 3-4 days to reach the uterus, entering as a morula.", "tags": [], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0014", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "The zygote is first considered a blastocyst when", "options": ["A fluid-filled cavity appears inside the morula", "The first cleavage division occurs", "It reaches the 16-cell stage", "The zona pellucida disappears", "Implantation begins"], "answer": 0, "explanation": "Fluid enters the compacted morula on about day 4-5 to form the blastocoele; the cells segregate into an inner cell mass (embryoblast) and outer trophoblast. Hatching from the zona follows so implantation can begin around day 6.", "tags": [], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0015", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "Implantation normally begins on approximately day", "options": ["6", "3", "9", "14", "21"], "answer": 0, "explanation": "The blastocyst attaches to the endometrium at about day 6 in the secretory phase, usually on the posterior or anterior wall of the uterine body. By day 9-10 it is fully embedded and the defect is closed by a fibrin plug.", "tags": [], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0016", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "The trophoblast layer that invades the endometrium and produces hCG is the", "options": ["Syncytiotrophoblast", "Cytotrophoblast", "Epiblast", "Hypoblast", "Extraembryonic mesoderm"], "answer": 0, "explanation": "The multinucleated syncytiotrophoblast erodes maternal tissue and secretes hCG, which maintains the corpus luteum. The cytotrophoblast is the mitotic layer that feeds cells into the syncytium.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0017", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "The bilaminar disc consists of the", "options": ["Epiblast and hypoblast", "Ectoderm and endoderm", "Epiblast and cytotrophoblast", "Hypoblast and extraembryonic mesoderm", "Epiblast and amnion"], "answer": 0, "explanation": "During week 2 the embryoblast flattens into a two-layered disc: columnar epiblast (facing the amniotic cavity) and cuboidal hypoblast (facing the primary yolk sac). Two layers, two cavities, second week.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0018", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "The amniotic cavity forms within the", "options": ["Epiblast", "Hypoblast", "Cytotrophoblast", "Syncytiotrophoblast", "Extraembryonic mesoderm"], "answer": 0, "explanation": "A cleft appears within the epiblast on about day 8, becoming the amniotic cavity, lined by amnioblasts derived from the epiblast. The primary yolk sac forms from hypoblast cells lining the blastocoele.", "tags": [], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0019", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "The prechordal plate is a thickening of the", "options": ["Hypoblast at the future cranial end", "Epiblast at the future caudal end", "Cytotrophoblast at the embryonic pole", "Extraembryonic mesoderm", "Primitive streak"], "answer": 0, "explanation": "The prechordal plate is a localised thickening of hypoblast cells that marks the future cranial end and the site of the mouth. It appears before the primitive streak and helps establish the cranio-caudal axis.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0020", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "A hydatidiform mole results from", "options": ["Trophoblast proliferation with absent or abnormal embryonic tissue", "Failure of the hypoblast to form the primary yolk sac", "Implantation of a normal blastocyst in the uterine tube", "Persistence of the primitive streak beyond week 4", "Excess amniotic fluid from a fetal swallowing defect"], "answer": 0, "explanation": "Complete moles are diploid with only paternal chromosomes (an empty egg fertilised by one sperm that duplicates, or two sperm) and have no fetal tissue. Partial moles are triploid with some fetal parts. Both produce very high hCG and can progress to choriocarcinoma.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0021", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "Gastrulation begins with the formation of the", "options": ["Primitive streak", "Notochordal process", "Neural plate", "First somite pair", "Prechordal plate"], "answer": 0, "explanation": "The primitive streak appears at the caudal end of the epiblast at the start of week 3. Epiblast cells migrate through it to form endoderm and mesoderm, converting the disc from bilaminar to trilaminar.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0022", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "All three germ layers are derived from the", "options": ["Epiblast", "Hypoblast", "Epiblast and hypoblast equally", "Trophoblast", "Extraembryonic mesoderm"], "answer": 0, "explanation": "Cells invaginating through the primitive streak displace the hypoblast to form definitive endoderm, spread between the layers to form mesoderm, and the remaining epiblast becomes ectoderm. The hypoblast contributes only to extraembryonic structures.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0023", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "The notochord is formed from cells migrating through the", "options": ["Primitive node", "Caudal end of the primitive streak", "Cloacal membrane", "Prechordal plate", "Buccopharyngeal membrane"], "answer": 0, "explanation": "Cells passing through the primitive node (Hensen's node) migrate cranially in the midline as the notochordal process, which becomes the definitive notochord. It induces the neural plate and persists as the nucleus pulposus.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0024", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "The notochord persists in the adult as the", "options": ["Nucleus pulposus", "Anulus fibrosus", "Ligamentum nuchae", "Vertebral body", "Dens of the axis"], "answer": 0, "explanation": "The notochord regresses within the vertebral bodies but expands between them as the nucleus pulposus. Remnants can give rise to a chordoma, typically at the clivus or sacrum.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0025", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "Two midline regions of the trilaminar disc lack mesoderm. They are the", "options": ["Buccopharyngeal membrane and cloacal membrane", "Primitive node and primitive streak", "Prechordal plate and notochord", "Neural plate and neural crest", "Cardiogenic area and septum transversum"], "answer": 0, "explanation": "At the buccopharyngeal (oropharyngeal) and cloacal membranes ectoderm and endoderm remain fused with no mesoderm between them. They later break down to form the mouth and the anal/urogenital openings.", "tags": [], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0026", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "Left-right asymmetry is established by", "options": ["Cilia at the primitive node driving a leftward fluid flow", "Rotation of the heart tube driven by differential growth", "Asymmetric growth of the yolk sac toward the left side", "The position of the allantois relative to the body stalk", "Unequal cleavage of the zygote at the two-cell stage"], "answer": 0, "explanation": "Motile cilia on the node drive a leftward flow, concentrating signalling factors on the left side and triggering the Nodal-Lefty-PITX2 cascade. Defective ciliary motility (Kartagener) randomises sidedness.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0027", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "The transcription factor that specifies left-sidedness is", "options": ["PITX2", "Sonic hedgehog", "Brachyury", "Snail", "HOX"], "answer": 0, "explanation": "PITX2 is expressed on the left in response to Nodal and Lefty2 and directs left-sided organogenesis. Lefty1 in the midline stops the signal crossing over; Snail is restricted to the right.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0028", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "Sacrococcygeal teratoma arises from", "options": ["Persistent remnants of the primitive streak", "Ectopic neural crest cells", "Persistent cloacal membrane", "The notochord", "A duplicated allantois"], "answer": 0, "explanation": "Primitive streak remnants retain pluripotency and can form tumours containing all three germ layers. Sacrococcygeal teratomas are the commonest tumour of newborns and are more frequent in girls.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0029", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "The period of greatest sensitivity to teratogens is", "options": ["Weeks 3-8 (embryonic period)", "Weeks 1-2 (pre-embryonic period)", "Weeks 9-12", "The second trimester", "The third trimester"], "answer": 0, "explanation": "Organogenesis in weeks 3-8 is when each organ system has its window of maximum susceptibility. Weeks 1-2 follow the all-or-none rule, and after week 8 teratogens mainly cause functional defects and growth restriction.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0030", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "recall", "stem": "Exposure to a teratogen during the first two weeks after fertilisation most commonly produces", "options": ["Death of the conceptus or no effect", "Open neural tube defects", "Limb reduction defects", "Ventricular septal defects", "Cleft lip and palate"], "answer": 0, "explanation": "The all-or-none principle: cells of the early conceptus are not yet committed, so damage either kills it or is fully compensated. Malformations require exposure during organogenesis.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0031", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "step", "stem": "A 38-year-old woman delivers a child with trisomy 21. Genetic testing shows the extra chromosome 21 is maternal. Which of the following best explains why advanced maternal age increases this risk?", "options": ["Oocytes remain arrested in prophase I for decades, during which chromatid cohesion degrades", "Older women produce more oocytes per cycle", "Meiosis II is completed before ovulation in older women", "Spermatogonia accumulate mutations with age", "The zona pellucida thickens with age and admits multiple sperm"], "answer": 0, "explanation": "All primary oocytes arrest in diplotene before birth. The cohesin holding homologues together weakens with time, so non-disjunction at meiosis I becomes more likely with each year of arrest.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0032", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "step", "stem": "A woman presents with vaginal bleeding at 10 weeks. Ultrasound shows a snowstorm pattern with no fetus, and her hCG is far above the expected range. Karyotype of the tissue is 46,XX with both sets of chromosomes paternal. Which of the following is the most likely mechanism?", "options": ["Fertilisation of an oocyte lacking a nucleus by a sperm that duplicated its genome", "Fertilisation of a normal oocyte by two sperm", "Failure of the first polar body to be extruded", "Fertilisation of a normal oocyte by a diploid sperm", "Mitotic non-disjunction in the trophoblast"], "answer": 0, "explanation": "A complete mole is diploid and entirely paternal. The commonest route is an empty egg fertilised by a single 23,X sperm that duplicates (46,XX). Dispermy gives 46,XY or 46,XX moles. A partial mole is triploid with one maternal set.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0033", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "step", "stem": "A couple has been unable to conceive. Semen analysis shows normal count and motility, but the sperm fail to bind to the zona pellucida in a laboratory assay. Which step in fertilisation is most likely defective?", "options": ["Capacitation, so that ZP3 cannot be recognised", "Completion of meiosis II by the oocyte", "Formation of the acrosome during spermiogenesis", "Release of cortical granules", "Migration of sperm through the cervical mucus"], "answer": 0, "explanation": "Binding to ZP3 requires capacitated sperm with exposed receptor proteins. Uncapacitated sperm swim normally but cannot recognise the zona, so the acrosome reaction never occurs.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0034", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "step", "stem": "A 5-week embryo is examined and found to have a notochord that failed to form. Which of the following would be the most immediate consequence?", "options": ["Failure of the neural plate to be induced", "Failure of the primitive streak to form", "Absence of the amniotic cavity", "Failure of implantation", "Loss of the buccopharyngeal membrane"], "answer": 0, "explanation": "The notochord is the primary inductor of the overlying ectoderm, which thickens into the neural plate under its influence. No notochord means no neural plate, and without it the nervous system does not form.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0035", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "step", "stem": "A newborn girl has a large tumour at the base of the spine containing hair, teeth, and glandular tissue. From which embryonic structure did this tumour most likely arise?", "options": ["Primitive streak", "Neural crest", "Notochord", "Cloacal membrane", "Hindgut endoderm"], "answer": 0, "explanation": "A sacrococcygeal teratoma containing tissues from all three germ layers arises from persistent pluripotent cells of the primitive streak, which normally regresses by the end of week 4.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0036", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "step", "stem": "A 12-year-old boy with recurrent sinusitis and bronchiectasis is found on chest X-ray to have his heart on the right. Which of the following embryonic processes was most likely defective?", "options": ["Ciliary-driven leftward flow at the primitive node", "Migration of neural crest cells", "Rotation of the midgut loop", "Septation of the truncus arteriosus", "Formation of the septum transversum"], "answer": 0, "explanation": "Situs inversus with sinopulmonary disease is Kartagener's syndrome, a primary ciliary dyskinesia. Immotile nodal cilia cannot generate the leftward flow that concentrates Nodal on the left, so sidedness is randomised.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0037", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "step", "stem": "A pregnant woman takes a drug at day 10 after fertilisation, before she knows she is pregnant. The pregnancy proceeds normally to term with a healthy baby. Which of the following best explains the outcome?", "options": ["Cells of the early conceptus are uncommitted and can compensate for the loss of some cells", "The placenta was already fully formed and filtered the drug", "The organ systems had already completed development", "The drug cannot cross the zona pellucida", "The embryo had not yet implanted and was not exposed"], "answer": 0, "explanation": "The all-or-none period covers the first two weeks. Damage to uncommitted cells is either lethal or compensated by the remaining cells. This is why exposures before the missed period seldom cause structural malformations.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0038", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "step", "stem": "A 26-year-old woman presents with lower abdominal pain and a positive pregnancy test. Ultrasound shows an empty uterus and a mass in the right adnexa. Which of the following is the most likely site of implantation?", "options": ["Ampulla of the uterine tube", "Isthmus of the uterine tube", "Ovary", "Peritoneal cavity", "Cervix"], "answer": 0, "explanation": "Over 95% of ectopic pregnancies are tubal, and the ampulla, where fertilisation occurs, is the commonest site. Tubal damage from infection delays transit of the blastocyst so it implants where it is when it hatches.", "tags": ["step1-hy"], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-EMB-L05-0039", "block": "Foundations", "discipline": "EMB", "unit": "F-EMB-L05", "system": "General", "type": "step", "stem": "During in-vitro fertilisation an embryologist injects a sperm directly into an oocyte. Which of the following normal barriers to polyspermy is bypassed by this technique?", "options": ["Binding to ZP3 and the acrosome reaction", "The cortical reaction and zona hardening", "Completion of meiosis II by the oocyte", "Formation of the male pronucleus", "Fusion of the male and female pronuclei"], "answer": 0, "explanation": "Intracytoplasmic sperm injection bypasses capacitation, zona binding and the acrosome reaction entirely. The oocyte's cortical reaction still occurs on activation, and meiosis II is still completed.", "tags": [], "source": "Sadler, Langman's Medical Embryology 15e, Ch.2-5", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0001", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "recall", "stem": "The plasma membrane is impermeable to", "options": ["Glucose", "Oxygen", "Carbon dioxide", "Ethanol", "Cortisol"], "answer": 0, "explanation": "Small non-polar molecules and gases cross the lipid bilayer freely. Polar, charged or large molecules (glucose, ions, amino acids) need channels or carriers.", "tags": [], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0002", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "recall", "stem": "Facilitated diffusion differs from simple diffusion in that it", "options": ["Requires a carrier protein and is saturable", "Requires ATP", "Moves substances against their gradient", "Occurs only in the nucleus", "Is not affected by temperature"], "answer": 0, "explanation": "Facilitated diffusion is passive and down-gradient but needs a carrier, so it shows saturation kinetics and specificity. Glucose entry via GLUT transporters is the classic example.", "tags": ["step1-hy"], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0003", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "recall", "stem": "Primary active transport is exemplified by", "options": ["The Na+/K+-ATPase", "The sodium-glucose cotransporter", "GLUT4", "Aquaporins", "Voltage-gated sodium channels"], "answer": 0, "explanation": "Primary active transport uses ATP directly. Secondary active transport (SGLT, Na+/Ca2+ exchanger) uses the sodium gradient created by the pump.", "tags": ["step1-hy"], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0004", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "recall", "stem": "For each cycle, the Na+/K+-ATPase moves", "options": ["3 Na+ out and 2 K+ in", "2 Na+ out and 3 K+ in", "3 Na+ in and 2 K+ out", "1 Na+ out and 1 K+ in", "2 Na+ out and 2 K+ in"], "answer": 0, "explanation": "The pump is electrogenic, exporting three sodium ions for every two potassium ions imported, contributing a few millivolts to the resting potential and maintaining cell volume.", "tags": ["step1-hy"], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0005", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "recall", "stem": "Osmosis is the movement of", "options": ["Water across a semipermeable membrane toward higher solute concentration", "Solute across a membrane toward lower concentration", "Ions through voltage-gated channels", "Water through the lipid bilayer only, never through channels", "Proteins across the nuclear envelope"], "answer": 0, "explanation": "Water moves toward the compartment with higher osmolarity. Aquaporins greatly speed this in many cells, though some water crosses the bilayer directly.", "tags": [], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0006", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "recall", "stem": "A red cell placed in a hypotonic solution will", "options": ["Swell and may lyse", "Shrink and crenate", "Remain unchanged", "Lose potassium and shrink", "Gain sodium and shrink"], "answer": 0, "explanation": "Water enters down its osmotic gradient. In hypertonic solution the cell shrinks. Tonicity refers to non-penetrating solutes; urea equilibrates and does not affect volume at steady state.", "tags": ["step1-hy"], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0007", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "recall", "stem": "Receptor-mediated endocytosis of LDL uses which coat protein?", "options": ["Clathrin", "Caveolin", "Dynamin only", "Actin", "Tubulin"], "answer": 0, "explanation": "LDL binds its receptor in clathrin-coated pits, which invaginate and pinch off with dynamin. Defects in the LDL receptor cause familial hypercholesterolaemia.", "tags": ["step1-hy"], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0008", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "recall", "stem": "The organelle responsible for degrading material taken in by phagocytosis is the", "options": ["Lysosome", "Peroxisome", "Proteasome", "Golgi apparatus", "Smooth endoplasmic reticulum"], "answer": 0, "explanation": "Lysosomes contain acid hydrolases active at pH about 5. Peroxisomes handle very-long-chain fatty acids and peroxide. Proteasomes degrade ubiquitinated cytosolic proteins.", "tags": ["step1-hy"], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0009", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "recall", "stem": "Proteins destined for secretion are synthesised on", "options": ["Rough endoplasmic reticulum", "Free ribosomes in the cytosol", "The Golgi apparatus", "Smooth endoplasmic reticulum", "Mitochondrial ribosomes"], "answer": 0, "explanation": "Ribosomes bound to the rough ER translate proteins with a signal sequence into the ER lumen for secretion, membrane insertion or lysosomal targeting. Cytosolic and nuclear proteins are made on free ribosomes.", "tags": [], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0010", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "recall", "stem": "The tight junction is composed mainly of", "options": ["Claudins and occludins", "Cadherins and catenins", "Integrins and laminins", "Connexins and pannexins", "Desmogleins and desmocollins"], "answer": 0, "explanation": "Tight junctions (zonula occludens) use claudin and occludin strands to seal the paracellular route and separate apical from basolateral membrane domains.", "tags": ["step1-hy"], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0011", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "recall", "stem": "Adherens junctions link cells through cadherins anchored to", "options": ["Actin filaments", "Intermediate filaments", "Microtubules", "Laminin", "Collagen IV"], "answer": 0, "explanation": "Zonula adherens uses E-cadherin linked via catenins to the actin belt. Desmosomes use cadherins (desmogleins) linked to intermediate filaments. NOTE: a summary table in your histology handout lists a different cytoskeletal partner for the zonula adherens; the body text of the same handout and Junqueira give actin. Written to actin.", "tags": ["step1-hy", "contradiction"], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0012", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "recall", "stem": "Desmosomes anchor adjacent cells to each other through", "options": ["Cadherins linked to intermediate filaments", "Cadherins linked to actin", "Integrins linked to intermediate filaments", "Connexins forming channels", "Claudins sealing the intercellular space"], "answer": 0, "explanation": "Desmosomes are spot welds using desmoglein and desmocollin linked to keratin filaments via plakoglobin and desmoplakin. Autoantibodies to desmoglein cause pemphigus vulgaris.", "tags": ["step1-hy"], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0013", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "recall", "stem": "Hemidesmosomes attach cells to the basal lamina through", "options": ["Integrins binding laminin", "Cadherins binding collagen", "Connexins binding fibronectin", "Claudins binding laminin", "Selectins binding collagen IV"], "answer": 0, "explanation": "Hemidesmosomes use integrin α6β4 to bind laminin in the basal lamina and connect to keratin filaments inside. Autoantibodies against hemidesmosome proteins cause bullous pemphigoid. NOTE: your histology handout's summary table gives a different ligand; the body text and Junqueira give laminin. Written to laminin.", "tags": ["step1-hy", "contradiction"], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0014", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "recall", "stem": "Gap junctions are formed by", "options": ["Hexameric connexons", "Claudin strands", "Cadherin dimers", "Integrin heterodimers", "Desmoplakin plaques"], "answer": 0, "explanation": "A connexon on each cell aligns to form a channel about 1.5 nm wide passing ions and small molecules. Gap junctions electrically couple cardiac and smooth muscle cells.", "tags": ["step1-hy"], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0015", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "recall", "stem": "Which junction is essential for the coordinated contraction of cardiac muscle?", "options": ["Gap junction", "Tight junction", "Desmosome", "Hemidesmosome", "Adherens junction"], "answer": 0, "explanation": "Gap junctions in the intercalated discs let action potentials pass directly from cell to cell. Desmosomes and adherens junctions in the same discs provide mechanical strength.", "tags": [], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0016", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "recall", "stem": "Homeostasis is best defined as", "options": ["Maintenance of a relatively stable internal environment by regulated processes", "Absence of change in the body", "Balance between anabolism and catabolism", "Equal concentrations of solutes inside and outside cells", "Constant body temperature only"], "answer": 0, "explanation": "Homeostasis is dynamic, using negative feedback to hold variables within a range. Positive feedback (clotting, parturition) amplifies rather than stabilises.", "tags": [], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0017", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "recall", "stem": "Most physiological control systems operate by", "options": ["Negative feedback", "Positive feedback", "Feedforward control only", "Open-loop control", "Random fluctuation"], "answer": 0, "explanation": "Negative feedback: a sensor detects deviation, a controller compares it with a set point, and an effector opposes the change. Baroreflex and thermoregulation are examples.", "tags": [], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0018", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "step", "stem": "A patient has a genetic defect in the LDL receptor. Which of the following processes is most directly impaired?", "options": ["Receptor-mediated endocytosis via clathrin-coated pits", "Bulk-phase pinocytosis", "Phagocytosis by macrophages", "Facilitated diffusion of cholesterol", "Exocytosis of lipoproteins"], "answer": 0, "explanation": "LDL uptake is receptor-mediated endocytosis. Without functional receptors LDL stays in plasma, producing familial hypercholesterolaemia and early atherosclerosis.", "tags": ["step1-hy"], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0019", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "step", "stem": "A 40-year-old woman develops flaccid blisters on the skin and erosions in the mouth. Immunofluorescence shows IgG deposited between keratinocytes in a net-like pattern. Which structure is the target of her antibodies?", "options": ["Desmosomal cadherins", "Hemidesmosomal integrins", "Tight junction claudins", "Gap junction connexins", "Basal lamina laminin"], "answer": 0, "explanation": "Pemphigus vulgaris targets desmoglein 3 (and 1), separating keratinocytes from each other within the epidermis. Bullous pemphigoid targets hemidesmosomal proteins, separating epidermis from dermis and giving tense blisters.", "tags": ["step1-hy"], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0020", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "step", "stem": "A drug inhibits the Na+/K+-ATPase in cardiac muscle. Which of the following is the most immediate ionic consequence inside the myocyte?", "options": ["Rise in intracellular sodium", "Fall in intracellular sodium", "Rise in intracellular potassium", "Fall in intracellular calcium", "Rise in intracellular chloride"], "answer": 0, "explanation": "Blocking the pump leaves sodium inside the cell. The raised intracellular sodium reduces the gradient for the Na+/Ca2+ exchanger, so calcium accumulates and contractility rises. This is how digoxin works.", "tags": ["step1-hy"], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L01-0021", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L01", "system": "General", "type": "step", "stem": "A patient with severe diarrhoea is given an oral rehydration solution containing both glucose and sodium. Which transporter explains why the combination is more effective than water and salt alone?", "options": ["SGLT1, which couples sodium and glucose uptake in the intestinal epithelium", "GLUT2, which moves glucose across the basolateral membrane", "The Na+/K+-ATPase on the apical membrane", "Aquaporin channels in the tight junctions", "The Na+/H+ exchanger in the colon"], "answer": 0, "explanation": "Sodium-glucose cotransport continues working during secretory diarrhoea. Glucose drives sodium uptake, and water follows osmotically. This is secondary active transport powered by the basolateral pump.", "tags": ["step1-hy"], "source": "Hall & Hall, Guyton and Hall Textbook of Medical Physiology 14e, Ch.1-4", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0001", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "All preganglionic autonomic fibres and all postganglionic parasympathetic fibres release", "options": ["Acetylcholine", "Noradrenaline", "Adrenaline", "Dopamine", "ATP"], "answer": 0, "explanation": "Cholinergic fibres: every preganglionic fibre, every parasympathetic postganglionic fibre, and the sympathetic postganglionic fibres to sweat glands. Adrenergic: the remaining sympathetic postganglionic fibres.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0002", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "The nicotinic receptor at the neuromuscular junction is", "options": ["Nm (N1), blocked by tubocurarine", "Nn (N2), blocked by hexamethonium", "M1, blocked by pirenzepine", "M2, blocked by atropine", "Nn (N2), blocked by tubocurarine"], "answer": 0, "explanation": "Nm at skeletal muscle is blocked by tubocurarine and α-bungarotoxin; Nn at autonomic ganglia and the adrenal medulla is blocked by hexamethonium. Both are ligand-gated cation channels, not G-protein coupled.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0003", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "Nicotinic receptors differ from muscarinic receptors in that nicotinic receptors are", "options": ["Ligand-gated ion channels", "G-protein coupled receptors", "Tyrosine kinase receptors", "Intracellular receptors", "Enzyme-linked receptors"], "answer": 0, "explanation": "Nicotinic receptors are pentameric cation channels producing fast depolarisation. All five muscarinic subtypes are GPCRs and act more slowly through second messengers.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0004", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "M1, M3 and M5 receptors couple to", "options": ["Gq, activating phospholipase C", "Gi, inhibiting adenylyl cyclase", "Gs, activating adenylyl cyclase", "Ion channels directly", "Tyrosine kinase"], "answer": 0, "explanation": "Odd-numbered muscarinic receptors are Gq: PLC cleaves PIP2 to IP3 (calcium release) and DAG (PKC). Even-numbered (M2, M4) are Gi.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0005", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "M2 receptors in the heart couple to", "options": ["Gi, reducing cAMP and opening potassium channels", "Gq, raising calcium", "Gs, raising cAMP", "Ligand-gated sodium channels", "Gq, activating PKC"], "answer": 0, "explanation": "M2 is Gi-coupled: the α subunit inhibits adenylyl cyclase and the βγ subunits open GIRK potassium channels, hyperpolarising the SA node and slowing the heart. NOTE: your lecture figure shows the α subunit gating the potassium channel; the accepted mechanism is βγ. Written to βγ.", "tags": ["step1-hy", "contradiction"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0006", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "Stimulation of M3 receptors on vascular endothelium causes", "options": ["Nitric oxide release and vasodilation", "Direct smooth muscle contraction", "Increased heart rate", "Bronchodilation", "Reduced glandular secretion"], "answer": 0, "explanation": "Endothelial M3 activates NO synthase; NO diffuses to smooth muscle and raises cGMP, relaxing it. In denuded vessels, M3 on smooth muscle causes contraction instead.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0007", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "Which adrenergic receptor couples to Gi?", "options": ["α2", "α1", "β1", "β2", "β3"], "answer": 0, "explanation": "α1 is Gq, α2 is Gi, and all β receptors are Gs. Presynaptic α2 receptors provide negative feedback on noradrenaline release.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0008", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "α1 receptors act through", "options": ["Gq, phospholipase C, IP3 and DAG", "Gi, decreased cAMP", "Gs, increased cAMP", "Guanylyl cyclase and cGMP", "Ligand-gated chloride channels"], "answer": 0, "explanation": "α1 stimulation raises intracellular calcium via IP3 and activates PKC via DAG, contracting vascular smooth muscle, the pupil dilator and the bladder neck.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0009", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "β1 receptor stimulation in the heart increases", "options": ["Rate, contractility and conduction velocity", "Rate alone, with no change in contractility", "Contractility alone, with no change in rate", "Conduction time through the AV node", "Duration of the refractory period"], "answer": 0, "explanation": "β1 via Gs raises cAMP and PKA activity, phosphorylating L-type calcium channels (more calcium in), phospholamban (faster SERCA reuptake) and the funny channel (faster pacing). Chronotropy, inotropy, dromotropy and lusitropy all rise.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0010", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "β2 receptor stimulation in bronchial smooth muscle causes", "options": ["Relaxation via cAMP and PKA", "Contraction via IP3", "Relaxation via cGMP", "Contraction via calcium influx", "No effect; bronchi have only β1"], "answer": 0, "explanation": "β2 is Gs: PKA phosphorylates and inactivates myosin light chain kinase and lowers calcium sensitivity, relaxing smooth muscle. The same second messenger, cAMP, that increases cardiac contractility relaxes smooth muscle.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0011", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "The same rise in cAMP contracts cardiac muscle but relaxes smooth muscle because", "options": ["PKA phosphorylates different target proteins in the two cell types", "Smooth muscle lacks PKA", "Cardiac muscle uses cGMP instead", "Smooth muscle has no β receptors", "cAMP is degraded faster in cardiac muscle"], "answer": 0, "explanation": "In cardiac myocytes PKA targets calcium channels and phospholamban, increasing calcium transients. In smooth muscle PKA inactivates MLCK and activates MLC phosphatase pathways, so cross-bridge cycling falls. Response is set by substrates, not the messenger.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0012", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "β2 stimulation of skeletal muscle and liver produces", "options": ["Glycogenolysis and a shift of potassium into cells", "Glycogen synthesis and potassium efflux", "Lipogenesis", "Increased insulin secretion only", "Gluconeogenesis inhibition"], "answer": 0, "explanation": "β2 promotes glycogenolysis, gluconeogenesis, and Na+/K+-ATPase activity that drives potassium into cells. Salbutamol therefore raises glucose and lowers serum potassium.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0013", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "Insulin secretion from pancreatic β cells is inhibited by stimulation of", "options": ["α2 receptors", "β2 receptors", "α1 receptors", "M3 receptors", "β1 receptors"], "answer": 0, "explanation": "α2 via Gi suppresses insulin release, while β2 mildly stimulates it. NOTE: one slide in your lecture labels this effect α1 while two other slides say α2. Katzung and Guyton give α2. Written to α2. Raise with Dr. Abi Gerges.", "tags": ["step1-hy", "contradiction"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0014", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "β3 receptors are found mainly on", "options": ["Adipocytes and the bladder detrusor", "Cardiac pacemaker cells", "Bronchial smooth muscle", "Vascular smooth muscle", "Pupillary dilator"], "answer": 0, "explanation": "β3 drives lipolysis in fat and relaxes the detrusor during filling. Mirabegron, a β3 agonist, treats overactive bladder.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0015", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "Adrenaline differs from noradrenaline in that adrenaline", "options": ["Has high affinity for β2 receptors, whereas noradrenaline does not", "Has no effect on α receptors", "Acts only on β1 receptors", "Is released from sympathetic nerve terminals", "Cannot cross into the bloodstream"], "answer": 0, "explanation": "Both activate α1, α2 and β1. Only adrenaline is a potent β2 agonist, so circulating adrenaline dilates skeletal muscle vessels and bronchi whereas neuronal noradrenaline mainly constricts and raises pressure.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0016", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "Clonidine lowers blood pressure by", "options": ["Stimulating central α2 receptors to reduce sympathetic outflow", "Blocking α1 receptors on blood vessels", "Blocking β1 receptors on the heart", "Stimulating β2 receptors on vessels", "Depleting noradrenaline stores"], "answer": 0, "explanation": "Clonidine is an α2 agonist. Centrally it reduces sympathetic tone; presynaptically it reduces noradrenaline release. The paradox is that an adrenergic agonist lowers pressure because α2 is inhibitory.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0017", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "Acetylcholine is removed from the synapse mainly by", "options": ["Hydrolysis by acetylcholinesterase", "Reuptake into the nerve terminal", "Diffusion away from the cleft", "Monoamine oxidase", "Catechol-O-methyltransferase"], "answer": 0, "explanation": "Acetylcholinesterase in the cleft splits ACh into choline and acetate; choline is recycled. Noradrenaline, by contrast, is removed mainly by reuptake (NET) and then MAO or COMT.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0018", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "Noradrenaline action is terminated mainly by", "options": ["Reuptake into the presynaptic terminal", "Hydrolysis in the cleft", "Diffusion into the blood", "Uptake by glial cells only", "Binding to β receptors"], "answer": 0, "explanation": "The noradrenaline transporter (NET) recycles most released transmitter. Cocaine and tricyclics block it. MAO and COMT metabolise the remainder.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0019", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "Pilocarpine treats glaucoma by acting on", "options": ["M3 receptors of the sphincter pupillae and ciliary muscle", "α1 receptors of the dilator pupillae", "β2 receptors of the ciliary epithelium", "Nicotinic receptors in the ciliary ganglion", "M2 receptors on the lens"], "answer": 0, "explanation": "Muscarinic agonism contracts the sphincter (miosis) and ciliary muscle, which opens the trabecular meshwork and improves aqueous outflow.", "tags": ["step1-hy"], "source": "Katzung, Basic and Clinical Pharmacology 15e, Ch.6-9; Guyton and Hall 14e, Ch.61", "written": "2026-09-05", "status": "active"}, {"id": "F-PHY-L02-0020", "block": "Foundations", "discipline": "PHY", "unit": "F-PHY-L02", "system": "General", "type": "recall", "stem": "The classic effects of muscarinic overstimulation are summarised as", "options": ["Salivation, lacrimation, urination, dia
